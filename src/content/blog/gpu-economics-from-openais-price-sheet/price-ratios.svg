<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="bold" fill="#33362a">1 Model, 4 Prices</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">gpt-5.6-sol &#183; dollars per 1M tokens &#183; Sep 2026</text>

  <!-- Row 1: Cached input -->
  <text x="90" y="276" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Cached input <tspan font-weight="normal" fill="#75786a">&#8212; $0.40 (0.1&#215; fresh)</tspan></text>
  <rect x="90" y="294" width="18" height="40" fill="#a8bf92"/>
  <text x="90" y="392" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Hit: skip prefill compute, just point at stored KV bytes</text>

  <!-- Row 2: Fresh input -->
  <text x="90" y="448" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Fresh input <tspan font-weight="normal" fill="#75786a">&#8212; $4.00 (1&#215;)</tspan></text>
  <rect x="90" y="466" width="180" height="40" fill="#5b7c46"/>
  <text x="90" y="564" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Prefill: compute-bound, tensor cores run near peak</text>

  <!-- Row 3: Cache write -->
  <text x="90" y="620" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Cache write <tspan font-weight="normal" fill="#75786a">&#8212; $5.00 (1.25&#215;)</tspan></text>
  <rect x="90" y="638" width="225" height="40" fill="#c9973b"/>
  <text x="90" y="736" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Prefill plus writing ~160 KB per token into a cache tier</text>

  <!-- Row 4: Output -->
  <text x="90" y="792" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Output <tspan font-weight="normal" fill="#75786a">&#8212; $20.00 (5&#215;)</tspan></text>
  <rect x="90" y="810" width="900" height="40" fill="#b06a4e"/>
  <text x="90" y="908" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Decode: bandwidth-bound, re-reads the weights every token</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Data: OpenAI API pricing page, September 2026</text>
  <text x="90" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; econ-2</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">prices suggest optimization questions</text>
</svg>
