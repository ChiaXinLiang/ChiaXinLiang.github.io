<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="bold" fill="#33362a">Why Long Context Costs 2&#215;</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">same GPU, same weights &#8212; the KV cache eats the batch</text>

  <text x="600" y="272" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">288 GB of HBM per GPU: weights + everyone's KV cache</text>

  <!-- Left column: 8K context -->
  <rect x="170" y="300" width="320" height="560" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <!-- KV region (sage) -->
  <rect x="170" y="300" width="320" height="424" fill="#a8bf92"/>
  <line x1="170" y1="336" x2="490" y2="336" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="372" x2="490" y2="372" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="408" x2="490" y2="408" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="444" x2="490" y2="444" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="616" x2="490" y2="616" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="652" x2="490" y2="652" stroke="#e7edd9" stroke-width="2"/>
  <line x1="170" y1="688" x2="490" y2="688" stroke="#e7edd9" stroke-width="2"/>
  <text x="330" y="516" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="bold" fill="#33362a">KV: ~160 sequences</text>
  <text x="330" y="552" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#33362a">~1.3 GB each at 8K</text>
  <!-- weights block -->
  <rect x="170" y="724" width="320" height="136" fill="#75786a"/>
  <text x="330" y="800" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#fdfbf4">weights &#183; 70 GB</text>

  <text x="330" y="908" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">8K context</text>
  <text x="330" y="944" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#75786a">weight reads shared 160 ways</text>

  <!-- Right column: 128K context -->
  <rect x="710" y="300" width="320" height="560" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <!-- 10 KV blocks -->
  <rect x="710" y="330" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="370" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="410" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="450" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="490" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="530" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="570" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="610" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="650" width="320" height="32" fill="#f0ddd0"/>
  <rect x="710" y="690" width="320" height="32" fill="#f0ddd0"/>
  <text x="870" y="516" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="bold" fill="#8a5138">KV: ~10 sequences</text>
  <text x="870" y="552" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#8a5138">~20 GB each at 128K</text>
  <!-- weights block -->
  <rect x="710" y="724" width="320" height="136" fill="#75786a"/>
  <text x="870" y="800" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#fdfbf4">weights &#183; 70 GB</text>

  <text x="870" y="908" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">128K context</text>
  <text x="870" y="944" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#75786a">batch collapses, $/token climbs</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Illustrative: 70B-class dense model, FP8, GQA</text>
  <text x="90" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; econ-2</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">memory is the rent</text>
</svg>
