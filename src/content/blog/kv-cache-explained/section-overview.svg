<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">WHAT THE KV CACHE SAVES—AND WHAT IT COSTS</title><desc id="desc">Preserve prior state Store keys and values for earlier tokens Each decode step appends new K and V Queries for the new position are computed. Read state to attend Current Q compares against cached K Attention weights combine cached V Caching avoids old K/V projection work. Count memory explicitly M = 2 × L × H KV × d × n × b L: layers; n: total retained tokens b: bytes/element; 2 accounts for K and V. Manage physical blocks Logical tokens map to allocated blocks Share immutable prefixes where supported Paging improves allocation; raw state still grows.</desc><rect width="1200" height="1040" rx="20" fill="#faf9f4"/>
<text x="40" y="50" font-family="Arial, sans-serif" font-size="22" fill="#6845c0" font-weight="bold">SECTION OVERVIEW · METHOD + MECHANISM + EQUATIONS</text>
<text x="40" y="105" font-family="Arial, sans-serif" font-size="35" fill="#23282d" font-weight="bold">WHAT THE KV CACHE SAVES—AND WHAT IT COSTS</text>
<rect x="30" y="210" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="252" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">1. Preserve prior state</text>
<text x="72" y="289" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Store keys and values for earlier tokens</text>
<text x="72" y="320" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Each decode step appends new K and V</text>
<text x="72" y="351" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Queries for the new position are computed.</text>
<rect x="30" y="395" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="437" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">2. Read state to attend</text>
<text x="72" y="474" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Current Q compares against cached K</text>
<text x="72" y="505" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Attention weights combine cached V</text>
<text x="72" y="536" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Caching avoids old K/V projection work.</text>
<rect x="30" y="580" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="622" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">3. Count memory explicitly</text>
<text x="72" y="659" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">M = 2 × L × H KV × d × n × b</text>
<text x="72" y="690" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">L: layers; n: total retained tokens</text>
<text x="72" y="721" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">b: bytes/element; 2 accounts for K and V.</text>
<rect x="30" y="765" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="807" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">4. Manage physical blocks</text>
<text x="72" y="844" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Logical tokens map to allocated blocks</text>
<text x="72" y="875" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Share immutable prefixes where supported</text>
<text x="72" y="906" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Paging improves allocation; raw state still grows.</text>
<text x="40" y="1004" font-family="Arial, sans-serif" font-size="24" fill="#6845c0" font-weight="normal">Read 1 → 4, then use the section derivation to check the assumptions.</text>
</svg>