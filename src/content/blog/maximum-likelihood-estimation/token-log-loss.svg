<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="115" font-size="50" text-anchor="start" fill="#33362a">A product becomes a sum</text><text x="90" y="180" font-size="30" text-anchor="start" fill="#33362a">Observed-token probabilities: 0.5, 0.25, 0.8</text><rect x="90" y="300" width="320" height="210" rx="22" fill="#e7edd9"/><text x="250" y="375" font-size="34" text-anchor="middle" fill="#33362a">Token 1</text><text x="250" y="450" font-size="55" text-anchor="middle" fill="#33362a">0.5</text><rect x="440" y="300" width="320" height="210" rx="22" fill="#e7edd9"/><text x="600" y="375" font-size="34" text-anchor="middle" fill="#33362a">Token 2</text><text x="600" y="450" font-size="55" text-anchor="middle" fill="#33362a">0.25</text><rect x="790" y="300" width="320" height="210" rx="22" fill="#e7edd9"/><text x="950" y="375" font-size="34" text-anchor="middle" fill="#33362a">Token 3</text><text x="950" y="450" font-size="55" text-anchor="middle" fill="#33362a">0.8</text><text x="600" y="620" font-size="42" text-anchor="middle" fill="#33362a">Sequence probability = 0.1</text><text x="600" y="720" font-size="38" text-anchor="middle" fill="#33362a">Total negative log-likelihood = 2.3026</text><text x="600" y="810" font-size="38" text-anchor="middle" fill="#33362a">Mean token loss = 0.7675 nats</text><text x="600" y="910" font-size="36" text-anchor="middle" fill="#33362a">Perplexity = exp(0.7675) = 2.154</text><text x="90" y="1050" font-size="25" text-anchor="start" fill="#33362a">Worked Bernoulli example; likelihood model: DL Ch. 5</text><text x="90" y="1130" font-size="28" text-anchor="start" fill="#33362a">LLM Basics · stat-2</text></g><g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">NLL = −Σ log(pobserved);  perplexity = exp(mean NLL)</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">Product 0.5 × 0.25 × 0.8 = 0.1 → NLL 2.3026 nats</text></g></svg>