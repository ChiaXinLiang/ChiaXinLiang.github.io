<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The KV Memory Math</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Llama-3-8B, FP16 KV cache: 128 KB per token</text>

  <!-- Section 1 -->
  <text x="90" y="264" font-size="27" font-weight="bold" fill="#33362a">One request, stops at 700 tokens (8,192 max)</text>

  <text x="90" y="316" font-size="24" fill="#55584a">Static preallocation</text>
  <rect x="90" y="330" width="820" height="56" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="330" width="70" height="56" fill="#5b7c46"/>
  <text x="500" y="366" text-anchor="middle" font-size="24" fill="#75786a">91.5% reserved but never used</text>
  <text x="925" y="366" font-size="25" font-weight="bold" fill="#33362a">1 GB held</text>

  <text x="90" y="470" font-size="24" fill="#55584a">Paged, 16-token blocks (44 blocks × 2 MB)</text>
  <rect x="90" y="484" width="70" height="56" fill="#5b7c46"/>
  <rect x="160" y="484" width="8" height="56" fill="#a8bf92"/>
  <text x="185" y="520" font-size="25" font-weight="bold" fill="#33362a">88 MB used</text>
  <text x="380" y="520" font-size="24" fill="#75786a">worst-case waste: one block, 2 MB</text>

  <line x1="90" y1="586" x2="1110" y2="586" stroke="#e8e4d7" stroke-width="3"/>

  <!-- Section 2 -->
  <text x="90" y="644" font-size="27" font-weight="bold" fill="#33362a">Shared 2,000-token system prompt, 64 requests</text>

  <text x="90" y="694" font-size="24" fill="#55584a">No sharing: 64 identical copies of the prefix KV</text>
  <rect x="90" y="708" width="820" height="56" fill="#b06a4e"/>
  <text x="925" y="744" font-size="25" font-weight="bold" fill="#33362a">16 GB</text>

  <text x="90" y="826" font-size="24" fill="#55584a">Prefix cache (radix tree): one copy, 64 readers</text>
  <rect x="90" y="840" width="14" height="56" fill="#5b7c46"/>
  <text x="120" y="876" font-size="25" font-weight="bold" fill="#33362a">0.25 GB</text>

  <text x="90" y="948" font-size="26" fill="#33362a">15.75 GB of HBM freed for batching, and 2,000 tokens</text>
  <text x="90" y="982" font-size="26" fill="#33362a">of prefill compute skipped on every request.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · serve-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">count bytes first</text>
</svg>
