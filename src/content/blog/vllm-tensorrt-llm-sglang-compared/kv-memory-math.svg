<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The KV Memory Math</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Llama-3-8B, FP16 KV cache: 128 KiB per token</text>

  <!-- Section 1 -->
  <text x="90" y="264" font-size="27" font-weight="bold" fill="#33362a">1 request, stops at 700 tokens (8,192 max)</text>

  <text x="90" y="316" font-size="24" fill="#55584a">Static preallocation</text>
  <rect x="90" y="330" width="820" height="56" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="330" width="70" height="56" fill="#5b7c46"/>
  <text x="500" y="366" text-anchor="middle" font-size="24" fill="#75786a">91.5% reserved but never used</text>
  <text x="925" y="366" font-size="25" font-weight="bold" fill="#33362a">1 GiB held</text>

  <text x="90" y="470" font-size="24" fill="#55584a">Paged, 16-token blocks (44 blocks × 2 MiB)</text>
  <rect x="90" y="484" width="70" height="56" fill="#5b7c46"/>
  <rect x="160" y="484" width="8" height="56" fill="#a8bf92"/>
  <text x="185" y="520" font-size="25" font-weight="bold" fill="#33362a">88 MiB used</text>
  <text x="380" y="520" font-size="24" fill="#75786a">worst-case waste: 1 block, 2 MiB</text>

  <line x1="90" y1="586" x2="1110" y2="586" stroke="#e8e4d7" stroke-width="3"/>

  <!-- Section 2 -->
  <text x="90" y="644" font-size="27" font-weight="bold" fill="#33362a">Shared 2,000-token system prompt, 64 requests</text>

  <text x="90" y="694" font-size="24" fill="#55584a">No sharing: 64 identical copies of the prefix KV</text>
  <rect x="90" y="708" width="820" height="56" fill="#b06a4e"/>
  <text x="925" y="744" font-size="25" font-weight="bold" fill="#33362a">15.625 GiB</text>

  <text x="90" y="826" font-size="24" fill="#55584a">Prefix cache (radix tree): 1 copy, 64 readers</text>
  <rect x="90" y="840" width="14" height="56" fill="#5b7c46"/>
  <text x="120" y="876" font-size="25" font-weight="bold" fill="#33362a">0.244 GiB</text>

  <text x="90" y="948" font-size="26" fill="#33362a">15.381 GiB of HBM freed for batching, and 2,000 tokens</text>
  <text x="90" y="982" font-size="26" fill="#33362a">of prefill compute skipped on every request.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · serve-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">count bytes first</text>
</g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Allocated slots = block size × ceil(length / block size)</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">700 tokens → 16 × ceil(700/16) = 704 slots</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">704 × 128 KiB = 88 MiB; paging packs, it does not compress</text></svg>
