<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">All-to-All for MoE</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Route and preserve identity</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Token → selected experts plus combining</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">weights</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Sparse assignments are not a uniform all-to-</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">all</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Pack destination buffers</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Group assignments by expert owner and</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">retain inverse indices</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Counts and metadata must match payload</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">ordering</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Exchange and compute</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Remote token representations → owned</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">experts</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Hot experts and shared cuts can dominate the</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">tail</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Return and combine</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Inverse exchange → original token order →</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">weighted sum</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Measure the whole dispatch-compute-combine</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">program</text>
