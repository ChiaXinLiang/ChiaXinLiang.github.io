<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#5d7e45"/></marker></defs><rect width="1200" height="1200" fill="#fbf9f1"/><g font-family="Arial,sans-serif" fill="#34372b"><text x="60" y="85" font-size="47" fill="#34372b" text-anchor="start">A causal attention equation, with numbers</text><text x="60" y="145" font-size="29" fill="#787d6c" text-anchor="start">Toy vectors for 1 head; query at position 2; d<tspan baseline-shift="sub" font-size="20.88">k</tspan> = 2</text><rect x="60" y="200" width="1080" height="145" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="240" font-size="30" fill="#5d7e45" text-anchor="start">Inputs</text><text x="82" y="280" font-size="27" fill="#34372b" text-anchor="start">q₂ = [1, 0];  K rows = [1, 0], [0, 1], [1, 1]</text><text x="82" y="314" font-size="27" fill="#34372b" text-anchor="start">V rows = [2, 0], [0, 2], [1, 1]</text><rect x="60" y="405" width="1080" height="130" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="445" font-size="30" fill="#5d7e45" text-anchor="start">1. Dot products and scale</text><text x="82" y="485" font-size="27" fill="#34372b" text-anchor="start">q₂Kᵀ / √2 = [0.707107, 0, 0.707107]</text><path d="M600 350 V395" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="595" width="1080" height="130" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="635" font-size="30" fill="#5d7e45" text-anchor="start">2. Block the future position</text><text x="82" y="675" font-size="27" fill="#34372b" text-anchor="start">Scaled scores + mask = [0.707107, 0, −∞]</text><path d="M600 540 V585" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="785" width="1080" height="130" rx="15" fill="#f3e4d8" stroke="#5d7e45" stroke-width="3"/><text x="82" y="825" font-size="30" fill="#5d7e45" text-anchor="start">3. Normalize, then blend values</text><text x="82" y="865" font-size="27" fill="#34372b" text-anchor="start">a₂ = [0.669762, 0.330238, 0]</text><text x="82" y="899" font-size="27" fill="#34372b" text-anchor="start">o₂ = a₂V = [1.339523, 0.660477]</text><path d="M600 730 V775" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="60" y="995" font-size="29" fill="#34372b" text-anchor="start">The last value contributes 0 because it belongs to position 3.</text><text x="60" y="1050" font-size="29" fill="#34372b" text-anchor="start">The output is a weighted vector, not the selected token itself.</text><text x="60" y="1145" font-size="25" fill="#787d6c" text-anchor="start">Original numerical example of the scaled attention equation</text></g></svg>