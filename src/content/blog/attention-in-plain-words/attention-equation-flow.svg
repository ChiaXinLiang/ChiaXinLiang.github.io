<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#5d7e45"/></marker></defs><rect width="1200" height="1200" fill="#fbf9f1"/><g font-family="Arial,sans-serif" fill="#34372b"><text x="60" y="88" font-size="52" fill="#34372b" text-anchor="start">Why attention uses Q, K, and V</text><text x="60" y="145" font-size="29" fill="#787d6c" text-anchor="start">1 head • causal self-attention • rows are token positions</text><rect x="430" y="195" width="340" height="105" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="452" y="235" font-size="30" fill="#5d7e45" text-anchor="start">Input X</text><text x="452" y="275" font-size="27" fill="#34372b" text-anchor="start">Current representations</text><path d="M600 305 V325 H230 V350" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 305 V350" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 305 V325 H970 V350" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="365" width="330" height="130" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="405" font-size="30" fill="#5d7e45" text-anchor="start">Q = XW<tspan baseline-shift="sub" font-size="21.599999999999998">Q</tspan></text><text x="82" y="445" font-size="27" fill="#34372b" text-anchor="start">What to look for</text><text x="82" y="479" font-size="27" fill="#34372b" text-anchor="start">Shape: T × d<tspan baseline-shift="sub" font-size="19.439999999999998">k</tspan></text><rect x="435" y="365" width="330" height="130" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="457" y="405" font-size="30" fill="#5d7e45" text-anchor="start">K = XW<tspan baseline-shift="sub" font-size="21.599999999999998">K</tspan></text><text x="457" y="445" font-size="27" fill="#34372b" text-anchor="start">What can match</text><text x="457" y="479" font-size="27" fill="#34372b" text-anchor="start">Shape: T × d<tspan baseline-shift="sub" font-size="19.439999999999998">k</tspan></text><rect x="810" y="365" width="330" height="130" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="832" y="405" font-size="30" fill="#5d7e45" text-anchor="start">V = XW<tspan baseline-shift="sub" font-size="21.599999999999998">V</tspan></text><text x="832" y="445" font-size="27" fill="#34372b" text-anchor="start">What gets combined</text><text x="832" y="479" font-size="27" fill="#34372b" text-anchor="start">Shape: T × d<tspan baseline-shift="sub" font-size="19.439999999999998">v</tspan></text><path d="M225 500 V545" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M600 500 V525 H410 V545" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="560" width="560" height="125" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="600" font-size="30" fill="#5d7e45" text-anchor="start">1. Compare and scale</text><text x="82" y="640" font-size="27" fill="#34372b" text-anchor="start">S = QKᵀ / √d<tspan baseline-shift="sub" font-size="19.439999999999998">k</tspan></text><text x="82" y="674" font-size="27" fill="#34372b" text-anchor="start">Scores: T × T</text><path d="M340 690 V730" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="60" y="745" width="560" height="125" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="82" y="785" font-size="30" fill="#5d7e45" text-anchor="start">2. Mask, normalize each row</text><text x="82" y="825" font-size="27" fill="#34372b" text-anchor="start">A = softmax(S + M)</text><text x="82" y="859" font-size="27" fill="#34372b" text-anchor="start">Future positions: M = −∞</text><path d="M625 805 H680" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><path d="M975 500 V635 H900 V735" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="695" y="745" width="445" height="125" rx="15" fill="#f3e4d8" stroke="#5d7e45" stroke-width="3"/><text x="717" y="785" font-size="30" fill="#5d7e45" text-anchor="start">3. Combine the values</text><text x="717" y="825" font-size="27" fill="#34372b" text-anchor="start">O = AV</text><text x="717" y="859" font-size="27" fill="#34372b" text-anchor="start">Output: T × d<tspan baseline-shift="sub" font-size="19.439999999999998">v</tspan></text><text x="60" y="960" font-size="29" fill="#34372b" text-anchor="start">QKᵀ asks “which positions match?”; AV asks “what to gather?”</text><text x="60" y="1010" font-size="27" fill="#34372b" text-anchor="start">The mask enforces available information; √d<tspan baseline-shift="sub" font-size="19.439999999999998">k</tspan> controls score scale.</text><text x="60" y="1060" font-size="27" fill="#34372b" text-anchor="start">Multiple heads run this mechanism, then concatenate and project.</text><text x="60" y="1145" font-size="25" fill="#787d6c" text-anchor="start">Adapted with equations from Vaswani et al. (2017), Figure 2</text></g></svg>