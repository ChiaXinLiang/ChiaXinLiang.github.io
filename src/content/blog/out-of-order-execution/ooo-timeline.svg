<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">In-Order vs Out-of-Order Timing</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">LOAD takes 4 cycles, MUL 3, ADD and SUB 1 · one start per cycle</text>

  <!-- Panel A: in-order -->
  <text x="90" y="272" font-size="30" font-weight="bold" fill="#33362a">In-order: 8 cycles</text>
  <!-- grid -->
  <line x1="310" y1="292" x2="310" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="405" y1="292" x2="405" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="500" y1="292" x2="500" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="595" y1="292" x2="595" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="690" y1="292" x2="690" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="785" y1="292" x2="785" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="880" y1="292" x2="880" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="975" y1="292" x2="975" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="1070" y1="292" x2="1070" y2="516" stroke="#e8e4d7" stroke-width="2"/>
  <!-- row labels -->
  <text x="295" y="327" text-anchor="end" font-size="26" fill="#55584a">I1</text>
  <text x="295" y="383" text-anchor="end" font-size="26" fill="#55584a">I2</text>
  <text x="295" y="439" text-anchor="end" font-size="26" fill="#55584a">I3</text>
  <text x="295" y="495" text-anchor="end" font-size="26" fill="#55584a">I4</text>
  <!-- bars -->
  <rect x="313" y="300" width="374" height="40" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="500" y="327" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a5138">LOAD</text>

  <rect x="313" y="356" width="374" height="40" rx="6" fill="none" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="383" text-anchor="middle" font-size="22" fill="#a3a08f">waiting for R1</text>
  <rect x="693" y="356" width="89" height="40" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="737" y="383" text-anchor="middle" font-size="22" font-weight="bold" fill="#33362a">ADD</text>

  <rect x="313" y="412" width="469" height="40" rx="6" fill="none" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="547" y="439" text-anchor="middle" font-size="22" fill="#a3a08f">ready, but stuck in line</text>
  <rect x="788" y="412" width="279" height="40" rx="6" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="927" y="439" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5a20">MUL</text>

  <rect x="313" y="468" width="564" height="40" rx="6" fill="none" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="595" y="495" text-anchor="middle" font-size="22" fill="#a3a08f">ready, but stuck in line</text>
  <rect x="883" y="468" width="89" height="40" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="927" y="495" text-anchor="middle" font-size="22" font-weight="bold" fill="#33362a">SUB</text>
  <!-- cycle numbers -->
  <text x="295" y="545" text-anchor="end" font-size="22" fill="#75786a">cycle</text>
  <text x="357" y="545" text-anchor="middle" font-size="24" fill="#75786a">1</text>
  <text x="452" y="545" text-anchor="middle" font-size="24" fill="#75786a">2</text>
  <text x="547" y="545" text-anchor="middle" font-size="24" fill="#75786a">3</text>
  <text x="642" y="545" text-anchor="middle" font-size="24" fill="#75786a">4</text>
  <text x="737" y="545" text-anchor="middle" font-size="24" fill="#75786a">5</text>
  <text x="832" y="545" text-anchor="middle" font-size="24" fill="#75786a">6</text>
  <text x="927" y="545" text-anchor="middle" font-size="24" fill="#75786a">7</text>
  <text x="1022" y="545" text-anchor="middle" font-size="24" fill="#75786a">8</text>

  <!-- Panel B: out-of-order -->
  <text x="90" y="622" font-size="30" font-weight="bold" fill="#33362a">Out-of-order: 5 cycles</text>
  <line x1="310" y1="642" x2="310" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="405" y1="642" x2="405" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="500" y1="642" x2="500" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="595" y1="642" x2="595" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="690" y1="642" x2="690" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="785" y1="642" x2="785" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="880" y1="642" x2="880" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="975" y1="642" x2="975" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <line x1="1070" y1="642" x2="1070" y2="866" stroke="#e8e4d7" stroke-width="2"/>
  <text x="295" y="677" text-anchor="end" font-size="26" fill="#55584a">I1</text>
  <text x="295" y="733" text-anchor="end" font-size="26" fill="#55584a">I2</text>
  <text x="295" y="789" text-anchor="end" font-size="26" fill="#55584a">I3</text>
  <text x="295" y="845" text-anchor="end" font-size="26" fill="#55584a">I4</text>

  <rect x="313" y="650" width="374" height="40" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="500" y="677" text-anchor="middle" font-size="24" font-weight="bold" fill="#8a5138">LOAD</text>

  <rect x="313" y="706" width="374" height="40" rx="6" fill="none" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="500" y="733" text-anchor="middle" font-size="22" fill="#a3a08f">waiting for R1</text>
  <rect x="693" y="706" width="89" height="40" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="737" y="733" text-anchor="middle" font-size="22" font-weight="bold" fill="#33362a">ADD</text>

  <rect x="408" y="762" width="279" height="40" rx="6" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="547" y="789" text-anchor="middle" font-size="22" font-weight="bold" fill="#7a5a20">MUL</text>

  <rect x="503" y="818" width="89" height="40" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="547" y="845" text-anchor="middle" font-size="22" font-weight="bold" fill="#33362a">SUB</text>

  <text x="295" y="895" text-anchor="end" font-size="22" fill="#75786a">cycle</text>
  <text x="357" y="895" text-anchor="middle" font-size="24" fill="#75786a">1</text>
  <text x="452" y="895" text-anchor="middle" font-size="24" fill="#75786a">2</text>
  <text x="547" y="895" text-anchor="middle" font-size="24" fill="#75786a">3</text>
  <text x="642" y="895" text-anchor="middle" font-size="24" fill="#75786a">4</text>
  <text x="737" y="895" text-anchor="middle" font-size="24" fill="#75786a">5</text>
  <text x="832" y="895" text-anchor="middle" font-size="24" fill="#75786a">6</text>
  <text x="927" y="895" text-anchor="middle" font-size="24" fill="#75786a">7</text>
  <text x="1022" y="895" text-anchor="middle" font-size="24" fill="#75786a">8</text>

  <text x="600" y="945" text-anchor="middle" font-size="24" fill="#5b7c46">MUL and SUB slide into the shadow of the load</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch · arch-3</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">hide the wait</text>
</svg>
