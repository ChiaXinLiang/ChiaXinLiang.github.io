<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">(A₂,b₂) after (A₁,b₁) gives (A₂A₁, A₂b₁ + b₂): order cannot be swapped.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">A full prefix scan also distributes prefix information; the tree shown illustrates composition.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Structured transitions and memory-aware kernels determine actual work and execution cost.</text>
