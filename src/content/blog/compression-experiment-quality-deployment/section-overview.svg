<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img">
<title>A compression experiment accepts an operating point</title>
<rect width="1400" height="1000" fill="#f7fbff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#367bb5"/></marker></defs>
<text x="50" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17334a">A compression experiment accepts an operating point</text>
<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">Controlled candidates are compared under the same quality, workload, and execution protocol</text>
<text x="90" y="195" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Candidate matrix</text>
<text x="85" y="290" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Reference</text>
<rect x="250" y="250" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<rect x="325" y="250" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<rect x="400" y="250" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<text x="85" y="405" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Quantized</text>
<rect x="250" y="365" width="60" height="60" rx="10" fill="#14a6a0" stroke="none" stroke-width="2"/>
<rect x="325" y="365" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<rect x="400" y="365" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<text x="85" y="520" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Distilled</text>
<rect x="250" y="480" width="60" height="60" rx="10" fill="#de7d58" stroke="none" stroke-width="2"/>
<rect x="325" y="480" width="60" height="60" rx="10" fill="#14a6a0" stroke="none" stroke-width="2"/>
<rect x="400" y="480" width="60" height="60" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<path d="M650 700L1270 700" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M650 700L650 245" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<rect x="655" y="255" width="350" height="345" rx="0" fill="#e6f5ee" stroke="none" stroke-width="2"/>
<path d="M1010 250L1010 700" stroke="#b67723" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<path d="M650 600L1270 600" stroke="#b67723" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<circle cx="760" cy="410" r="12" fill="#14a6a0"/>
<text x="778" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">A</text>
<circle cx="880" cy="470" r="12" fill="#14a6a0"/>
<text x="898" y="470" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">B</text>
<circle cx="1120" cy="360" r="12" fill="#de7d58"/>
<text x="1138" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">C</text>
<circle cx="790" cy="650" r="12" fill="#de7d58"/>
<text x="808" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">D</text>
<text x="805" y="760" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Latency →</text>
<text x="675" y="230" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Quality ↑</text>
<text x="1050" y="580" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#17334a">Threshold</text>
<text x="90" y="665" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Same evaluation data</text>
<text x="90" y="715" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Same generation budget</text>
<text x="90" y="765" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Actual exported backend</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Only candidates meeting every required constraint are accepted; uncertainty matters near boundaries.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Serialized size, peak allocation, preparation cost, and inference time are separate evidence.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Points and example values are illustrative; this article reports no executed GPU benchmark.</text>
</svg>