<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Bandwidth = Width &#215; Rate</text>
  <text x="90" y="156" font-size="30" fill="#75786a">HBM wins on wires, not on clock speed</text>

  <!-- DDR5 block -->
  <text x="90" y="300" font-size="32" font-weight="bold" fill="#33362a">DDR5-6400 module</text>
  <rect x="90" y="330" width="58" height="64" fill="#c9973b"/>
  <text x="170" y="371" font-size="27" fill="#55584a">64 data wires</text>
  <text x="90" y="448" font-size="27" fill="#55584a">64 &#215; 6.4 Gb/s per wire  =  51.2 GB/s</text>

  <!-- HBM block -->
  <text x="90" y="580" font-size="32" font-weight="bold" fill="#33362a">HBM3e stack</text>
  <rect x="90" y="610" width="922" height="64" fill="#5b7c46"/>
  <text x="100" y="651" font-size="27" fill="#fdfbf4">1,024 data wires</text>
  <text x="90" y="728" font-size="27" fill="#55584a">1,024 &#215; 9.6 Gb/s per wire  &#8776;  1.2 TB/s</text>

  <!-- callout -->
  <rect x="90" y="790" width="1020" height="160" rx="14" fill="#e7edd9"/>
  <text x="120" y="850" font-size="28" fill="#33362a">Per-wire speed differs by 1.5&#215;. The width differs by 16&#215;.</text>
  <text x="120" y="905" font-size="28" fill="#33362a">8 stacks at 1 TB/s give 8 TB/s; rate assumptions differ.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; mem-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">width beats clock</text>
</svg>
