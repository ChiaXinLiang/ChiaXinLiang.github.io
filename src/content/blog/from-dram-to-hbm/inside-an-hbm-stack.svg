<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Memory Goes Vertical</text>
  <text x="90" y="156" font-size="30" fill="#75786a">An HBM stack beside the GPU on a silicon interposer</text>

  <!-- package substrate -->
  <rect x="110" y="810" width="980" height="90" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="600" y="866" font-size="26" fill="#75786a" text-anchor="middle">package substrate</text>

  <!-- interposer -->
  <rect x="150" y="730" width="900" height="70" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="600" y="774" font-size="26" fill="#7a5a20" text-anchor="middle">silicon interposer &#8212; fine chip-scale wiring</text>

  <!-- GPU die -->
  <rect x="600" y="470" width="440" height="250" fill="#f0ddd0" stroke="#b06a4e" stroke-width="4"/>
  <text x="820" y="608" font-size="36" font-weight="bold" fill="#8a5138" text-anchor="middle">GPU die</text>

  <!-- HBM base die -->
  <rect x="150" y="660" width="360" height="60" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
  <text x="330" y="698" font-size="24" fill="#55584a" text-anchor="middle">base logic die</text>

  <!-- DRAM dies (8), pitch 40, h 32 -->
  <rect x="150" y="620" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="580" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="540" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="500" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="460" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="420" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="380" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="150" y="340" width="360" height="32" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>

  <!-- TSVs -->
  <line x1="210" y1="346" x2="210" y2="652" stroke="#b06a4e" stroke-width="4"/>
  <line x1="270" y1="346" x2="270" y2="652" stroke="#b06a4e" stroke-width="4"/>
  <line x1="330" y1="346" x2="330" y2="652" stroke="#b06a4e" stroke-width="4"/>
  <line x1="390" y1="346" x2="390" y2="652" stroke="#b06a4e" stroke-width="4"/>
  <line x1="450" y1="346" x2="450" y2="652" stroke="#b06a4e" stroke-width="4"/>

  <!-- stack annotation -->
  <text x="330" y="262" font-size="26" fill="#55584a" text-anchor="middle">HBM stack: 8&#8211;12 thinned DRAM dies,</text>
  <text x="330" y="296" font-size="26" fill="#55584a" text-anchor="middle">copper TSVs run through each</text>
  <line x1="330" y1="308" x2="330" y2="334" stroke="#a3a08f" stroke-width="2"/>

  <!-- right annotation -->
  <text x="820" y="290" font-size="26" fill="#55584a" text-anchor="middle">the stack sits millimetres away:</text>
  <text x="820" y="324" font-size="26" fill="#55584a" text-anchor="middle">1,024 wires per stack cross</text>
  <text x="820" y="358" font-size="26" fill="#55584a" text-anchor="middle">the interposer underneath</text>
  <polyline points="700,378 556,378 556,722" fill="none" stroke="#a3a08f" stroke-width="2"/>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; mem-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">bandwidth is geometry</text>
</svg>
