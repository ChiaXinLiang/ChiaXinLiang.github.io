<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Raw KV size per conversation</text><text x="90" y="162" font-size="28" fill="#55584a">32 layers · 8 KV heads · 128 dimensions</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Per cached token</text><text x="125" y="340" font-size="28">2 × 32 × 8 × 128 × 2 bytes</text><text x="125" y="398" font-size="28" font-weight="700">128 KiB</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">4096-token context</text><text x="125" y="585" font-size="28">4096 × 128 KiB</text><text x="125" y="643" font-size="28" font-weight="700">512 MiB per sequence</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">32768-token context</text><text x="125" y="830" font-size="28">32768 × 128 KiB</text><text x="125" y="888" font-size="28" font-weight="700">4 GiB per sequence</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">AI Performance · case-7</text></g></g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">KV bytes = m × Σ(retained sequence tokens)</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">m = 128 KiB/token; 4096 → 512 MiB; 32768 → 4 GiB</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">8× history means 8× raw KV; total latency need not grow 8×</text></svg>