<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">HOW A PRODUCER–CONSUMER KERNEL WORKS</title><desc id="desc">Producer loads a tile Move global data into shared memory Publish readiness only after completion Loads for tile j+1 overlap math for tile j. Consumers compute Wait for the tile-ready barrier Read the tile; execute matrix operations Release the stage after all readers finish. Reuse a bounded buffer Stages cycle through empty → full Never overwrite a tile still being read Pipeline depth trades overlap for capacity. Measure steady-state benefit Ideal stage time ≈ max(T load, T math) Include fill, drain, barriers, and contention More stages can reduce residency; measure.</desc><rect width="1200" height="1040" rx="20" fill="#faf9f4"/>
<text x="40" y="50" font-family="Arial, sans-serif" font-size="22" fill="#6845c0" font-weight="bold">SECTION OVERVIEW · METHOD + MECHANISM + EQUATIONS</text>
<text x="40" y="105" font-family="Arial, sans-serif" font-size="35" fill="#23282d" font-weight="bold">HOW A PRODUCER–CONSUMER KERNEL WORKS</text>
<rect x="30" y="210" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="252" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">1. Producer loads a tile</text>
<text x="72" y="289" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Move global data into shared memory</text>
<text x="72" y="320" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Publish readiness only after completion</text>
<text x="72" y="351" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Loads for tile j+1 overlap math for tile j.</text>
<rect x="30" y="395" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="437" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">2. Consumers compute</text>
<text x="72" y="474" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Wait for the tile-ready barrier</text>
<text x="72" y="505" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Read the tile; execute matrix operations</text>
<text x="72" y="536" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Release the stage after all readers finish.</text>
<rect x="30" y="580" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="622" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">3. Reuse a bounded buffer</text>
<text x="72" y="659" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Stages cycle through empty → full</text>
<text x="72" y="690" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Never overwrite a tile still being read</text>
<text x="72" y="721" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Pipeline depth trades overlap for capacity.</text>
<rect x="30" y="765" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="807" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">4. Measure steady-state benefit</text>
<text x="72" y="844" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Ideal stage time ≈ max(T load, T math)</text>
<text x="72" y="875" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Include fill, drain, barriers, and contention</text>
<text x="72" y="906" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">More stages can reduce residency; measure.</text>
<text x="40" y="1004" font-family="Arial, sans-serif" font-size="24" fill="#6845c0" font-weight="normal">Read 1 → 4, then use the section derivation to check the assumptions.</text>
</svg>