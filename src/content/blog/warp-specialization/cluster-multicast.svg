<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">TMA Multicast Across a Cluster</text>
  <text x="90" y="156" font-size="30" fill="#75786a">1 HBM fetch fills 4 SMs' shared memories</text>

  <defs>
    <marker id="arrT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b06a4e"/>
    </marker>
    <marker id="arrG2" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#a3a08f"/>
    </marker>
  </defs>

  <!-- HBM -->
  <rect x="300" y="250" width="600" height="90" rx="12" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="600" y="290" font-size="29" font-weight="bold" fill="#8a5138" text-anchor="middle">HBM3 · 3.35 TB/s</text>
  <text x="600" y="324" font-size="25" fill="#8a5138" text-anchor="middle">B tile read from DRAM once</text>

  <!-- arrow to L2 -->
  <line x1="600" y1="340" x2="600" y2="425" stroke="#b06a4e" stroke-width="5" marker-end="url(#arrT)"/>
  <text x="625" y="395" font-size="24" fill="#75786a">1 32 KB fetch</text>

  <!-- L2 -->
  <rect x="440" y="435" width="320" height="80" rx="12" fill="#f4f1e6" stroke="#a3a08f" stroke-width="3"/>
  <text x="600" y="484" font-size="28" font-weight="bold" fill="#55584a" text-anchor="middle">L2 cache</text>

  <!-- fan-out arrows -->
  <line x1="600" y1="515" x2="195" y2="630" stroke="#b06a4e" stroke-width="4" marker-end="url(#arrT)"/>
  <line x1="600" y1="515" x2="465" y2="630" stroke="#b06a4e" stroke-width="4" marker-end="url(#arrT)"/>
  <line x1="600" y1="515" x2="735" y2="630" stroke="#b06a4e" stroke-width="4" marker-end="url(#arrT)"/>
  <line x1="600" y1="515" x2="1005" y2="630" stroke="#b06a4e" stroke-width="4" marker-end="url(#arrT)"/>
  <text x="235" y="550" font-size="25" font-weight="bold" fill="#8a5138" text-anchor="middle">TMA multicast</text>

  <!-- SM boxes -->
  <g>
    <rect x="90" y="640" width="210" height="190" rx="14" fill="none" stroke="#5b7c46" stroke-width="3"/>
    <text x="195" y="685" font-size="27" font-weight="bold" fill="#33362a" text-anchor="middle">SM 0 · block 0</text>
    <rect x="115" y="710" width="160" height="90" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
    <text x="195" y="748" font-size="24" fill="#33362a" text-anchor="middle">SMEM</text>
    <text x="195" y="781" font-size="24" fill="#5b7c46" text-anchor="middle">B tile copy</text>
  </g>
  <g>
    <rect x="360" y="640" width="210" height="190" rx="14" fill="none" stroke="#5b7c46" stroke-width="3"/>
    <text x="465" y="685" font-size="27" font-weight="bold" fill="#33362a" text-anchor="middle">SM 1 · block 1</text>
    <rect x="385" y="710" width="160" height="90" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
    <text x="465" y="748" font-size="24" fill="#33362a" text-anchor="middle">SMEM</text>
    <text x="465" y="781" font-size="24" fill="#5b7c46" text-anchor="middle">B tile copy</text>
  </g>
  <g>
    <rect x="630" y="640" width="210" height="190" rx="14" fill="none" stroke="#5b7c46" stroke-width="3"/>
    <text x="735" y="685" font-size="27" font-weight="bold" fill="#33362a" text-anchor="middle">SM 2 · block 2</text>
    <rect x="655" y="710" width="160" height="90" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
    <text x="735" y="748" font-size="24" fill="#33362a" text-anchor="middle">SMEM</text>
    <text x="735" y="781" font-size="24" fill="#5b7c46" text-anchor="middle">B tile copy</text>
  </g>
  <g>
    <rect x="900" y="640" width="210" height="190" rx="14" fill="none" stroke="#5b7c46" stroke-width="3"/>
    <text x="1005" y="685" font-size="27" font-weight="bold" fill="#33362a" text-anchor="middle">SM 3 · block 3</text>
    <rect x="925" y="710" width="160" height="90" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
    <text x="1005" y="748" font-size="24" fill="#33362a" text-anchor="middle">SMEM</text>
    <text x="1005" y="781" font-size="24" fill="#5b7c46" text-anchor="middle">B tile copy</text>
  </g>

  <!-- DSMEM links -->
  <line x1="300" y1="870" x2="360" y2="870" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <line x1="360" y1="885" x2="300" y2="885" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <line x1="570" y1="870" x2="630" y2="870" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <line x1="630" y1="885" x2="570" y2="885" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <line x1="840" y1="870" x2="900" y2="870" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <line x1="900" y1="885" x2="840" y2="885" stroke="#a3a08f" stroke-width="4" marker-end="url(#arrG2)"/>
  <text x="600" y="940" font-size="25" fill="#75786a" text-anchor="middle">DSMEM: any block reads or writes its neighbors' SMEM</text>

  <!-- note -->
  <text x="935" y="565" font-size="25" font-weight="bold" fill="#5b7c46" text-anchor="middle">4x less HBM traffic</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-size="24" fill="#a3a08f">Hopper thread block clusters, co-scheduled on 1 GPC</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · ktune-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">fetch once, feed 4</text>
</svg>
