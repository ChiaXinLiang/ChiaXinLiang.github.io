<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">3 chunks: 18 ms &#8594; 10 ms</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Pipelining hides 8 of the 12 copy milliseconds</text>

  <!-- serialized section -->
  <text x="270" y="272" font-size="26" fill="#55584a">Serialized (default stream)</text>
  <text x="1110" y="272" text-anchor="end" font-size="26" font-weight="bold" fill="#75786a">18 ms</text>
  <!-- serial bar: 9 segments of 93.3px from x=270 -->
  <rect x="270" y="285" width="93.3" height="60" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <text x="316.7" y="323" text-anchor="middle" font-size="24" fill="#33362a">H1</text>
  <rect x="363.3" y="285" width="93.3" height="60" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="410" y="323" text-anchor="middle" font-size="24" fill="#33362a">K1</text>
  <rect x="456.7" y="285" width="93.3" height="60" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
