<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The hidden barrier in stream 0</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">One stream-0 call stalls all blocking streams</text>

  <!-- barrier band -->
  <rect x="640" y="252" width="150" height="478" fill="#e5b3a6" fill-opacity="0.30"/>
  <line x1="640" y1="248" x2="640" y2="730" stroke="#b04a3a" stroke-width="3" stroke-dasharray="10 8"/>
  <line x1="790" y1="248" x2="790" y2="730" stroke="#b04a3a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="715" y="238" text-anchor="middle" font-size="24" font-weight="bold" fill="#b04a3a">implicit barrier</text>

  <!-- lane: stream 1 -->
  <text x="95" y="313" font-size="26" fill="#55584a">stream 1</text>
  <rect x="290" y="270" width="150" height="70" rx="8" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="365" y="313" text-anchor="middle" font-size="24" fill="#33362a">kernel</text>
  <rect x="460" y="270" width="150" height="70" rx="8" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="535" y="313" text-anchor="middle" font-size="24" fill="#33362a">copy</text>
  <rect x="830" y="270" width="150" height="70" rx="8" fill="#f4f1e6" stroke="#a3a08f" stroke-width="2.5"/>
  <text x="905" y="313" text-anchor="middle" font-size="24" fill="#75786a">waits</text>

  <!-- lane: stream 2 -->
  <text x="95" y="433" font-size="26" fill="#55584a">stream 2</text>
  <rect x="330" y="390" width="180" height="70" rx="8" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="420" y="433" text-anchor="middle" font-size="24" fill="#33362a">kernel</text>
  <rect x="860" y="390" width="180" height="70" rx="8" fill="#f4f1e6" stroke="#a3a08f" stroke-width="2.5"/>
  <text x="950" y="433" text-anchor="middle" font-size="24" fill="#75786a">waits</text>

  <!-- lane: stream 3 -->
  <text x="95" y="553" font-size="26" fill="#55584a">stream 3</text>
  <rect x="290" y="510" width="130" height="70" rx="8" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="355" y="553" text-anchor="middle" font-size="24" fill="#33362a">copy</text>
  <rect x="440" y="510" width="170" height="70" rx="8" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="525" y="553" text-anchor="middle" font-size="24" fill="#33362a">kernel</text>
  <rect x="830" y="510" width="150" height="70" rx="8" fill="#f4f1e6" stroke="#a3a08f" stroke-width="2.5"/>
  <text x="905" y="553" text-anchor="middle" font-size="24" fill="#75786a">waits</text>

  <!-- lane: stream 0 -->
  <text x="95" y="673" font-size="26" fill="#55584a">stream 0 (legacy)</text>
  <rect x="640" y="630" width="150" height="70" rx="8" fill="#e5b3a6" stroke="#b04a3a" stroke-width="3"/>
  <text x="715" y="673" text-anchor="middle" font-size="24" font-weight="bold" fill="#b04a3a">memcpy</text>

  <!-- time axis -->
  <line x1="270" y1="750" x2="1100" y2="750" stroke="#d8d4c4" stroke-width="2.5"/>
  <path d="M 1100 750 l -16 -8 v 16 z" fill="#d8d4c4"/>
  <text x="1100" y="788" text-anchor="end" font-size="24" fill="#75786a">time</text>

  <!-- annotation -->
  <text x="600" y="842" text-anchor="middle" font-size="26" fill="#55584a">Work left of the band must finish before the</text>
  <text x="600" y="880" text-anchor="middle" font-size="26" fill="#55584a">stream-0 call; work right of it cannot start.</text>
  <text x="600" y="932" text-anchor="middle" font-size="26" fill="#75786a">cudaStreamNonBlocking streams ignore this barrier.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; orch-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">One queue stalls all</text>
</svg>
