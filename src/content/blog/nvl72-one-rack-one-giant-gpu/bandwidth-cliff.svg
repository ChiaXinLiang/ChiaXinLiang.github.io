<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">The bandwidth cliff</text>
<text x="90" y="156" font-size="30" fill="#75786a">Per-GPU bandwidth to peers, inside vs. outside the NVL72</text>

<!-- bar 1: NVLink -->
<text x="90" y="300" font-size="28" font-weight="bold" fill="#33362a">Inside the rack · NVLink 5</text>
<rect x="90" y="318" width="990" height="90" rx="8" fill="#5b7c46"/>
<text x="1060" y="374" text-anchor="end" font-size="32" font-weight="bold" fill="#e7edd9">900 GB/s per GPU, 1 way</text>

<!-- bar 2: InfiniBand -->
<text x="90" y="558" font-size="28" font-weight="bold" fill="#33362a">Across racks · InfiniBand 400G</text>
<rect x="90" y="576" width="55" height="90" rx="4" fill="#b06a4e"/>
<text x="160" y="632" font-size="32" font-weight="bold" fill="#8a5138">50 GB/s per GPU</text>

<!-- 36x annotation -->
<path d="M 1080 418 V 621 H 480" fill="none" stroke="#b04a3a" stroke-width="3" stroke-dasharray="9 8"/>
<path d="M 480 621 l 18 -9 v 18 z" fill="#b04a3a"/>
<text x="785" y="600" text-anchor="middle" font-size="30" font-weight="bold" fill="#b04a3a">18× less per-GPU bandwidth</text>

<!-- traffic panels -->
<rect x="90" y="730" width="490" height="200" rx="12" fill="#e7edd9" stroke="#a8bf92" stroke-width="2"/>
<text x="120" y="778" font-size="28" font-weight="bold" fill="#5b7c46">Stays on NVLink</text>
<text x="120" y="820" font-size="24" fill="#55584a">tensor-parallel all-reduce</text>
<text x="120" y="856" font-size="24" fill="#55584a">MoE all-to-all routing</text>
<text x="120" y="892" font-size="24" fill="#55584a">every layer, every token</text>

<rect x="620" y="730" width="490" height="200" rx="12" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
<text x="650" y="778" font-size="28" font-weight="bold" fill="#8a5138">Crosses InfiniBand</text>
<text x="650" y="820" font-size="24" fill="#55584a">data-parallel gradient sync</text>
<text x="650" y="856" font-size="24" fill="#55584a">pipeline-stage boundaries</text>
<text x="650" y="892" font-size="24" fill="#55584a">infrequent, overlappable</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1078" font-size="24" fill="#a3a08f">Data: NVIDIA NVLink 5 and InfiniBand NDR specs</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · rack-1</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">bandwidth has borders</text>
</svg>
