<!-- stat column -->
<text x="740" y="300" font-size="36" font-weight="bold" fill="#33362a">72 GPUs + 36 CPUs</text>
<text x="740" y="340" font-size="24" fill="#75786a">Blackwell GPUs, Grace CPUs</text>

<text x="740" y="435" font-size="36" font-weight="bold" fill="#33362a">13.5 TB HBM3e</text>
<text x="740" y="475" font-size="24" fill="#75786a">576 TB/s aggregate HBM b/w</text>

<text x="740" y="570" font-size="36" font-weight="bold" fill="#33362a">130 TB/s NVLink</text>
<text x="740" y="610" font-size="24" fill="#75786a">all-to-all, 1 switch hop</text>

<text x="740" y="705" font-size="36" font-weight="bold" fill="#33362a">1.4 EF FP4</text>
<text x="740" y="745" font-size="24" fill="#75786a">2:4 sparsity; dense is half</text>

<text x="740" y="840" font-size="36" font-weight="bold" fill="#33362a">~130 kW</text>
<text x="740" y="880" font-size="24" fill="#75786a">direct liquid cooling</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1078" font-size="24" fill="#a3a08f">Data: NVIDIA GB200 NVL72 specifications</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · rack-1</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">the rack is the GPU</text>
