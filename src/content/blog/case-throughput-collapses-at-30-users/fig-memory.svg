<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue, Arial, sans-serif"><text x="90" y="105" font-size="43" fill="#33362a" font-weight="bold">An 80 GB GPU memory budget</text><text x="90" y="155" font-size="28" fill="#75786a" font-weight="normal">Read the assumptions before applying the result</text><rect x="90" y="220" width="1020" height="190" rx="12" fill="#e7edd9"/><text x="125" y="269" font-size="31" fill="#33362a" font-weight="bold">FIXED COSTS</text><text x="125" y="319" font-size="32" fill="#33362a" font-weight="normal">37 GB weights + 3 GB activations</text><text x="125" y="368" font-size="32" fill="#55584a" font-weight="normal">8 GB reserved for runtime/headroom</text><text x="595" y="445" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="455" width="1020" height="190" rx="12" fill="#f7ecd2"/><text x="125" y="504" font-size="31" fill="#33362a" font-weight="bold">KV POOL</text><text x="125" y="554" font-size="32" fill="#33362a" font-weight="normal">80 − 37 − 3 − 8 = 32 GB</text><text x="125" y="603" font-size="32" fill="#55584a" font-weight="normal">1.34 GB per representative request</text><text x="595" y="680" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="690" width="1020" height="190" rx="12" fill="#f0ddd0"/><text x="125" y="739" font-size="31" fill="#33362a" font-weight="bold">ADMISSION BOUND</text><text x="125" y="789" font-size="32" fill="#33362a" font-weight="normal">floor(32 / 1.34) = 23 requests</text><text x="125" y="838" font-size="32" fill="#55584a" font-weight="normal">The next request must wait</text><text x="90" y="1020" font-size="24" fill="#75786a" font-weight="normal">Illustrative budget · Llama 3 architecture; decimal GB</text><path d="M90 1080H1110" stroke="#e8e4d7" stroke-width="3"/><text x="90" y="1135" font-size="28" fill="#a3a08f" font-weight="bold">AI Performance · case-2</text></g></svg>