<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue, Arial, sans-serif"><text x="90" y="105" font-size="43" fill="#33362a" font-weight="bold">The preemption feedback loop</text><text x="90" y="155" font-size="28" fill="#75786a" font-weight="normal">Read the assumptions before applying the result</text><rect x="90" y="220" width="1020" height="190" rx="12" fill="#e7edd9"/><text x="125" y="269" font-size="31" fill="#33362a" font-weight="bold">POOL FULL</text><text x="125" y="319" font-size="32" fill="#33362a" font-weight="normal">Scheduler preempts a sequence</text><text x="125" y="368" font-size="32" fill="#55584a" font-weight="normal">Its discarded KV must be rebuilt</text><text x="595" y="445" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="455" width="1020" height="190" rx="12" fill="#f7ecd2"/><text x="125" y="504" font-size="31" fill="#33362a" font-weight="bold">RECOMPUTE</text><text x="125" y="554" font-size="32" fill="#33362a" font-weight="normal">Prefill consumes compute and time</text><text x="125" y="603" font-size="32" fill="#55584a" font-weight="normal">Active decodes make less progress</text><text x="595" y="680" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="690" width="1020" height="190" rx="12" fill="#f0ddd0"/><text x="125" y="739" font-size="31" fill="#33362a" font-weight="bold">BREAK THE LOOP</text><text x="125" y="789" font-size="32" fill="#33362a" font-weight="normal">Admit by KV token budget</text><text x="125" y="838" font-size="32" fill="#55584a" font-weight="normal">Use validated KV quantization</text><text x="90" y="1020" font-size="24" fill="#75786a" font-weight="normal">Original scheduler schematic · vLLM preemption docs</text><path d="M90 1080H1110" stroke="#e8e4d7" stroke-width="3"/><text x="90" y="1135" font-size="28" fill="#a3a08f" font-weight="bold">AI Performance · case-2</text></g></svg>