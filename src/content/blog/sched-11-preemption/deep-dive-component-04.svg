 x="93" y="518" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Objective: victim count</text><text x="93" y="552" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">A wins in this declared comparison</text><rect x="625" y="480" width="500" height="120" rx="8" fill="#fff4e3" stroke="#b8c5d3" stroke-width="2"/><text x="643" y="518" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Hard deadline / protection</text><text x="643" y="552" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">May exclude A before cost comparison</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Fewest jobs, fewest GPUs and least lost work are different objectives; hard constraints stay separate.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>