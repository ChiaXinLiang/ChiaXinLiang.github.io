" stroke-width="1"/><text x="493.3333333333333" y="570" fill="#627183" font-size="20" text-anchor="middle" font-weight="normal">2</text><path d="M766.6666666666666,540 L766.6666666666666,220" fill="none" stroke="#e6ecf2" stroke-width="1"/><text x="766.6666666666666" y="570" fill="#627183" font-size="20" text-anchor="middle" font-weight="normal">4</text><path d="M1040.0,540 L1040.0,220" fill="none" stroke="#e6ecf2" stroke-width="1"/><text x="1040.0" y="570" fill="#627183" font-size="20" text-anchor="middle" font-weight="normal">6</text><text x="1040" y="595" fill="#627183" font-size="23" text-anchor="end" font-weight="normal">Recovery exposure (GPU-hours)</text><text x="50" y="312" fill="#172c46" font-size="23" text-anchor="start" font-weight="bold">8-GPU victim</text><rect x="220" y="280" width="546.6666666666666" height="62" rx="0" fill="#eaf3fb" stroke="white" stroke-width="2"/><text x="493.3333333333333" y="320" fill="#172c46" font-size="25" text-anchor="middle" font-weight="bold">4</text><rect x="766.6666666666666" y="280" width="273.3333333333333" height="62" rx="0" fill="#e9f5ef" stroke="white" stroke-width="2"/><text x="903.3333333333333" y="320" fill="#172c46" font-size="25" text-anchor="middle" font-weight="bold">2</text><text x="50" y="452" fill="#172c46" font-size="23" text-anchor="start" font-weight="bold">16-GPU victim</text><rect x="220" y="420" width="182.2222222222222" height="62" rx="0" fill="#eaf3fb" stroke="white" stroke-width="2"/><text x="311.1111111111111" y="460" fill="#172c46" font-size="25" text-anchor="middle" font-weight="bold">1.33</text><rect x="402.2222222222222" y="420" width="364.4444444444444" height="62" rx="0" fill="#e9f5ef" stroke="white" stroke-width="2"/><text x="584.4444444444443" y="460" fill="#172c46" font-size="25" text-anchor="middle" font-weight="bold">2.67</text><text x="230" y="625" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Rollback = GPUs × checkpoint age; restart = GPUs × nonproductive restart time</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">8-GPU exposure: 4 + 2 = 6. 16-GPU exposure: 1.33 + 2.67 = 4; other costs excluded.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>