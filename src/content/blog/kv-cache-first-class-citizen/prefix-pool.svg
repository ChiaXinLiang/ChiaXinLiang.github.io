<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Pay Prefill Once, Reuse Everywhere</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Prefix hashing maps identical blocks to one cache entry</text>

  <!-- Request A -->
  <text x="90" y="262" font-size="24" fill="#75786a">Request A</text>
  <rect x="90" y="272" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="190" y="272" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="290" y="272" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="390" y="272" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="490" y="272" width="90" height="56" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>

  <!-- Request B -->
  <text x="90" y="384" font-size="24" fill="#75786a">Request B</text>
  <rect x="90" y="394" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="190" y="394" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="290" y="394" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="390" y="394" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="490" y="394" width="90" height="56" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>

  <!-- Request C -->
  <text x="90" y="506" font-size="24" fill="#75786a">Request C</text>
  <rect x="90" y="516" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="190" y="516" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="290" y="516" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="390" y="516" width="90" height="56" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <rect x="490" y="516" width="90" height="56" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>

  <!-- legend -->
  <text x="90" y="622" font-size="24" fill="#5b7c46">green: shared prefix b0..b3</text>
  <text x="90" y="658" font-size="24" fill="#b06a4e">orange: unique user turn</text>

  <!-- arrows to pool -->
  <line x1="588" y1="300" x2="672" y2="388" stroke="#a3a08f" stroke-width="3"/>
  <polygon points="690,392 672,382 674,398" fill="#a3a08f"/>
  <line x1="588" y1="422" x2="672" y2="422" stroke="#a3a08f" stroke-width="3"/>
  <polygon points="690,422 674,414 674,430" fill="#a3a08f"/>
  <line x1="588" y1="544" x2="672" y2="454" stroke="#a3a08f" stroke-width="3"/>
  <polygon points="690,450 672,446 676,462" fill="#a3a08f"/>

  <!-- pool box -->
  <rect x="690" y="250" width="420" height="390" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="900" y="302" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">Global KV cache pool</text>
  <text x="900" y="352" text-anchor="middle" font-size="24" fill="#55584a">hash(b0) &#8594; node2 &#183; HBM</text>
  <text x="900" y="392" text-anchor="middle" font-size="24" fill="#55584a">hash(b0..b1) &#8594; node2 &#183; HBM</text>
  <text x="900" y="432" text-anchor="middle" font-size="24" fill="#55584a">hash(b0..b2) &#8594; node2 &#183; HBM</text>
  <text x="900" y="472" text-anchor="middle" font-size="24" fill="#55584a">hash(b0..b3) &#8594; node5 &#183; DRAM</text>
  <line x1="720" y1="505" x2="1080" y2="505" stroke="#d8d4c4" stroke-width="2"/>
  <text x="900" y="548" text-anchor="middle" font-size="24" font-weight="bold" fill="#5b7c46">hit rate on b0..b3: 100%</text>
  <text x="900" y="588" text-anchor="middle" font-size="24" fill="#55584a">prefill paid once: &#8776; 0.6 s</text>

  <!-- bottom summary -->
  <text x="600" y="762" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">Every later request pays a fetch, not a prefill</text>
  <text x="600" y="812" text-anchor="middle" font-size="26" fill="#b04a3a">recompute 2,000-token prefix: &#8776; 560 ms GPU time</text>
  <text x="600" y="857" text-anchor="middle" font-size="26" fill="#5b7c46">fetch 0.655 GB of cached KV from DRAM: &#8776; 10 ms</text>
  <text x="600" y="905" text-anchor="middle" font-size="26" fill="#75786a">10,000 requests/hour &#8594; 1.6 GPU-hours saved, every hour</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; scale-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">hash once, serve many</text>
</svg>
