<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="110" font-size="44" font-weight="bold">The 1-GPU memory budget</text><text x="90" y="168" font-size="27" fill="#55584a">4-bit illustration; decimal GB</text><rect x="90" y="230" width="1020" height="195" rx="20" fill="#e7edd9"/><text x="130" y="308" font-size="49" font-weight="bold">37.19 GB</text><text x="130" y="365" font-size="30">Weights + illustrative metadata</text><rect x="90" y="465" width="1020" height="195" rx="20" fill="#f0ddd0"/><text x="130" y="543" font-size="49" font-weight="bold">34.81 GB</text><text x="130" y="600" font-size="30">Available logical KV-cache pool</text><rect x="90" y="700" width="1020" height="195" rx="20" fill="#f7ecd2"/><text x="130" y="778" font-size="49" font-weight="bold">8.00 GB</text><text x="130" y="835" font-size="30">Assumed runtime + safety headroom</text><text x="90" y="1010" font-size="24" fill="#75786a">Original calculation; assumptions in article.</text><line x1="90" y1="1080" x2="1110" y2="1080" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1132" font-size="28" fill="#5b7c46">AI Performance · math-1</text></g></g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Fit: weights + KV + workspace + runtime + margin ≤ device</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">Cache pool: 80 − 37.1875 − 8 = 34.8125 GB</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">Decimal GB; 4-bit metadata and 8-GB headroom are assumptions</text></svg>