<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>Attention: why Q, K, and V have different roles</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="40" y="58" font-family="Arial" font-size="32" font-weight="700" fill="#252a20">Attention: why Q, K, and V have different roles</text>
<rect x="390" y="90" width="420" height="105" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="600.0" y="124" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">1. Token representations X</text>
<text x="600.0" y="162" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Learned projections prepare three roles</text>
<rect x="40" y="245" width="340" height="132" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="210.0" y="279" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">Q = XWQ</text>
<text x="210.0" y="317" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Query: what is relevant?</text>
<text x="210.0" y="345" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">One vector per query position</text>
<rect x="430" y="245" width="340" height="132" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="600.0" y="279" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">K = XWK</text>
<text x="600.0" y="317" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Key: how is content addressed?</text>
<text x="600.0" y="345" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">One vector per retained position</text>
<rect x="820" y="245" width="340" height="132" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="990.0" y="279" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">V = XWV</text>
<text x="990.0" y="317" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Value: what content is retrieved?</text>
<text x="990.0" y="345" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">One vector per retained position</text>
<path d="M600 195L600 218L210 218L210 241" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<path d="M600 195L600 218L600 218L600 241" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<path d="M600 195L600 218L990 218L990 241" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="425" width="730" height="140" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="405.0" y="459" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">2. Score and normalize</text>
<text x="405.0" y="497" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">QKᵀ / √dh + mask → softmax → probabilities</text>
<text x="405.0" y="525" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">The scale controls score variance; the mask enforces causality</text>
<path d="M210 377L210 421" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<path d="M600 377L600 421" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<rect x="820" y="425" width="340" height="140" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="990.0" y="459" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">3. Retrieve content</text>
<text x="990.0" y="497" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Probabilities × V</text>
<text x="990.0" y="525" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Weighted value vectors</text>
<path d="M990 377L990 421" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<path d="M770 495L816 495" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
<rect x="40" y="625" width="1120" height="155" rx="15" fill="white" stroke="#bfa9de" stroke-width="2"/>
<text x="600.0" y="659" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#7545c8">4. Head sharing changes the cached representation</text>
<text x="600.0" y="697" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">MHA: one KV head per query head   |   MQA: one KV head for all queries</text>
<text x="600.0" y="725" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">GQA: groups of queries share each KV head; queries can still attend differently</text>
<text x="600.0" y="753" text-anchor="middle" font-family="Arial" font-size="20" fill="#252a20">Simple cache bytes = 2 × batch × layers × tokens × KV heads × head width × bytes</text>
<path d="M990 565L990 621" fill="none" stroke="#7545c8" stroke-width="3" marker-end="url(#a)"/>
</svg>