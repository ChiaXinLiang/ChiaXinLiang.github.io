<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>FlashAttention: Online Softmax, Exact Tiling, and the I/O Model</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">FlashAttention</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Load one query tile</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Q tile remains on chip while K and V tiles</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">stream through</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Scores are temporary, not a full HBM matrix</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Update stable statistics</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">New maximum rescales the old sum and</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">weighted output</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">m, l, and u summarize every processed key</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Normalize once</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Output = u / l after all allowed key tiles</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Causal masks and empty rows require explicit</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">handling</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Measure the serving phase</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Prefill: many queries; decode: a small</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">number of queries</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Saved traffic does not guarantee the same</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">request speedup</text>
<path d="M598 272L619 272" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M876 429L876 462" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M620 612L599 612" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="44" y="812" font-family="Arial,sans-serif" font-size="18" fill="#555b4b">Read the article for derivations, assumptions, and worked examples.</text>
</svg>