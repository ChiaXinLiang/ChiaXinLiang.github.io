<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Hiding memory latency</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">1 stalled thread vs. a scheduler full of ready warps</text>

<!-- CPU section -->
<text x="100" y="268" font-size="28" font-weight="bold" fill="#33362a">CPU: 1 thread, 1 long wait</text>
<rect x="200" y="295" width="150" height="60" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<text x="275" y="333" text-anchor="middle" font-size="24" fill="#33362a">compute</text>
<rect x="350" y="295" width="560" height="60" fill="#f4f1e6" stroke="#a3a08f" stroke-width="2" stroke-dasharray="8 6"/>
<text x="630" y="333" text-anchor="middle" font-size="24" fill="#75786a">stalled on DRAM (~500 cycles)</text>
<rect x="910" y="295" width="170" height="60" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<text x="995" y="333" text-anchor="middle" font-size="24" fill="#33362a">compute</text>
<text x="130" y="333" text-anchor="end" font-size="24" fill="#55584a">T0</text>

<!-- time arrow -->
<line x1="200" y1="400" x2="1060" y2="400" stroke="#75786a" stroke-width="2"/>
<path d="M 1060 400 L 1044 392 L 1044 408 Z" fill="#75786a"/>
<text x="1080" y="408" font-size="24" fill="#75786a" text-anchor="start">time</text>

<!-- GPU section -->
<text x="100" y="500" font-size="28" font-weight="bold" fill="#33362a">GPU: scheduler selects a ready warp</text>

<!-- W0 -->
<text x="160" y="575" text-anchor="middle" font-size="24" fill="#55584a">W0</text>
<rect x="200" y="540" width="110" height="55" fill="#5b7c46"/>
<rect x="310" y="540" width="330" height="55" fill="#e7edd9"/>
<rect x="640" y="540" width="110" height="55" fill="#5b7c46"/>
<rect x="750" y="540" width="330" height="55" fill="#e7edd9"/>
<!-- W1 -->
<text x="160" y="645" text-anchor="middle" font-size="24" fill="#55584a">W1</text>
<rect x="200" y="610" width="110" height="55" fill="#e7edd9"/>
<rect x="310" y="610" width="110" height="55" fill="#5b7c46"/>
<rect x="420" y="610" width="330" height="55" fill="#e7edd9"/>
<rect x="750" y="610" width="110" height="55" fill="#5b7c46"/>
<rect x="860" y="610" width="220" height="55" fill="#e7edd9"/>
<!-- W2 -->
<text x="160" y="715" text-anchor="middle" font-size="24" fill="#55584a">W2</text>
<rect x="200" y="680" width="220" height="55" fill="#e7edd9"/>
<rect x="420" y="680" width="110" height="55" fill="#5b7c46"/>
<rect x="530" y="680" width="330" height="55" fill="#e7edd9"/>
<rect x="860" y="680" width="110" height="55" fill="#5b7c46"/>
<rect x="970" y="680" width="110" height="55" fill="#e7edd9"/>
<!-- W3 -->
<text x="160" y="785" text-anchor="middle" font-size="24" fill="#55584a">W3</text>
<rect x="200" y="750" width="330" height="55" fill="#e7edd9"/>
<rect x="530" y="750" width="110" height="55" fill="#5b7c46"/>
<rect x="640" y="750" width="330" height="55" fill="#e7edd9"/>
<rect x="970" y="750" width="110" height="55" fill="#5b7c46"/>

<!-- legend -->
<rect x="200" y="845" width="34" height="34" fill="#5b7c46"/>
<text x="248" y="871" font-size="24" fill="#55584a">issuing instructions</text>
<rect x="530" y="845" width="34" height="34" fill="#e7edd9"/>
<text x="578" y="871" font-size="24" fill="#55584a">waiting on memory</text>

<text x="600" y="940" text-anchor="middle" font-size="26" fill="#33362a">Resident contexts keep their state in registers;</text>
<text x="600" y="975" text-anchor="middle" font-size="26" fill="#33362a">no register-context copy is needed between ready warps.</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; par-2</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">never wait alone</text>
</svg>
