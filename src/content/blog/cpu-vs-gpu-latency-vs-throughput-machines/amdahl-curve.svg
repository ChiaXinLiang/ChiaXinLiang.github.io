<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Amdahl's law with 1% serial</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Speedup = 1 / (0.01 + 0.99 / N)</text>

<!-- gridlines -->
<line x1="180" y1="740" x2="1060" y2="740" stroke="#e8e4d7" stroke-width="2"/>
<line x1="180" y1="580" x2="1060" y2="580" stroke="#e8e4d7" stroke-width="2"/>
<line x1="180" y1="420" x2="1060" y2="420" stroke="#e8e4d7" stroke-width="2"/>

<!-- asymptote -->
<line x1="180" y1="260" x2="1060" y2="260" stroke="#b04a3a" stroke-width="3" stroke-dasharray="12 9"/>
<text x="1055" y="245" text-anchor="end" font-size="26" font-weight="bold" fill="#b04a3a">ceiling: 100x, no matter how many lanes</text>

<!-- axes -->
<line x1="180" y1="900" x2="1060" y2="900" stroke="#75786a" stroke-width="3"/>
<line x1="180" y1="900" x2="180" y2="250" stroke="#75786a" stroke-width="3"/>

<!-- y labels -->
<text x="160" y="908" text-anchor="end" font-size="24" fill="#75786a">0</text>
<text x="160" y="748" text-anchor="end" font-size="24" fill="#75786a">25x</text>
<text x="160" y="588" text-anchor="end" font-size="24" fill="#75786a">50x</text>
<text x="160" y="428" text-anchor="end" font-size="24" fill="#75786a">75x</text>
<text x="160" y="268" text-anchor="end" font-size="24" fill="#75786a">100x</text>

<!-- x labels -->
<text x="180" y="942" text-anchor="middle" font-size="24" fill="#75786a">1</text>
<text x="400" y="942" text-anchor="middle" font-size="24" fill="#75786a">8</text>
<text x="620" y="942" text-anchor="middle" font-size="24" fill="#75786a">64</text>
<text x="840" y="942" text-anchor="middle" font-size="24" fill="#75786a">512</text>
<text x="1060" y="942" text-anchor="middle" font-size="24" fill="#75786a">4096</text>
<text x="620" y="985" text-anchor="middle" font-size="26" fill="#75786a">parallel lanes N (log scale)</text>

<!-- curve -->
<polyline fill="none" stroke="#5b7c46" stroke-width="5"
points="180,893.6 253,887.3 327,875.2 400,852.1 473,811 547,743.7 620,648.7 693,539.1 767,438.5 840,363.7 913,316.4 987,289.5 1060,275.1"/>

<!-- marked points -->
<circle cx="693" cy="539.1" r="10" fill="#b06a4e"/>
<text x="663" y="530" text-anchor="end" font-size="25" fill="#8a5138">128 lanes: 56x</text>
<circle cx="913" cy="316.4" r="10" fill="#b06a4e"/>
<text x="885" y="345" text-anchor="end" font-size="25" fill="#8a5138">1,024 lanes: 91x</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1078" font-size="24" fill="#a3a08f">Curve computed from Amdahl (1967), serial fraction 0.01</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; par-2</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">the serial tax</text>
</svg>
