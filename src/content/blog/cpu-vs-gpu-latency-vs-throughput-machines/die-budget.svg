<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Where the transistors go</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Same silicon budget, opposite priorities</text>

<!-- CPU panel -->
<text x="335" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">CPU: latency machine</text>
<rect x="100" y="285" width="470" height="615" fill="none" stroke="#d8d4c4" stroke-width="3"/>
<!-- control block -->
<rect x="115" y="300" width="440" height="185" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
<text x="335" y="375" text-anchor="middle" font-size="30" font-weight="bold" fill="#8a5138">Control</text>
<text x="335" y="415" text-anchor="middle" font-size="24" fill="#8a5138">branch prediction</text>
<text x="335" y="448" text-anchor="middle" font-size="24" fill="#8a5138">out-of-order scheduling</text>
<!-- cache block -->
<rect x="115" y="500" width="440" height="250" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="335" y="610" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a5a20">Cache</text>
<text x="335" y="650" text-anchor="middle" font-size="24" fill="#7a5a20">L1 / L2 / L3, tens of MB</text>
<!-- ALUs -->
<rect x="115" y="765" width="100" height="120" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<rect x="228" y="765" width="100" height="120" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<rect x="341" y="765" width="100" height="120" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<rect x="454" y="765" width="100" height="120" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
<text x="165" y="832" text-anchor="middle" font-size="24" font-weight="bold" fill="#33362a">ALU</text>
<text x="278" y="832" text-anchor="middle" font-size="24" font-weight="bold" fill="#33362a">ALU</text>
<text x="391" y="832" text-anchor="middle" font-size="24" font-weight="bold" fill="#33362a">ALU</text>
<text x="504" y="832" text-anchor="middle" font-size="24" font-weight="bold" fill="#33362a">ALU</text>

<!-- GPU panel -->
<text x="865" y="255" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">GPU: throughput machine</text>
<rect x="630" y="285" width="470" height="615" fill="none" stroke="#d8d4c4" stroke-width="3"/>
<!-- thin control strip -->
<rect x="645" y="300" width="440" height="48" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
<text x="865" y="333" text-anchor="middle" font-size="24" fill="#8a5138">Control</text>
<!-- thin cache strip -->
<rect x="645" y="360" width="440" height="48" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="865" y="393" text-anchor="middle" font-size="24" fill="#7a5a20">Cache</text>
