<text x="865" y="945" text-anchor="middle" font-size="24" fill="#55584a">thousands of simple ALU lanes</text>
<text x="335" y="945" text-anchor="middle" font-size="24" fill="#55584a">a few fast cores, mostly cache and control</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1078" font-size="24" fill="#a3a08f">Redrawn from NVIDIA CUDA C++ Programming Guide, Fig. 1</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; par-2</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">area is destiny</text>
