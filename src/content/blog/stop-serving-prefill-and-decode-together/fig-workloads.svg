<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Prefill and Decode: Two Machines</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Illustrative ceilings (70B BF16 weights; H100 bandwidth)</text>

  <!-- Left panel: PREFILL -->
  <rect x="90" y="230" width="495" height="690" rx="16" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
  <text x="337" y="300" text-anchor="middle" font-size="40" font-weight="bold" fill="#5b7c46">PREFILL</text>
  <text x="337" y="345" text-anchor="middle" font-size="26" fill="#55584a">compute-bound</text>
  <text x="337" y="410" text-anchor="middle" font-size="27" fill="#33362a">One pass over the whole prompt</text>
  <text x="337" y="456" text-anchor="middle" font-size="27" fill="#33362a">Big batched matmuls,</text>
  <text x="337" y="502" text-anchor="middle" font-size="27" fill="#33362a">high arithmetic intensity</text>
  <text x="337" y="548" text-anchor="middle" font-size="27" fill="#33362a">Cost grows with prompt length</text>
  <text x="337" y="594" text-anchor="middle" font-size="27" fill="#33362a">8,192 tokens = ~2.9 s compute</text>
  <text x="337" y="640" text-anchor="middle" font-size="27" font-weight="bold" fill="#5b7c46">Metric: TTFT</text>

  <text x="130" y="712" font-size="24" fill="#55584a">Tensor-core utilization</text>
  <rect x="130" y="724" width="360" height="28" rx="6" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="130" y="724" width="252" height="28" rx="6" fill="#5b7c46"/>
  <text x="500" y="746" font-size="24" fill="#55584a">~70%</text>

  <text x="130" y="812" font-size="24" fill="#55584a">HBM bandwidth utilization</text>
  <rect x="130" y="824" width="360" height="28" rx="6" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="130" y="824" width="90" height="28" rx="6" fill="#a8bf92"/>
  <text x="500" y="846" font-size="24" fill="#55584a">~25%</text>

  <!-- Right panel: DECODE -->
  <rect x="615" y="230" width="495" height="690" rx="16" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="862" y="300" text-anchor="middle" font-size="40" font-weight="bold" fill="#8a5138">DECODE</text>
  <text x="862" y="345" text-anchor="middle" font-size="26" fill="#55584a">memory-bound</text>
  <text x="862" y="410" text-anchor="middle" font-size="27" fill="#33362a">One token per step, per stream</text>
  <text x="862" y="456" text-anchor="middle" font-size="27" fill="#33362a">Re-reads all weights + KV cache</text>
  <text x="862" y="502" text-anchor="middle" font-size="27" fill="#33362a">every single step</text>
  <text x="862" y="548" text-anchor="middle" font-size="27" fill="#33362a">Floor: 140 GB / 3.35 TB/s</text>
  <text x="862" y="594" text-anchor="middle" font-size="27" fill="#33362a">= ~42 ms per step</text>
  <text x="862" y="640" text-anchor="middle" font-size="27" font-weight="bold" fill="#8a5138">Metric: TPOT</text>

  <text x="655" y="712" font-size="24" fill="#55584a">Tensor-core utilization</text>
  <rect x="655" y="724" width="360" height="28" rx="6" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="655" y="724" width="25" height="28" rx="6" fill="#b06a4e"/>
  <text x="1025" y="746" font-size="24" fill="#55584a">~5%</text>

  <text x="655" y="812" font-size="24" fill="#55584a">HBM bandwidth utilization</text>
  <rect x="655" y="824" width="360" height="28" rx="6" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="655" y="824" width="324" height="28" rx="6" fill="#b06a4e"/>
  <text x="1025" y="846" font-size="24" fill="#55584a">~90%</text>

  <text x="600" y="975" text-anchor="middle" font-size="26" fill="#75786a">The two phases often benefit from different configurations.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · scale-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">know your bottleneck</text>
</svg>
