<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Disaggregated Serving, Operator View</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Separate pools, explicit KV handoff, admission control up front</text>

  <!-- Router -->
  <rect x="380" y="240" width="440" height="130" rx="14" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="600" y="295" text-anchor="middle" font-size="32" font-weight="bold" fill="#7a5a20">Router / scheduler</text>
  <text x="600" y="340" text-anchor="middle" font-size="24" fill="#55584a">early rejection under overload protects p99</text>

  <!-- Arrows router -> pools -->
  <line x1="470" y1="370" x2="330" y2="462" stroke="#75786a" stroke-width="4"/>
  <polygon points="320,470 336,452 346,468" fill="#75786a"/>
  <line x1="730" y1="370" x2="870" y2="462" stroke="#75786a" stroke-width="4"/>
  <polygon points="880,470 854,468 864,452" fill="#75786a"/>
  <text x="330" y="425" text-anchor="end" font-size="24" fill="#75786a">new prompts</text>
  <text x="870" y="425" text-anchor="start" font-size="24" fill="#75786a">short prompts may</text>
  <text x="870" y="455" text-anchor="start" font-size="24" fill="#75786a">skip the split</text>

  <!-- Prefill pool -->
  <rect x="100" y="480" width="440" height="270" rx="16" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
  <text x="320" y="540" text-anchor="middle" font-size="32" font-weight="bold" fill="#5b7c46">PREFILL POOL</text>
  <text x="320" y="595" text-anchor="middle" font-size="25" fill="#33362a">compute-optimized GPUs</text>
  <text x="320" y="640" text-anchor="middle" font-size="25" fill="#33362a">TP sized for TTFT</text>
  <text x="320" y="685" text-anchor="middle" font-size="25" fill="#33362a">runs prompt to first token</text>

  <!-- Decode pool -->
  <rect x="660" y="480" width="440" height="270" rx="16" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="880" y="540" text-anchor="middle" font-size="32" font-weight="bold" fill="#8a5138">DECODE POOL</text>
  <text x="880" y="595" text-anchor="middle" font-size="25" fill="#33362a">bandwidth-optimized GPUs</text>
  <text x="880" y="640" text-anchor="middle" font-size="25" fill="#33362a">large batches, steady TPOT</text>
  <text x="880" y="685" text-anchor="middle" font-size="25" fill="#33362a">holds the growing KV cache</text>

  <!-- KV handoff arrow between pools -->
  <line x1="540" y1="615" x2="642" y2="615" stroke="#33362a" stroke-width="6"/>
  <polygon points="656,615 634,603 634,627" fill="#33362a"/>
  <text x="600" y="590" text-anchor="middle" font-size="24" font-weight="bold" fill="#33362a">KV</text>

  <text x="600" y="805" text-anchor="middle" font-size="26" fill="#55584a">Layer-by-layer KV streaming over NVLink / RDMA</text>
  <text x="600" y="845" text-anchor="middle" font-size="26" fill="#55584a">overlaps the transfer with prefill compute</text>

  <!-- Stats band -->
  <rect x="90" y="880" width="1020" height="95" rx="12" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="600" y="918" text-anchor="middle" font-size="25" fill="#33362a">MLPerf v5.1: disaggregation ≈ 1.5x aggregated throughput under SLA</text>
  <text x="600" y="955" text-anchor="middle" font-size="25" fill="#75786a">In production at Meta, DeepSeek, Perplexity · open in vLLM, SGLang, Dynamo</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · scale-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">split the pools</text>
</svg>
