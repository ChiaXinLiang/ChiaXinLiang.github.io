<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">How to Read a Benchmark</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">7 questions before trusting a tokens/sec claim</text>

  <rect x="120" y="268" width="22" height="22" fill="#5b7c46"/>
  <text x="175" y="290" font-size="29" font-weight="bold" fill="#33362a">Per-user or aggregate?</text>
  <text x="175" y="326" font-size="24" fill="#75786a">a 100x ambiguity if left unstated</text>

  <rect x="120" y="368" width="22" height="22" fill="#b06a4e"/>
  <text x="175" y="390" font-size="29" font-weight="bold" fill="#33362a">What batch size?</text>
  <text x="175" y="426" font-size="24" fill="#75786a">batch 1 flatters latency; batch 256 flatters throughput</text>

  <rect x="120" y="468" width="22" height="22" fill="#c9973b"/>
  <text x="175" y="490" font-size="29" font-weight="bold" fill="#33362a">What context length?</text>
  <text x="175" y="526" font-size="24" fill="#75786a">short prompts can double the number (less KV traffic)</text>

  <rect x="120" y="568" width="22" height="22" fill="#5b7c46"/>
  <text x="175" y="590" font-size="29" font-weight="bold" fill="#33362a">What precision?</text>
  <text x="175" y="626" font-size="24" fill="#75786a">FP16, FP8, and INT4 sit on different bandwidth ceilings</text>

  <rect x="120" y="668" width="22" height="22" fill="#b06a4e"/>
  <text x="175" y="690" font-size="29" font-weight="bold" fill="#33362a">Is TTFT included?</text>
  <text x="175" y="726" font-size="24" fill="#75786a">excluding prefill flatters short responses</text>

  <rect x="120" y="768" width="22" height="22" fill="#c9973b"/>
  <text x="175" y="790" font-size="29" font-weight="bold" fill="#33362a">Which percentile?</text>
  <text x="175" y="826" font-size="24" fill="#75786a">p99 under load is where users actually suffer</text>

  <rect x="120" y="868" width="22" height="22" fill="#5b7c46"/>
  <text x="175" y="890" font-size="29" font-weight="bold" fill="#33362a">What hardware, and how many?</text>
  <text x="175" y="926" font-size="24" fill="#75786a">1 GPU or 8 changes everything</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics · llm-6</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">ask before you trust</text>
</svg>
