<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Anatomy of 1 Request</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">2 phases, 2 different bottlenecks</text>

  <!-- phase labels above -->
  <text x="285" y="400" text-anchor="middle" font-size="30" font-weight="bold" fill="#8a5138">PREFILL</text>
  <text x="285" y="438" text-anchor="middle" font-size="24" fill="#75786a">compute-bound (FLOPS)</text>
  <text x="770" y="400" text-anchor="middle" font-size="30" font-weight="bold" fill="#5b7c46">DECODE</text>
  <text x="770" y="438" text-anchor="middle" font-size="24" fill="#75786a">bandwidth-bound: reads all weights each step</text>

  <!-- prefill block -->
  <rect x="130" y="480" width="310" height="160" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="285" y="550" text-anchor="middle" font-size="28" font-weight="bold" fill="#8a5138">whole prompt</text>
  <text x="285" y="590" text-anchor="middle" font-size="26" fill="#8a5138">in 1 pass</text>

  <!-- decode ticks -->
  <rect x="470" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="550" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="630" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="710" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="790" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="870" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="950" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <rect x="1030" y="540" width="20" height="100" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
  <text x="770" y="525" text-anchor="middle" font-size="24" fill="#55584a">1 token per step</text>

  <!-- time axis -->
  <line x1="110" y1="660" x2="1080" y2="660" stroke="#75786a" stroke-width="3"/>
  <path d="M 1080 660 L 1062 651 L 1062 669 Z" fill="#75786a"/>
  <text x="1080" y="700" text-anchor="end" font-size="24" fill="#75786a">time</text>

  <!-- TTFT bracket -->
  <line x1="130" y1="710" x2="470" y2="710" stroke="#b06a4e" stroke-width="3"/>
  <line x1="130" y1="695" x2="130" y2="725" stroke="#b06a4e" stroke-width="3"/>
  <line x1="470" y1="695" x2="470" y2="725" stroke="#b06a4e" stroke-width="3"/>
  <text x="300" y="765" text-anchor="middle" font-size="27" font-weight="bold" fill="#b06a4e">TTFT ~ 65 ms</text>
  <text x="300" y="800" text-anchor="middle" font-size="24" fill="#75786a">time to first token</text>

  <!-- TPOT bracket -->
  <line x1="550" y1="710" x2="630" y2="710" stroke="#5b7c46" stroke-width="3"/>
  <line x1="550" y1="695" x2="550" y2="725" stroke="#5b7c46" stroke-width="3"/>
  <line x1="630" y1="695" x2="630" y2="725" stroke="#5b7c46" stroke-width="3"/>
  <text x="640" y="765" text-anchor="middle" font-size="27" font-weight="bold" fill="#5b7c46">TPOT ~ 5-8 ms</text>
  <text x="640" y="800" text-anchor="middle" font-size="24" fill="#75786a">time per output token</text>

  <!-- summary -->
  <rect x="240" y="850" width="720" height="80" fill="#e7edd9" stroke="#a8bf92" stroke-width="2"/>
  <text x="600" y="900" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">per-user tokens/sec  =  1 / TPOT</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics · llm-6</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">2 phases, 2 clocks</text>
</svg>
