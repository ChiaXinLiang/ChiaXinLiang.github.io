<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img">
<title>Efficiency is a feasible region, not one small model</title>
<rect width="1400" height="1000" fill="#f7fbff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#367bb5"/></marker></defs>
<text x="50" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17334a">Efficiency is a feasible region, not one small model</text>
<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">Illustrative quality–latency frontier with explicit deployment constraints</text>
<rect x="120" y="160" width="1130" height="565" rx="10" fill="white" stroke="#c8d7e5" stroke-width="2"/>
<rect x="160" y="180" width="590" height="460" rx="0" fill="#e6f5ee" stroke="#e6f5ee" stroke-width="2"/>
<path d="M160 670L1190 670" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M160 670L160 195" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="460" y="730" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Latency →</text>
<text x="180" y="185" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Quality ↑</text>
<circle cx="270" cy="500" r="13" fill="#14a6a0"/>
<text x="288" y="492" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">B</text>
<circle cx="430" cy="390" r="13" fill="#14a6a0"/>
<text x="448" y="382" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">A</text>
<circle cx="650" cy="230" r="13" fill="#14a6a0"/>
<text x="668" y="222" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">C</text>
<circle cx="600" cy="520" r="13" fill="#de7d58"/>
<text x="618" y="512" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">D</text>
<path d="M270 500L430 390" stroke="#14a6a0" stroke-width="2" fill="none"/>
<path d="M430 390L650 230" stroke="#14a6a0" stroke-width="2" fill="none"/>
<path d="M750 180L750 670" stroke="#b67723" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<text x="770" y="210" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Deadline</text>
<path d="M160 640L1190 640" stroke="#b67723" stroke-width="2" fill="none" stroke-dasharray="7 6"/>
<text x="890" y="620" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Minimum quality</text>
<text x="200" y="770" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Green: feasible under the illustrated constraints</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Choose among configurations meeting quality, latency, and memory requirements.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">The Pareto frontier preserves tradeoffs; it does not declare a universal winner.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Points are conceptual, not measured benchmark results.</text>
</svg>