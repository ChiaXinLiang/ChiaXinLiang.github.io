<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Encoding: q = clip(round(x / scale) + zero point); reconstruction reverses the scale.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Within the unsaturated grid, nearest-rounding error is at most half a step.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">The illustrated distribution and grid are conceptual, not a measured tensor.</text>
