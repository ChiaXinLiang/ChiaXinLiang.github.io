<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55584a"/></marker></defs>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#33362a">LeNet-5: the 1998 pipeline</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">convolve → pool → convolve → pool → vote</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- input digit -->
    <rect x="90" y="420" width="150" height="150" fill="#f4f1e6" stroke="#a3a08f" stroke-width="4"/>
    <text x="165" y="515" font-size="80" font-weight="800" fill="#33362a">7</text>
    <text x="165" y="620" font-size="24" fill="#55584a">input 32×32</text>

    <line x1="245" y1="495" x2="295" y2="495" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>

    <!-- conv1: stacked maps -->
    <rect x="315" y="400" width="120" height="120" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <rect x="330" y="415" width="120" height="120" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <rect x="345" y="430" width="120" height="120" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
    <text x="395" y="620" font-size="24" font-weight="700" fill="#5b7c46">convolution</text>
    <text x="395" y="650" font-size="22" fill="#55584a">6 maps · 28×28</text>

    <line x1="475" y1="495" x2="520" y2="495" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>

    <!-- pool1 -->
    <rect x="535" y="430" width="80" height="80" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
    <rect x="548" y="443" width="80" height="80" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
    <text x="588" y="620" font-size="24" font-weight="700" fill="#b06a4e">pooling</text>
    <text x="580" y="650" font-size="21" fill="#55584a">→ 14×14</text>

    <line x1="640" y1="495" x2="685" y2="495" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>

    <!-- conv2 -->
    <rect x="700" y="440" width="62" height="62" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <rect x="712" y="452" width="62" height="62" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <rect x="724" y="464" width="62" height="62" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
    <text x="737" y="620" font-size="24" font-weight="700" fill="#5b7c46">convolution</text>
    <text x="737" y="650" font-size="21" fill="#55584a">16 maps · 10×10</text>

    <line x1="800" y1="495" x2="845" y2="495" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>

    <!-- classifier -->
    <rect x="860" y="380" width="110" height="230" rx="14" fill="#f7ecd2" stroke="#c9973b" stroke-width="4"/>
    <circle cx="915" cy="430" r="14" fill="#c9973b"/><circle cx="915" cy="480" r="14" fill="#c9973b"/><circle cx="915" cy="530" r="14" fill="#c9973b"/><circle cx="915" cy="575" r="8" fill="#c9973b"/>
    <text x="915" y="688" font-size="24" font-weight="700" fill="#7a5a20">small classifier</text>

    <line x1="975" y1="495" x2="1020" y2="495" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>
    <rect x="1030" y="450" width="110" height="90" rx="12" fill="#5b7c46"/>
    <text x="1085" y="508" font-size="40" font-weight="800" fill="#fdfbf4">"7"</text>

    <text x="600" y="800" font-size="29" fill="#55584a">early layers see strokes · middle layers see loops and corners · the end just votes</text>
    <text x="600" y="850" font-size="27" fill="#75786a">~60,000 weights — it read handwritten checks in production</text>
  </g>

  <line x1="80" y1="1030" x2="1120" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Redrawn simplified from LeCun et al. (1998), Fig. 2</text>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">LLM Basics · arch-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">1998 → 2012: same recipe, more scale</text>
</svg>
