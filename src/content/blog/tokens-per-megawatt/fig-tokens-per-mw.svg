<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">1 Megawatt, By Hand</text>
  <text x="90" y="156" font-size="30" fill="#75786a">From grid meter to sellable tokens: GB300 NVL72 fleet</text>

  <!-- box 1 -->
  <rect x="210" y="240" width="560" height="80" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="490" y="290" font-size="28" font-weight="bold" fill="#33362a" text-anchor="middle">1 MW at the grid meter</text>
  <line x1="490" y1="320" x2="490" y2="366" stroke="#75786a" stroke-width="3"/>
  <path d="M 490 380 L 480 364 L 500 364 Z" fill="#75786a"/>
  <text x="530" y="358" font-size="26" fill="#75786a">&#247; 1.2 PUE (cooling + conversion)</text>

  <!-- box 2 -->
  <rect x="210" y="380" width="560" height="80" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
  <text x="490" y="430" font-size="28" font-weight="bold" fill="#33362a" text-anchor="middle">&#8776; 833 kW of IT load</text>
  <line x1="490" y1="460" x2="490" y2="506" stroke="#75786a" stroke-width="3"/>
  <path d="M 490 520 L 480 504 L 500 504 Z" fill="#75786a"/>
  <text x="530" y="498" font-size="26" fill="#75786a">&#247; ~135 kW per NVL72 rack</text>

  <!-- box 3 -->
  <rect x="210" y="520" width="560" height="80" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
  <text x="490" y="570" font-size="28" font-weight="bold" fill="#33362a" text-anchor="middle">&#8776; 6.2 racks &#183; 444 GPUs</text>
  <line x1="490" y1="600" x2="490" y2="646" stroke="#75786a" stroke-width="3"/>
  <path d="M 490 660 L 480 644 L 500 644 Z" fill="#75786a"/>
  <text x="530" y="638" font-size="26" fill="#75786a">&#215; 5,842 tok/s per GPU (MLPerf v5.1)</text>

  <!-- box 4 -->
  <rect x="210" y="660" width="560" height="80" rx="10" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="490" y="710" font-size="28" font-weight="bold" fill="#7a5a20" text-anchor="middle">&#8776; 2.6M tokens per second</text>
  <line x1="490" y1="740" x2="490" y2="786" stroke="#75786a" stroke-width="3"/>
  <path d="M 490 800 L 480 784 L 500 784 Z" fill="#75786a"/>
  <text x="530" y="778" font-size="26" fill="#75786a">&#215; 31.5M s/yr &#183; &#215; ~0.4 goodput</text>

  <!-- box 5 -->
  <rect x="210" y="800" width="560" height="80" rx="10" fill="#f0ddd0" stroke="#b06a4e" stroke-width="4"/>
  <text x="490" y="850" font-size="28" font-weight="bold" fill="#8a5138" text-anchor="middle">&#8776; 33 trillion tokens per MW-year</text>

  <text x="210" y="930" font-size="24" fill="#75786a">Ceiling before the goodput derate: &#8776; 82 trillion tokens</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-size="24" fill="#a3a08f">Rack throughput: MLPerf Inference v5.1, DeepSeek-R1</text>

  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; econ-1</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">efficiency is revenue</text>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">R = Pgrid × 72r / (PUE × Prack)</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">Grid watts → IT rack budget → compliant tokens/s; fleet average</text></g></svg>
