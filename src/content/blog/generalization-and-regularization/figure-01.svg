<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Fit observed data; test new data</text><text x="90" y="162" font-size="28" fill="#55584a">Empirical and population risk differ</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Training role</text><text x="125" y="340" font-size="28">Fit the parameters on observed examples</text><text x="125" y="398" font-size="28" font-weight="700">The optimizer sees empirical risk</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">Validation role</text><text x="125" y="585" font-size="28">Choose settings and checkpoints</text><text x="125" y="643" font-size="28" font-weight="700">Repeated choices can overfit validation</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Test role</text><text x="125" y="830" font-size="28">Evaluate after choices are fixed</text><text x="125" y="888" font-size="28" font-weight="700">Use a representative held-out population</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">LLM Basics · stat-5</text></g></svg>