<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Shrinkage changes the tradeoff</text><text x="90" y="162" font-size="28" fill="#55584a">Illustrative constant regression model</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Training targets</text><text x="125" y="340" font-size="28">1 · 2 · 6</text><text x="125" y="398" font-size="28" font-weight="700">Unregularized prediction = 3</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">L2 penalty strength</text><text x="125" y="585" font-size="28">lambda = 0.5</text><text x="125" y="643" font-size="28" font-weight="700">Regularized prediction = 3 ÷ 1.5 = 2</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Validation targets</text><text x="125" y="830" font-size="28">1 · 2</text><text x="125" y="888" font-size="28" font-weight="700">MSE changes from 2.5 to 0.5</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">LLM Basics · stat-5</text></g></g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">L2 constant fit: w = mean(y) / (1 + λ)</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">Targets (1,2,6): mean = 3; λ = 0.5 → w = 2</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">Penalty changes the preference, not evidence of future accuracy</text></svg>