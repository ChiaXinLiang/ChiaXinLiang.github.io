 stroke="#2779b8" stroke-width="2"/><text x="105" y="466" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Steps: 100</text><rect x="430" y="450" width="16" height="16" rx="2" fill="#deeee6" stroke="#207b67" stroke-width="2"/><text x="455" y="466" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Startup: 6</text><rect x="780" y="450" width="16" height="16" rx="2" fill="#e9e2f4" stroke="#7750a3" stroke-width="2"/><text x="805" y="466" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Checkpoints: 8</text><rect x="80" y="515" width="16" height="16" rx="2" fill="#f9e7ce" stroke="#b16e17" stroke-width="2"/><text x="105" y="531" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Evaluation: 10</text><text x="80" y="570" fill="#207b67" font-size="31" text-anchor="start" font-weight="bold">100 + 6 + 8 + 10 = 124 minutes</text><rect x="35" y="642" width="1130" height="72" rx="8" fill="#f5f8fa" stroke="#d5e0e8" stroke-width="2"/><path d="M35,642 L35,714" fill="none" stroke="#2779b8" stroke-width="5"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Startup, checkpoint and evaluation terms remain explicit; overlap requires separate evidence.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original quantitative diagram • exact scales</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>