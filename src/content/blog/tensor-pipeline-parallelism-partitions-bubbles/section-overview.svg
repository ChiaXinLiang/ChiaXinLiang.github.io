<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Account for idle time</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Balanced flush bubble ≈ (p−1)/(m+p−1)</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Real stage imbalance and communication add</text>
