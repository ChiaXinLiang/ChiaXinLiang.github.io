<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="110" font-size="44" font-weight="bold">Weights set a decode floor</text><text x="90" y="168" font-size="27" fill="#55584a">1 model read per ideal step</text><rect x="90" y="230" width="1020" height="195" rx="20" fill="#e7edd9"/><text x="130" y="308" font-size="49" font-weight="bold">37.19 GB</text><text x="130" y="365" font-size="30">Illustrative 4-bit weight traffic</text><rect x="90" y="465" width="1020" height="195" rx="20" fill="#f0ddd0"/><text x="130" y="543" font-size="49" font-weight="bold">3.35 TB/s</text><text x="130" y="600" font-size="30">H100 SXM peak memory bandwidth</text><rect x="90" y="700" width="1020" height="195" rx="20" fill="#f7ecd2"/><text x="130" y="778" font-size="49" font-weight="bold">90.1 tok/s</text><text x="130" y="835" font-size="30">Weight-only batch-1 ceiling</text><text x="90" y="1010" font-size="24" fill="#75786a">Original calculation; assumptions in article.</text><line x1="90" y1="1080" x2="1110" y2="1080" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1132" font-size="28" fill="#5b7c46">AI Performance · math-2</text></g><g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">Weight-only R ≤ β / Dw; Dw = P × stored bytes/weight</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">3.35 TB/s / 37.1875 GB → 90.08 outputs/s; history adds bytes</text></g></svg>