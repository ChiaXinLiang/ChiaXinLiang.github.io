<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Where the Microseconds Go</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Eager launch vs. CUDA graph replay, 1 decode step</text>

<!-- Panel A -->
<text x="100" y="252" font-size="32" font-weight="bold" fill="#33362a">Eager: CPU launches every kernel</text>

<!-- CPU lane A -->
<rect x="200" y="280" width="900" height="70" fill="#f4f1e6"/>
<text x="100" y="325" font-size="28" font-weight="bold" fill="#55584a">CPU</text>
<rect x="210" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="275" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>
<rect x="350" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="415" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>
<rect x="490" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="555" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>
<rect x="630" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="695" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>
<rect x="770" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="835" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>
<rect x="910" y="288" width="130" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="975" y="323" text-anchor="middle" font-size="24" fill="#7a5a20">launch</text>

<!-- dashed dependency lines -->
<line x1="275" y1="344" x2="298" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="415" y1="344" x2="438" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="555" y1="344" x2="578" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="695" y1="344" x2="718" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="835" y1="344" x2="858" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>
<line x1="975" y1="344" x2="998" y2="398" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>

<!-- GPU lane A -->
<rect x="200" y="400" width="900" height="70" fill="#f4f1e6"/>
<text x="100" y="445" font-size="28" font-weight="bold" fill="#55584a">GPU</text>
<rect x="260" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="300" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K1</text>
<rect x="400" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="440" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K2</text>
<rect x="540" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="580" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K3</text>
<rect x="680" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="720" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K4</text>
<rect x="820" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="860" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K5</text>
<rect x="960" y="408" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="1000" y="443" text-anchor="middle" font-size="24" fill="#5b7c46">K6</text>

<!-- idle gap annotation -->
<line x1="370" y1="505" x2="370" y2="474" stroke="#b04a3a" stroke-width="2.5"/>
<path d="M 370 470 L 364 482 L 376 482 Z" fill="#b04a3a"/>
<text x="290" y="535" font-size="26" fill="#b04a3a">gap = GPU idle, waiting for the next launch</text>

<!-- Panel B -->
<text x="100" y="618" font-size="32" font-weight="bold" fill="#33362a">Graph replay: 1 launch, GPU runs the whole DAG</text>

<!-- CPU lane B -->
<rect x="200" y="640" width="900" height="70" fill="#f4f1e6"/>
<text x="100" y="685" font-size="28" font-weight="bold" fill="#55584a">CPU</text>
<rect x="210" y="648" width="230" height="54" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="325" y="683" text-anchor="middle" font-size="24" fill="#7a5a20">cudaGraphLaunch</text>
<text x="500" y="683" font-size="24" fill="#a3a08f">CPU free for scheduling and sampling</text>

<line x1="325" y1="704" x2="298" y2="758" stroke="#d8d4c4" stroke-width="2" stroke-dasharray="6,5"/>

<!-- GPU lane B -->
<rect x="200" y="760" width="900" height="70" fill="#f4f1e6"/>
<text x="100" y="805" font-size="28" font-weight="bold" fill="#55584a">GPU</text>
<rect x="260" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="300" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K1</text>
<rect x="340" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="380" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K2</text>
<rect x="420" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="460" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K3</text>
<rect x="500" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="540" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K4</text>
<rect x="580" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="620" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K5</text>
<rect x="660" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="700" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K6</text>
<rect x="740" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="780" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K7</text>
<rect x="820" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="860" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K8</text>
<rect x="900" y="768" width="80" height="54" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="940" y="803" text-anchor="middle" font-size="24" fill="#5b7c46">K9</text>

<text x="260" y="890" font-size="26" fill="#5b7c46">no gaps: the device front end dispatches back-to-back</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · orch-2</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">kill the launch tax</text>
</g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Eager ≈ h+d+(n−1) max(h,d); graph ≈ g+nd+e</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">500 kernels; h = 5 µs; d = 4 µs → eager ≈ 2.504 ms</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">h: submission; d: device; g: replay; e: residual graph overhead</text></svg>
