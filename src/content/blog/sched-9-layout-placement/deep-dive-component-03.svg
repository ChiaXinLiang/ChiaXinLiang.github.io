xt><rect x="35" y="642" width="1130" height="72" rx="8" fill="#f5f8fa" stroke="#d5e0e8" stroke-width="2"/><path d="M35,642 L35,714" fill="none" stroke="#2779b8" stroke-width="5"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Steady-state bottleneck: 70 → 55 ms, about 21.4% less; warmup, drain and memory remain separate.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original quantitative diagram • exact scales</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>