183" font-size="22" text-anchor="start" font-weight="normal">Memory • kernels • communication</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Equal rank count does not imply equal memory, network traffic or execution schedule.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>