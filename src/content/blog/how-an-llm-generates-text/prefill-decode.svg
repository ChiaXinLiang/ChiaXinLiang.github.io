<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#75786a"/>
    </marker>
    <marker id="ahT" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#8a5138"/>
    </marker>
  </defs>
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Prefill vs Decode</text>
  <text x="90" y="156" font-size="30" fill="#75786a">One request, two phases with opposite bottlenecks</text>

  <!-- Panel A: prefill -->
  <rect x="90" y="240" width="1020" height="330" rx="18" fill="#e7edd9"/>
  <text x="120" y="296" font-size="30" font-weight="bold" fill="#5b7c46">PHASE 1 · PREFILL</text>
  <text x="1080" y="296" font-size="28" fill="#5b7c46" text-anchor="end">compute-bound</text>

  <!-- prompt token boxes -->
  <g>
    <rect x="150" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <rect x="300" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <rect x="450" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <rect x="600" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <rect x="750" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <rect x="900" y="330" width="120" height="56" rx="10" fill="#f4f1e6" stroke="#5b7c46" stroke-width="2"/>
    <text x="210" y="366" font-size="26" fill="#33362a" text-anchor="middle">Why</text>
    <text x="360" y="366" font-size="26" fill="#33362a" text-anchor="middle">is</text>
    <text x="510" y="366" font-size="26" fill="#33362a" text-anchor="middle">the</text>
    <text x="660" y="366" font-size="26" fill="#33362a" text-anchor="middle">sky</text>
    <text x="810" y="366" font-size="26" fill="#33362a" text-anchor="middle">blue</text>
    <text x="960" y="366" font-size="26" fill="#33362a" text-anchor="middle">?</text>
  </g>

  <!-- converging lines into model -->
  <line x1="210" y1="386" x2="310" y2="442" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="360" y1="386" x2="400" y2="442" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="510" y1="386" x2="490" y2="442" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="660" y1="386" x2="580" y2="442" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="810" y1="386" x2="650" y2="446" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <line x1="960" y1="386" x2="695" y2="455" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>

  <!-- model box -->
  <rect x="250" y="448" width="450" height="64" rx="12" fill="#f4f1e6" stroke="#5b7c46" stroke-width="3"/>
  <text x="475" y="489" font-size="27" fill="#33362a" text-anchor="middle">Model: one big parallel pass</text>

  <!-- first token out -->
  <line x1="700" y1="480" x2="760" y2="480" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>
  <rect x="770" y="452" width="190" height="56" rx="10" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="865" y="489" font-size="26" fill="#33362a" text-anchor="middle">"The"</text>
  <text x="865" y="544" font-size="24" fill="#75786a" text-anchor="middle">first output token</text>

  <text x="120" y="546" font-size="24" fill="#55584a">all prompt tokens in one pass</text>

  <!-- Panel B: decode -->
  <rect x="90" y="630" width="1020" height="330" rx="18" fill="#f0ddd0"/>
  <text x="120" y="686" font-size="30" font-weight="bold" fill="#b06a4e">PHASE 2 · DECODE</text>
  <text x="1080" y="686" font-size="28" fill="#b06a4e" text-anchor="end">memory-bound</text>

  <!-- model box -->
  <rect x="140" y="740" width="330" height="80" rx="12" fill="#f4f1e6" stroke="#b06a4e" stroke-width="3"/>
  <text x="305" y="772" font-size="26" fill="#33362a" text-anchor="middle">Model: one full pass</text>
  <text x="305" y="804" font-size="24" fill="#55584a" text-anchor="middle">per generated token</text>

  <line x1="470" y1="780" x2="540" y2="780" stroke="#75786a" stroke-width="2" marker-end="url(#ah)"/>

  <!-- generated token boxes -->
  <rect x="550" y="752" width="110" height="56" rx="10" fill="#f4f1e6" stroke="#b06a4e" stroke-width="2"/>
  <rect x="685" y="752" width="110" height="56" rx="10" fill="#f4f1e6" stroke="#b06a4e" stroke-width="2"/>
  <rect x="820" y="752" width="110" height="56" rx="10" fill="#f4f1e6" stroke="#b06a4e" stroke-width="2"/>
  <rect x="955" y="752" width="110" height="56" rx="10" fill="#f4f1e6" stroke="#b06a4e" stroke-width="2"/>
  <text x="605" y="789" font-size="26" fill="#33362a" text-anchor="middle">The</text>
  <text x="740" y="789" font-size="26" fill="#33362a" text-anchor="middle">sky</text>
  <text x="875" y="789" font-size="26" fill="#33362a" text-anchor="middle">is</text>
  <text x="1010" y="789" font-size="26" fill="#33362a" text-anchor="middle">blue</text>
  <text x="605" y="740" font-size="24" fill="#75786a" text-anchor="middle">step 1</text>
  <text x="740" y="740" font-size="24" fill="#75786a" text-anchor="middle">step 2</text>
  <text x="875" y="740" font-size="24" fill="#75786a" text-anchor="middle">step 3</text>
  <text x="1010" y="740" font-size="24" fill="#75786a" text-anchor="middle">step 4</text>

  <!-- feedback loop -->
  <path d="M 1010 808 L 1010 866 L 305 866 L 305 830" fill="none" stroke="#8a5138" stroke-width="2.5" marker-end="url(#ahT)"/>
  <text x="657" y="900" font-size="24" fill="#8a5138" text-anchor="middle">append the new token, feed the sequence back in</text>
  <text x="600" y="940" font-size="24" fill="#55584a" text-anchor="middle">every step re-reads all model weights from memory</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics · llm-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">one token at a time</text>
</svg>
