<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">3 quantities to keep separate</text><text x="90" y="162" font-size="28" fill="#55584a">A probability is not a reliability certificate</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Outcome variability</text><text x="125" y="340" font-size="28">An event is random under a fixed model</text><text x="125" y="398" font-size="28" font-weight="700">Known fair coin: the next result is uncertain</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">Parameter uncertainty</text><text x="125" y="585" font-size="28">The model parameter is not fully known</text><text x="125" y="643" font-size="28" font-weight="700">More representative observations can help</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Task reliability</text><text x="125" y="830" font-size="28">The prediction must meet a task standard</text><text x="125" y="888" font-size="28" font-weight="700">High token probability does not prove truth</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">LLM Basics · stat-1</text></g></svg>