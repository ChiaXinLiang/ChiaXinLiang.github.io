<text x="780" y="260" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#14847d">Smooth target trajectory</text>
<text x="780" y="310" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#b75332">Coarse numerical updates</text>
<text x="160" y="610" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">A higher-order step can require</text>
<text x="160" y="650" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">several predictor evaluations.</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">ODE and SDE samplers use different trajectory constructions; correct time direction matters.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">DPM-Solver exploits the known semilinear structure rather than only a generic order label.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">The curve is conceptual and reports no image-quality or device-timing measurement.</text>
