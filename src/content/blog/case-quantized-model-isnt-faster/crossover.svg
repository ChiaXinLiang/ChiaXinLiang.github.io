<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue, Arial, sans-serif"><text x="90" y="105" font-size="43" fill="#33362a" font-weight="bold">The crossover is a roofline bound</text><text x="90" y="155" font-size="28" fill="#75786a" font-weight="normal">Read the assumptions before applying the result</text><rect x="90" y="220" width="1020" height="190" rx="12" fill="#e7edd9"/><text x="125" y="269" font-size="31" fill="#33362a" font-weight="bold">MEMORY FLOORS</text><text x="125" y="319" font-size="32" fill="#33362a" font-weight="normal">FP16: 14 GB / 3.35 TB/s = 4.2 ms</text><text x="125" y="368" font-size="32" fill="#55584a" font-weight="normal">INT4: 3.9 GB / 3.35 TB/s = 1.2 ms</text><text x="595" y="445" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="455" width="1020" height="190" rx="12" fill="#f7ecd2"/><text x="125" y="504" font-size="31" fill="#33362a" font-weight="bold">COMPUTE FLOOR</text><text x="125" y="554" font-size="32" fill="#33362a" font-weight="normal">14 × B GFLOP / 989 TFLOPS</text><text x="125" y="603" font-size="32" fill="#55584a" font-weight="normal">≈ 0.0142 × B ms per step</text><text x="595" y="680" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="690" width="1020" height="190" rx="12" fill="#f0ddd0"/><text x="125" y="739" font-size="31" fill="#33362a" font-weight="bold">RIDGE BATCHES</text><text x="125" y="789" font-size="32" fill="#33362a" font-weight="normal">INT4: B ≈ 82; FP16: B ≈ 296</text><text x="125" y="838" font-size="32" fill="#55584a" font-weight="normal">Ideal peaks; excludes KV and overhead</text><text x="90" y="1020" font-size="24" fill="#75786a" font-weight="normal">Illustrative bound · NVIDIA H100 specs; not a benchmark</text><path d="M90 1080H1110" stroke="#e8e4d7" stroke-width="3"/><text x="90" y="1135" font-size="28" fill="#a3a08f" font-weight="bold">AI Performance · case-6</text></g></svg>