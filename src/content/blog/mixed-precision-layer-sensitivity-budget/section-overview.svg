<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img">
<title>Mixed precision spends bits where they preserve quality</title>
<rect width="1400" height="1000" fill="#f7fbff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#367bb5"/></marker></defs>
<text x="50" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17334a">Mixed precision spends bits where they preserve quality</text>
<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">A discrete resource allocation selects supported formats for different weight groups</text>
<text x="85" y="195" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17334a">Illustrative layer allocation</text>
<rect x="100" y="260" width="330" height="190" rx="10" fill="#14a6a0" stroke="none" stroke-width="2"/>
<text x="115" y="495" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">8M weights</text>
<text x="115" y="535" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">4 bits</text>
<text x="115" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Payload: 4 MB</text>
<rect x="500" y="260" width="235" height="190" rx="10" fill="#367bb5" stroke="none" stroke-width="2"/>
<text x="515" y="495" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">2M weights</text>
<text x="515" y="535" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">8 bits</text>
<text x="515" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Payload: 2 MB</text>
<rect x="815" y="260" width="170" height="190" rx="10" fill="#de7d58" stroke="none" stroke-width="2"/>
<text x="830" y="495" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17334a">1M weights</text>
<text x="830" y="535" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">16 bits</text>
<text x="830" y="575" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Payload: 2 MB</text>
<text x="1060" y="320" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17334a">8 MB payload</text>
<text x="1060" y="365" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17334a">+ scales</text>
<text x="1060" y="410" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17334a">+ runtime state</text>
<path d="M140 760L760 760" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M140 760L140 610" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<circle cx="230" cy="720" r="10" fill="#14a6a0"/>
<circle cx="340" cy="675" r="10" fill="#14a6a0"/>
<circle cx="460" cy="650" r="10" fill="#14a6a0"/>
<circle cx="590" cy="630" r="10" fill="#14a6a0"/>
<text x="785" y="655" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Higher precision: more bytes</text>
<text x="785" y="698" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">Sensitivity × numerical error</text>
<text x="785" y="741" text-anchor="start" font-family="Arial,sans-serif" font-size="24" font-weight="400" fill="#17334a">guides candidate selection</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Average precision is accounting; each layer still needs a concrete executable format.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Sensitivity estimates guide a search; held-out quality validates the complete allocation.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Counts and frontier points are illustrative, not measured latency or model-quality results.</text>
</svg>