<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Coordinate equality is stronger than functional equivalence; alignment defines what is compared.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Relational objectives preserve selected distances or angles among training examples.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Training-only alignment can be removed; the student deployment must be evaluated independently.</text>
