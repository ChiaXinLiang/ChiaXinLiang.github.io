<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">BPE in 5 Merges</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Learn glue rules from pair counts, then reuse them</text>

  <!-- corpus band -->
  <text x="90" y="256" font-size="26" font-weight="bold" fill="#55584a">Training corpus, split to characters (word &#215; count)</text>
  <rect x="90" y="282" width="230" height="84" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="205" y="322" text-anchor="middle" font-size="28" fill="#33362a">l o w &#183;</text>
  <text x="205" y="354" text-anchor="middle" font-size="24" fill="#b06a4e">&#215; 5</text>

  <rect x="350" y="282" width="230" height="84" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="465" y="322" text-anchor="middle" font-size="28" fill="#33362a">l o w e r &#183;</text>
  <text x="465" y="354" text-anchor="middle" font-size="24" fill="#b06a4e">&#215; 2</text>

  <rect x="610" y="282" width="230" height="84" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="725" y="322" text-anchor="middle" font-size="28" fill="#33362a">n e w e s t &#183;</text>
  <text x="725" y="354" text-anchor="middle" font-size="24" fill="#b06a4e">&#215; 6</text>

  <rect x="870" y="282" width="230" height="84" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="985" y="322" text-anchor="middle" font-size="28" fill="#33362a">w i d e s t &#183;</text>
  <text x="985" y="354" text-anchor="middle" font-size="24" fill="#b06a4e">&#215; 3</text>

  <text x="600" y="400" text-anchor="middle" font-size="24" fill="#75786a">&#183; marks the end of a word</text>

  <!-- merge rules band -->
  <text x="90" y="462" font-size="26" font-weight="bold" fill="#55584a">Learned merge rules, most frequent adjacent pair first</text>

  <circle cx="120" cy="505" r="20" fill="#5b7c46"/>
  <text x="120" y="514" text-anchor="middle" font-size="26" font-weight="bold" fill="#fdfbf4">1</text>
  <text x="170" y="514" font-size="28" fill="#33362a">e + s  &#8594;  <tspan font-weight="bold" fill="#5b7c46">es</tspan></text>
  <text x="1110" y="514" text-anchor="end" font-size="24" fill="#75786a">pair seen 9&#215;</text>

  <circle cx="120" cy="557" r="20" fill="#5b7c46"/>
  <text x="120" y="566" text-anchor="middle" font-size="26" font-weight="bold" fill="#fdfbf4">2</text>
  <text x="170" y="566" font-size="28" fill="#33362a">es + t  &#8594;  <tspan font-weight="bold" fill="#5b7c46">est</tspan></text>
  <text x="1110" y="566" text-anchor="end" font-size="24" fill="#75786a">pair seen 9&#215;</text>

  <circle cx="120" cy="609" r="20" fill="#5b7c46"/>
  <text x="120" y="618" text-anchor="middle" font-size="26" font-weight="bold" fill="#fdfbf4">3</text>
  <text x="170" y="618" font-size="28" fill="#33362a">est + &#183;  &#8594;  <tspan font-weight="bold" fill="#5b7c46">est&#183;</tspan>   (a suffix token is born)</text>
  <text x="1110" y="618" text-anchor="end" font-size="24" fill="#75786a">pair seen 9&#215;</text>

  <circle cx="120" cy="661" r="20" fill="#c9973b"/>
  <text x="120" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#fdfbf4">4</text>
  <text x="170" y="670" font-size="28" fill="#33362a">l + o  &#8594;  <tspan font-weight="bold" fill="#7a5a20">lo</tspan></text>
  <text x="1110" y="670" text-anchor="end" font-size="24" fill="#75786a">pair seen 7&#215;</text>

  <circle cx="120" cy="713" r="20" fill="#c9973b"/>
  <text x="120" y="722" text-anchor="middle" font-size="26" font-weight="bold" fill="#fdfbf4">5</text>
  <text x="170" y="722" font-size="28" fill="#33362a">lo + w  &#8594;  <tspan font-weight="bold" fill="#7a5a20">low</tspan></text>
  <text x="1110" y="722" text-anchor="end" font-size="24" fill="#75786a">pair seen 7&#215;</text>

  <!-- apply band -->
  <rect x="90" y="762" width="1020" height="196" rx="14" fill="#e7edd9" stroke="#a8bf92" stroke-width="2"/>
  <text x="110" y="804" font-size="26" font-weight="bold" fill="#55584a">Now tokenize &#8220;lowest&#8221; &#8212; a word the corpus never contained</text>

  <rect x="130" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="153" y="872" text-anchor="middle" font-size="28" fill="#33362a">l</text>
  <rect x="184" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="207" y="872" text-anchor="middle" font-size="28" fill="#33362a">o</text>
  <rect x="238" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="261" y="872" text-anchor="middle" font-size="28" fill="#33362a">w</text>
  <rect x="292" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="315" y="872" text-anchor="middle" font-size="28" fill="#33362a">e</text>
  <rect x="346" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="369" y="872" text-anchor="middle" font-size="28" fill="#33362a">s</text>
  <rect x="400" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="423" y="872" text-anchor="middle" font-size="28" fill="#33362a">t</text>
  <rect x="454" y="830" width="46" height="64" rx="8" fill="#fdfbf4" stroke="#d8d4c4" stroke-width="2"/>
  <text x="477" y="872" text-anchor="middle" font-size="28" fill="#33362a">&#183;</text>

  <line x1="530" y1="862" x2="640" y2="862" stroke="#75786a" stroke-width="3"/>
  <polygon points="640,862 624,854 624,870" fill="#75786a"/>
  <text x="585" y="842" text-anchor="middle" font-size="24" fill="#75786a">rules 1&#8211;5</text>

  <rect x="672" y="826" width="170" height="72" rx="10" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
  <text x="757" y="874" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">low</text>
  <rect x="862" y="826" width="170" height="72" rx="10" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
  <text x="947" y="874" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">est&#183;</text>
  <text x="852" y="932" text-anchor="middle" font-size="24" fill="#55584a">2 tokens, no unknown-word symbol needed</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Example follows Sennrich et al. (2016)</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; llm-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">merge, reuse, repeat</text>
</svg>
