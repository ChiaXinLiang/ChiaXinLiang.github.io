<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">What the Model Sees</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">The word never enters the network &#8212; three IDs do</text>

  <!-- stage 1: text -->
  <text x="90" y="300" font-size="24" fill="#75786a">you type</text>
  <text x="620" y="308" text-anchor="middle" font-size="54" font-weight="bold" fill="#33362a">strawberry</text>

  <line x1="620" y1="332" x2="620" y2="372" stroke="#75786a" stroke-width="3"/>
  <polygon points="620,384 612,368 628,368" fill="#75786a"/>

  <!-- stage 2: tokens -->
  <text x="90" y="450" font-size="24" fill="#75786a">tokenizer splits</text>
  <rect x="362" y="404" width="150" height="76" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
  <text x="437" y="454" text-anchor="middle" font-size="40" font-weight="bold" fill="#33362a">str</text>
  <rect x="530" y="404" width="120" height="76" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
  <text x="590" y="454" text-anchor="middle" font-size="40" font-weight="bold" fill="#33362a">aw</text>
  <rect x="668" y="404" width="210" height="76" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
  <text x="773" y="454" text-anchor="middle" font-size="40" font-weight="bold" fill="#33362a">berry</text>
  <text x="1110" y="450" text-anchor="end" font-size="24" fill="#75786a">3 tokens</text>

  <line x1="620" y1="500" x2="620" y2="540" stroke="#75786a" stroke-width="3"/>
  <polygon points="620,552 612,536 628,536" fill="#75786a"/>

  <!-- stage 3: ids -->
  <text x="90" y="612" font-size="24" fill="#75786a">vocabulary rows</text>
  <rect x="362" y="572" width="150" height="64" rx="32" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="437" y="614" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a5a20">496</text>
  <rect x="530" y="572" width="120" height="64" rx="32" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="590" y="614" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a5a20">675</text>
  <rect x="668" y="572" width="210" height="64" rx="32" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="773" y="614" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a5a20">15717</text>
  <text x="1110" y="612" text-anchor="end" font-size="24" fill="#75786a">3 integers</text>

  <line x1="620" y1="656" x2="620" y2="696" stroke="#75786a" stroke-width="3"/>
  <polygon points="620,708 612,692 628,692" fill="#75786a"/>

  <!-- stage 4: embedding vectors -->
  <text x="90" y="780" font-size="24" fill="#75786a">learned vectors</text>

  <rect x="423" y="724" width="28" height="28" rx="5" fill="#a8bf92"/>
  <rect x="423" y="758" width="28" height="28" rx="5" fill="#e7edd9"/>
  <rect x="423" y="792" width="28" height="28" rx="5" fill="#5b7c46"/>
  <rect x="423" y="826" width="28" height="28" rx="5" fill="#f7ecd2"/>

  <rect x="576" y="724" width="28" height="28" rx="5" fill="#e5b3a6"/>
  <rect x="576" y="758" width="28" height="28" rx="5" fill="#c9973b"/>
  <rect x="576" y="792" width="28" height="28" rx="5" fill="#f0ddd0"/>
  <rect x="576" y="826" width="28" height="28" rx="5" fill="#a8bf92"/>

  <rect x="759" y="724" width="28" height="28" rx="5" fill="#f7ecd2"/>
  <rect x="759" y="758" width="28" height="28" rx="5" fill="#b06a4e"/>
  <rect x="759" y="792" width="28" height="28" rx="5" fill="#a8bf92"/>
  <rect x="759" y="826" width="28" height="28" rx="5" fill="#e7edd9"/>

  <text x="620" y="898" text-anchor="middle" font-size="24" fill="#75786a">thousands of learned numbers per token &#8212; no letters among them</text>

  <!-- callout -->
  <rect x="120" y="920" width="960" height="88" rx="14" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="600" y="956" text-anchor="middle" font-size="26" fill="#8a5138">Ask &#8220;how many r&#8217;s?&#8221; and the letters just aren&#8217;t there.</text>
  <text x="600" y="992" text-anchor="middle" font-size="26" fill="#8a5138">The model can recall spelling trivia, not look and count.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Token split per OpenAI cl100k_base (tiktoken)</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; llm-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">asking pixels of a JPEG</text>
</svg>
