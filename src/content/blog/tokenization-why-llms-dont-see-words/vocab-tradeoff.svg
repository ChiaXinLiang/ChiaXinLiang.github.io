<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The Vocabulary-Size Dial</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Short sequences or small tables &#8212; pick one</text>

  <!-- wedge: sequence length shrinks -->
  <polygon points="140,250 140,350 1060,320 1060,300" fill="#e7edd9" stroke="#a8bf92" stroke-width="2"/>
  <text x="170" y="310" font-size="28" font-weight="bold" fill="#5b7c46">sequence length for the same text</text>
  <text x="1050" y="282" text-anchor="end" font-size="24" fill="#5b7c46">shrinks &#8594;</text>

  <!-- wedge: embedding table grows -->
  <polygon points="140,425 1060,385 1060,505 140,445" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="145" y="412" font-size="24" fill="#8a5138">&#8592; tiny</text>
  <text x="1030" y="465" text-anchor="end" font-size="28" font-weight="bold" fill="#8a5138">embedding-table parameters</text>

  <!-- end annotations -->
  <text x="140" y="566" font-size="24" fill="#55584a">at this end nothing is ever</text>
  <text x="140" y="598" font-size="24" fill="#55584a">unknown, but everything is long</text>
  <text x="1060" y="566" text-anchor="end" font-size="24" fill="#55584a">at this end the lookup tables</text>
  <text x="1060" y="598" text-anchor="end" font-size="24" fill="#55584a">swallow the parameter budget</text>

  <!-- axis -->
  <line x1="120" y1="650" x2="1080" y2="650" stroke="#55584a" stroke-width="3"/>
  <polygon points="1096,650 1078,642 1078,658" fill="#55584a"/>

  <circle cx="140" cy="650" r="10" fill="#fdfbf4" stroke="#a3a08f" stroke-width="3"/>
  <text x="140" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#75786a">256</text>
  <text x="140" y="732" text-anchor="middle" font-size="24" fill="#75786a">raw bytes</text>

  <circle cx="324" cy="650" r="10" fill="#c9973b"/>
  <text x="324" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">50K</text>
  <text x="324" y="732" text-anchor="middle" font-size="24" fill="#75786a">GPT-2</text>

  <circle cx="508" cy="650" r="10" fill="#5b7c46"/>
  <text x="508" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">100K</text>
  <text x="508" y="732" text-anchor="middle" font-size="24" fill="#75786a">GPT-4</text>

  <circle cx="692" cy="650" r="10" fill="#b06a4e"/>
  <text x="692" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">128K</text>
  <text x="692" y="732" text-anchor="middle" font-size="24" fill="#75786a">Llama 3</text>

  <circle cx="876" cy="650" r="10" fill="#5b7c46"/>
  <text x="876" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">~200K</text>
  <text x="876" y="732" text-anchor="middle" font-size="24" fill="#75786a">GPT-4o</text>

  <circle cx="1060" cy="650" r="10" fill="#fdfbf4" stroke="#a3a08f" stroke-width="3"/>
  <text x="1060" y="700" text-anchor="middle" font-size="26" font-weight="bold" fill="#75786a">1M</text>
  <text x="1060" y="732" text-anchor="middle" font-size="24" fill="#75786a">every word</text>

  <text x="600" y="784" text-anchor="middle" font-size="24" fill="#a3a08f">vocabulary size &#8212; axis not to scale</text>

  <!-- callout -->
  <rect x="90" y="836" width="1020" height="112" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="600" y="882" text-anchor="middle" font-size="26" fill="#33362a">Llama 3&#8217;s input table: 128,256 rows &#215; 4,096 dims &#8776; 525M params</text>
  <text x="600" y="920" text-anchor="middle" font-size="26" fill="#75786a">spent before a single Transformer layer runs</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; llm-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">compression has a price</text>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">Embedding parameters = Vd; dense attention pairs scale as T²</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">V: vocabulary; d: width; T: token length; fewer tokens can cost more rows</text></g></svg>
