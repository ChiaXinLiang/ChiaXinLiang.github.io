<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Turn prompt work into chunks</text><text x="90" y="162" font-size="28" fill="#55584a">Illustrative decode-first token accounting</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Iteration budget</text><text x="125" y="340" font-size="28">2048 scheduled tokens</text><text x="125" y="398" font-size="28" font-weight="700">16 decode tokens leave 2032 for prefill</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">Prompt size</text><text x="125" y="585" font-size="28">8192 input tokens</text><text x="125" y="643" font-size="28" font-weight="700">4 full chunks plus 64 final tokens</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Tradeoff</text><text x="125" y="830" font-size="28">5 chunks instead of 1 large segment</text><text x="125" y="888" font-size="28" font-weight="700">Measure ITL, TTFT, throughput together</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">AI Performance · case-5</text></g></g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Chunk limit ≈ floor((iteration target − decode time)/a)</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">(50 ms − 25 ms) / 0.10 ms/token → 250 tokens</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">8192 prompt tokens need 33 chunks; linear cost assumption</text></svg>