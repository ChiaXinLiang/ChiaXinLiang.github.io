<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>Performance Regression CI: Keeping a Speedup After the Next Commit</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">Performance Regression CI</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Choose representative cases</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Workload shapes, paths, and service</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">outcomes</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">A tiny suite should expose important</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">mechanisms</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Control the runner</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Hardware, versions, placement, cache state,</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">and load</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">An unstable runner produces unstable decisions</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Make a bounded decision</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Regression ratio plus uncertainty and</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">practical budget</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">No detected difference is not proof of</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">equivalence</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Preserve the evidence</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Raw timings, configuration, paths, and</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">failure artifacts</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Update baselines deliberately rather than</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">hiding the slowdown</text>
<path d="M598 272L619 272" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M876 429L876 462" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M620 612L599 612" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="44" y="812" font-family="Arial,sans-serif" font-size="18" fill="#555b4b">Read the article for derivations, assumptions, and worked examples.</text>
</svg>