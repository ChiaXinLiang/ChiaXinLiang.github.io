<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="bold" fill="#33362a">The Checkpoint Write Storm</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">1,024 GPUs, 980 GB of state, saved synchronously</text>

  <!-- legend -->
  <rect x="290" y="236" width="34" height="34" fill="#a8bf92"/>
  <text x="336" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">training compute</text>
  <rect x="600" y="236" width="34" height="34" fill="#b04a3a"/>
  <text x="646" y="262" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">checkpoint stall (all ranks idle)</text>

  <!-- Row A: slow storage -->
  <text x="90" y="336" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Slow storage — 5 GB/s aggregate write</text>
  <rect x="90" y="356" width="280" height="70" fill="#a8bf92"/>
  <rect x="370" y="356" width="50" height="70" fill="#b04a3a"/>
  <rect x="420" y="356" width="280" height="70" fill="#a8bf92"/>
  <rect x="700" y="356" width="50" height="70" fill="#b04a3a"/>
  <rect x="750" y="356" width="280" height="70" fill="#a8bf92"/>
  <rect x="1030" y="356" width="50" height="70" fill="#b04a3a"/>
  <text x="90" y="470" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#55584a">196 s / 2.3 h: 2.4% checkpoint overhead</text>

  <!-- Row B: fast storage -->
  <text x="90" y="586" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="bold" fill="#33362a">Fast storage — 60 GB/s aggregate write</text>
  <rect x="90" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="174" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="188" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="272" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="286" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="370" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="384" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="468" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="482" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="566" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="580" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="664" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="678" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="762" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="776" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="860" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="874" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="958" y="606" width="14" height="70" fill="#b04a3a"/>
  <rect x="972" y="606" width="84" height="70" fill="#a8bf92"/>
  <rect x="1056" y="606" width="14" height="70" fill="#b04a3a"/>
  <text x="90" y="720" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#55584a">16 s / 40 min: 0.7% checkpoint overhead</text>

  <text x="90" y="796" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" font-style="italic" fill="#75786a">Stall widths exaggerated for visibility; ratios follow Young's formula.</text>

  <!-- takeaway box -->
  <rect x="90" y="830" width="1020" height="110" fill="#e7edd9"/>
  <text x="600" y="876" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#33362a">Faster storage shortens each stall and permits</text>
  <text x="600" y="914" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#33362a">more frequent saves — both waste terms shrink ~3.5×</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · storage-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">keep the GPUs fed</text>
</svg>
