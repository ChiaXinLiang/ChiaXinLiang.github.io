<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="bold" fill="#33362a">1 roofline, 2 fates</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">TPU v1: a 92 TOPS ceiling behind a 34 GB/s front door</text>

  <defs>
    <marker id="arrAx" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#75786a"/>
    </marker>
  </defs>

  <!-- axes -->
  <line x1="200" y1="900" x2="200" y2="260" stroke="#75786a" stroke-width="3" marker-end="url(#arrAx)"/>
  <line x1="200" y1="900" x2="1080" y2="900" stroke="#75786a" stroke-width="3" marker-end="url(#arrAx)"/>
  <text x="140" y="240" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">performance (ops/s, log)</text>
  <text x="1080" y="995" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">arithmetic intensity (ops/byte, log)</text>

  <!-- roofline: diagonal then flat -->
  <!-- ridge at x=740, ceiling y=360 -->
  <line x1="200" y1="880" x2="740" y2="360" stroke="#b06a4e" stroke-width="6"/>
  <line x1="740" y1="360" x2="1050" y2="360" stroke="#5b7c46" stroke-width="6"/>

  <!-- ceiling label -->
  <text x="1040" y="330" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="bold" fill="#5b7c46">compute roof: 92 TOPS</text>
  <!-- slope label, rotated along the diagonal -->
  <text x="330" y="700" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="bold" fill="#b06a4e" transform="rotate(-44 330 700)">memory slope: 34 GB/s</text>

  <!-- ridge point marker -->
  <line x1="740" y1="360" x2="740" y2="900" stroke="#d8d4c4" stroke-width="3" stroke-dasharray="10 8"/>
  <circle cx="740" cy="360" r="12" fill="#c9973b"/>
  <text x="620" y="945" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" font-weight="bold" fill="#7a5a20">ridge: ~2,700 ops/byte</text>

  <!-- workload points -->
  <!-- MLP on diagonal, low intensity -->
  <circle cx="360" cy="726" r="14" fill="#b04a3a"/>
  <text x="392" y="734" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#b04a3a">MLPs: ~10% of peak</text>
  <!-- LSTM slightly higher -->
  <circle cx="300" cy="784" r="14" fill="#b04a3a"/>
  <text x="332" y="810" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#b04a3a">LSTMs: even lower</text>
  <!-- CNN near ceiling -->
  <circle cx="860" cy="380" r="14" fill="#5b7c46"/>
  <text x="860" y="435" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#5b7c46">CNNs: near peak</text>

  <!-- annotation box -->
  <rect x="255" y="270" width="420" height="150" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <text x="285" y="315" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#55584a">Left of the ridge, the multipliers</text>
  <text x="285" y="352" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#55584a">starve: most 2016 traffic ran at</text>
  <text x="285" y="389" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" fill="#55584a">~0.1 of the datasheet number.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Data from Jouppi et al. (2017)</text>
  <text x="90" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch · asic-4</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">R ≤ min(C, bandwidth × intensity)</text>
</svg>
