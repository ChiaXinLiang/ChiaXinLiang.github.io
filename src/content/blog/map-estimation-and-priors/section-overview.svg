<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc">
<title id="title">MAP: HOW A PRIOR CHANGES THE OPTIMIZATION</title><desc id="desc">Choose the statistical model Posterior ∝ likelihood × prior p(θ | D) ∝ p(D | θ) p(θ) The prior must be justified for the task. Find the posterior mode θ MAP = argmax [log L + log prior] Evidence is constant with respect to θ MAP optimizes parameters, not predictions. Work the Beta example Prior Beta(2, 2); k = 7, n = 10 Posterior Beta(9, 5) Mode = (9 − 1) / (9 + 5 − 2) = 2/3 Distinguish the summaries MLE = 0.7; MAP ≈ 0.6667 Posterior predictive = 9 / 14 ≈ 0.6429 A mode differs from a posterior average.</desc><rect width="1200" height="1040" rx="20" fill="#faf9f4"/>
<text x="40" y="50" font-family="Arial, sans-serif" font-size="22" fill="#6845c0" font-weight="bold">SECTION OVERVIEW · METHOD + MECHANISM + EQUATIONS</text>
<text x="40" y="105" font-family="Arial, sans-serif" font-size="35" fill="#23282d" font-weight="bold">MAP: HOW A PRIOR CHANGES THE OPTIMIZATION</text>
<rect x="30" y="210" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="252" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">1. Choose the statistical model</text>
<text x="72" y="289" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Posterior ∝ likelihood × prior</text>
<text x="72" y="320" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">p(θ | D) ∝ p(D | θ) p(θ)</text>
<text x="72" y="351" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">The prior must be justified for the task.</text>
<rect x="30" y="395" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="437" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">2. Find the posterior mode</text>
<text x="72" y="474" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">θ MAP = argmax [log L + log prior]</text>
<text x="72" y="505" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Evidence is constant with respect to θ</text>
<text x="72" y="536" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">MAP optimizes parameters, not predictions.</text>
<rect x="30" y="580" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="622" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">3. Work the Beta example</text>
<text x="72" y="659" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">Prior Beta(2, 2); k = 7, n = 10</text>
<text x="72" y="690" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Posterior Beta(9, 5)</text>
<text x="72" y="721" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Mode = (9 − 1) / (9 + 5 − 2) = 2/3</text>
<rect x="30" y="765" width="1140" height="165" rx="12" fill="#ffffff" stroke="#d6d1df"/>
<text x="52" y="807" font-family="Arial, sans-serif" font-size="28" fill="#6845c0" font-weight="bold">4. Distinguish the summaries</text>
<text x="72" y="844" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="bold">MLE = 0.7; MAP ≈ 0.6667</text>
<text x="72" y="875" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">Posterior predictive = 9 / 14 ≈ 0.6429</text>
<text x="72" y="906" font-family="Arial, sans-serif" font-size="25" fill="#23282d" font-weight="normal">A mode differs from a posterior average.</text>
<text x="40" y="1004" font-family="Arial, sans-serif" font-size="24" fill="#6845c0" font-weight="normal">Read 1 → 4, then use the section derivation to check the assumptions.</text>
</svg>