<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>GPUDirect RDMA: GPU–NIC Locality and Transport Verification</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">GPUDirect RDMA</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Establish a supported pair</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">GPU ↔ PCIe path ↔ network adapter</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Compatibility and physical locality are</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">separate checks</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Keep registration reusable</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Supported allocation → registered mapping →</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">transfers</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Lifetime and visibility still require</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">coordination</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Compare data paths</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Direct GPU memory versus explicit host</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">staging</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Count interface traffic and required</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">synchronization</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Verify in the real job</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Transport diagnostics, adapter counters,</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">and collective traces</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">A successful pair test does not prove every</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">rank uses the path</text>
<path d="M598 272L619 272" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M876 429L876 462" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<path d="M620 612L599 612" stroke="#7545c8" stroke-width="3" marker-end="url(#arrow)"/>
<text x="44" y="812" font-family="Arial,sans-serif" font-size="18" fill="#555b4b">Read the article for derivations, assumptions, and worked examples.</text>
</svg>