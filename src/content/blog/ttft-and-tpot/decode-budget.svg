<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Where 7.6 Milliseconds Go</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">One decode step: 7B FP16 model, A100-class GPU</text>

  <!-- axis -->
  <line x1="420" y1="270" x2="420" y2="690" stroke="#d8d4c4" stroke-width="3"/>

  <!-- bar 1: weights -->
  <text x="400" y="332" text-anchor="end" font-size="26" fill="#33362a">Read 14 GB</text>
  <text x="400" y="366" text-anchor="end" font-size="26" fill="#33362a">of weights</text>
  <rect x="420" y="300" width="560" height="80" fill="#5b7c46"/>
  <text x="995" y="350" font-size="26" font-weight="bold" fill="#33362a">7.0 ms</text>

  <!-- bar 2: KV cache -->
  <text x="400" y="472" text-anchor="end" font-size="26" fill="#33362a">Read 1.1 GB</text>
  <text x="400" y="506" text-anchor="end" font-size="26" fill="#33362a">of KV cache</text>
  <rect x="420" y="440" width="44" height="80" fill="#c9973b"/>
  <text x="479" y="490" font-size="26" font-weight="bold" fill="#33362a">0.55 ms</text>

  <!-- bar 3: math -->
  <text x="400" y="612" text-anchor="end" font-size="26" fill="#33362a">Do 14 GFLOPs</text>
  <text x="400" y="646" text-anchor="end" font-size="26" fill="#33362a">of arithmetic</text>
  <rect x="420" y="580" width="5" height="80" fill="#b04a3a"/>
  <text x="440" y="630" font-size="26" font-weight="bold" fill="#b04a3a">0.05 ms</text>

  <text x="420" y="722" font-size="24" fill="#a3a08f">bar length &#8733; time per output token</text>

  <!-- note -->
  <rect x="230" y="770" width="740" height="120" rx="12" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
  <text x="600" y="820" text-anchor="middle" font-size="28" fill="#55584a">More than 99% of each decode step</text>
  <text x="600" y="858" text-anchor="middle" font-size="28" fill="#55584a">is spent waiting on memory, not math</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; llm-5</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">bandwidth is destiny</text>
</svg>
