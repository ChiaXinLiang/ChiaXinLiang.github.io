<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Your p50 Is Not Your UX</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">The same service: median 210 ms, p99 at 1.4 s</text>

  <text x="140" y="262" font-size="24" fill="#75786a">requests per bin</text>

  <!-- histogram -->
  <g fill="#a8bf92">
    <rect x="140" y="780" width="51" height="20"/>
    <rect x="197.5" y="632" width="51" height="168"/>
    <rect x="255" y="448" width="51" height="352"/>
    <rect x="312.5" y="400" width="51" height="400"/>
    <rect x="370" y="504" width="51" height="296"/>
    <rect x="427.5" y="608" width="51" height="192"/>
    <rect x="485" y="680" width="51" height="120"/>
    <rect x="542.5" y="724" width="51" height="76"/>
    <rect x="600" y="748" width="51" height="52"/>
    <rect x="657.5" y="764" width="51" height="36"/>
    <rect x="715" y="772" width="51" height="28"/>
    <rect x="772.5" y="780" width="51" height="20"/>
    <rect x="830" y="784" width="51" height="16"/>
    <rect x="887.5" y="788" width="51" height="12"/>
  </g>
  <g fill="#e5b3a6">
    <rect x="945" y="792" width="51" height="8"/>
    <rect x="1002.5" y="792" width="51" height="8"/>
  </g>

  <!-- p50 marker -->
  <text x="261" y="320" text-anchor="middle" font-size="26" font-weight="bold" fill="#5b7c46">p50 = 210 ms</text>
  <text x="261" y="352" text-anchor="middle" font-size="24" fill="#75786a">half of requests</text>
  <line x1="261" y1="368" x2="261" y2="800" stroke="#5b7c46" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- p99 marker -->
  <text x="945" y="280" text-anchor="middle" font-size="26" font-weight="bold" fill="#b04a3a">p99 = 1.4 s</text>
  <text x="945" y="312" text-anchor="middle" font-size="24" fill="#75786a">1 in 100 requests</text>
  <line x1="945" y1="330" x2="945" y2="800" stroke="#b04a3a" stroke-width="3" stroke-dasharray="10 8"/>

  <!-- axis -->
  <line x1="120" y1="800" x2="1080" y2="800" stroke="#d8d4c4" stroke-width="3"/>
  <g text-anchor="middle" font-size="24" fill="#75786a">
    <text x="140" y="844">0</text>
    <text x="370" y="844">400</text>
    <text x="600" y="844">800</text>
    <text x="830" y="844">1,200</text>
    <text x="1060" y="844">1,600</text>
  </g>
  <text x="600" y="890" text-anchor="middle" font-size="26" fill="#55584a">TTFT (ms)</text>

  <text x="600" y="944" text-anchor="middle" font-size="26" fill="#55584a">Over 20 turns, 18% of users hit the tail</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; llm-5</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">design for the tail</text>
</svg>
