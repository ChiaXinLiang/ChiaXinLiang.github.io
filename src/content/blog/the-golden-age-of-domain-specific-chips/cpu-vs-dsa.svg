<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Where the Silicon Goes</text>
  <text x="90" y="156" font-size="30" fill="#75786a">A general-purpose core vs a domain-specific accelerator</text>

  <text x="340" y="300" font-size="30" font-weight="bold" fill="#33362a" text-anchor="middle">General-purpose CPU core</text>
  <text x="860" y="300" font-size="30" font-weight="bold" fill="#33362a" text-anchor="middle">DSA (TPU-style)</text>

  <!-- CPU die -->
  <rect x="130" y="330" width="420" height="500" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <rect x="145" y="345" width="390" height="80" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="340" y="394" font-size="26" fill="#8a5138" text-anchor="middle">fetch / decode / rename</text>
  <rect x="145" y="440" width="185" height="100" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="237" y="482" font-size="26" fill="#8a5138" text-anchor="middle">branch</text>
  <text x="237" y="514" font-size="26" fill="#8a5138" text-anchor="middle">predictor</text>
  <rect x="345" y="440" width="190" height="100" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="440" y="482" font-size="26" fill="#8a5138" text-anchor="middle">OoO</text>
  <text x="440" y="514" font-size="26" fill="#8a5138" text-anchor="middle">scheduler</text>
  <rect x="145" y="555" width="390" height="165" rx="6" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="340" y="646" font-size="26" fill="#7a5a20" text-anchor="middle">L1 / L2 cache</text>
  <rect x="145" y="735" width="115" height="80" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <text x="202" y="783" font-size="26" font-weight="bold" fill="#5b7c46" text-anchor="middle">ALU</text>
  <rect x="275" y="735" width="260" height="80" rx="6" fill="#f4f1e6" stroke="#a3a08f" stroke-width="2"/>
  <text x="405" y="783" font-size="24" fill="#75786a" text-anchor="middle">registers, TLB, misc</text>
  <text x="340" y="866" font-size="24" fill="#75786a" text-anchor="middle">arithmetic: one small corner</text>

  <!-- DSA die -->
  <rect x="650" y="330" width="420" height="500" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <rect x="665" y="345" width="390" height="40" rx="6" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="860" y="373" font-size="24" fill="#8a5138" text-anchor="middle">control</text>
  <rect x="665" y="400" width="390" height="90" rx="6" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="860" y="437" font-size="24" fill="#7a5a20" text-anchor="middle">scratchpad SRAM</text>
  <text x="860" y="469" font-size="24" fill="#7a5a20" text-anchor="middle">(software-managed)</text>
  <rect x="665" y="505" width="390" height="310" rx="6" fill="#e7edd9" stroke="#5b7c46" stroke-width="2.5"/>
  <line x1="704" y1="505" x2="704" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="743" y1="505" x2="743" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="782" y1="505" x2="782" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="821" y1="505" x2="821" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="860" y1="505" x2="860" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="899" y1="505" x2="899" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="938" y1="505" x2="938" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="977" y1="505" x2="977" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="1016" y1="505" x2="1016" y2="815" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="544" x2="1055" y2="544" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="583" x2="1055" y2="583" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="622" x2="1055" y2="622" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="661" x2="1055" y2="661" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="700" x2="1055" y2="700" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="739" x2="1055" y2="739" stroke="#a8bf92" stroke-width="1.5"/>
  <line x1="665" y1="778" x2="1055" y2="778" stroke="#a8bf92" stroke-width="1.5"/>
  <rect x="750" y="618" width="220" height="56" rx="8" fill="#e7edd9"/>
  <text x="860" y="656" font-size="30" font-weight="bold" fill="#5b7c46" text-anchor="middle">65,536 MACs</text>
  <text x="860" y="866" font-size="24" fill="#75786a" text-anchor="middle">arithmetic: most of the die</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; par-4</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">delete what you don't use</text>
</svg>
