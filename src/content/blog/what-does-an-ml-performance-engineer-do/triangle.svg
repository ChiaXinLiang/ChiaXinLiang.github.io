<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <!-- Title -->
  <text x="600" y="120" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="58" font-weight="700" fill="#33362a">The ML Performance Triangle</text>
  <text x="600" y="180" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" fill="#75786a">Evaluate latency, throughput, and cost together</text>

  <!-- Triangle edges -->
  <path d="M 600 330 L 250 900 L 950 900 Z" fill="none" stroke="#d8d4c4" stroke-width="6"/>

  <!-- Vertex: Latency (top) -->
  <circle cx="600" cy="330" r="96" fill="#5b7c46"/>
  <text x="600" y="320" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#fdfbf4">LATENCY</text>
  <text x="600" y="362" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#e7edd9">how fast?</text>

  <!-- Vertex: Throughput (bottom left) -->
  <circle cx="250" cy="900" r="96" fill="#b06a4e"/>
  <text x="250" y="885" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#fdfbf4">THROUGH-</text>
  <text x="250" y="920" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" font-weight="700" fill="#fdfbf4">PUT</text>
  <text x="250" y="958" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#f0ddd0">how many?</text>

  <!-- Vertex: Cost (bottom right) -->
  <circle cx="950" cy="900" r="96" fill="#c9973b"/>
  <text x="950" y="895" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="700" fill="#fdfbf4">COST</text>
  <text x="950" y="937" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#f7ecd2">how much?</text>

  <!-- Edge tension labels -->
  <text x="360" y="580" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a" transform="rotate(-58 360 580)">bigger batches: more users, slower answers</text>
  <text x="840" y="580" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a" transform="rotate(58 840 580)">faster answers need more hardware</text>
  <text x="600" y="960" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#55584a">packing GPUs full is cheap — until users wait</text>

  <!-- Center -->
  <text x="600" y="700" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="32" font-weight="700" fill="#33362a">Meet all objectives</text>
  <text x="600" y="748" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">measure the tradeoffs</text>

  <!-- Footer -->
  <line x1="80" y1="1090" x2="1120" y2="1090" stroke="#e8e4d7" stroke-width="3"/>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">AI Performance · intro-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">same model, faster &amp; cheaper</text>
</svg>
