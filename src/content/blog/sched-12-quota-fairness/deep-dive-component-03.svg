 x="453" y="387" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Urgency + aging + debt</text><rect x="815" y="265" width="330" height="170" rx="8" fill="#f2edf8" stroke="#b8c5d3" stroke-width="2"/><text x="833" y="303" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Service audit</text><text x="833" y="387" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Window + feasible demand</text><path d="M390,350 L425,350" fill="none" stroke="#2779b8" stroke-width="3" marker-end="url(#a2779b8)"/><path d="M770,350 L805,350" fill="none" stroke="#2779b8" stroke-width="3" marker-end="url(#a2779b8)"/><text x="80" y="550" fill="#172c46" font-size="28" text-anchor="start" font-weight="bold">Audit splitting, blocked shapes and repeated interruptions</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">High priority does not establish fair share; report the accounting window and reclaim costs.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>