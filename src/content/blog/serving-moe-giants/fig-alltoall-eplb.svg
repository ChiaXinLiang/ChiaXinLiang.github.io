<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Dispatch, Combine, Hot Experts</text>
  <text x="90" y="156" font-size="30" fill="#75786a">EP all-to-all: the router decides who talks to whom, per token</text>

  <!-- source GPUs (attention side) -->
  <g stroke="#a3a08f" stroke-width="2">
    <rect x="175" y="250" width="150" height="80" fill="#f4f1e6"/>
    <rect x="375" y="250" width="150" height="80" fill="#f4f1e6"/>
    <rect x="575" y="250" width="150" height="80" fill="#f4f1e6"/>
    <rect x="775" y="250" width="150" height="80" fill="#f4f1e6"/>
  </g>
  <g font-size="26" font-weight="bold" fill="#33362a" text-anchor="middle">
    <text x="250" y="285">GPU 0</text>
    <text x="450" y="285">GPU 1</text>
    <text x="650" y="285">GPU 2</text>
    <text x="850" y="285">GPU 3</text>
  </g>
  <g font-size="21" fill="#75786a" text-anchor="middle">
    <text x="250" y="315">8 tokens</text>
    <text x="450" y="315">6 tokens</text>
    <text x="650" y="315">9 tokens</text>
    <text x="850" y="315">7 tokens</text>
  </g>

  <!-- dispatch lines: gray -->
  <g stroke="#d8d4c4" stroke-width="2.5" fill="none">
    <line x1="250" y1="330" x2="450" y2="545"/>
    <line x1="250" y1="330" x2="850" y2="545"/>
    <line x1="450" y1="330" x2="250" y2="545"/>
    <line x1="450" y1="330" x2="850" y2="545"/>
    <line x1="850" y1="330" x2="250" y2="545"/>
    <line x1="850" y1="330" x2="450" y2="545"/>
  </g>
  <!-- dispatch lines to hot expert GPU: red -->
  <g stroke="#b04a3a" stroke-width="4" fill="none">
    <line x1="250" y1="330" x2="650" y2="545"/>
    <line x1="450" y1="330" x2="650" y2="545"/>
    <line x1="650" y1="330" x2="650" y2="545"/>
    <line x1="850" y1="330" x2="650" y2="545"/>
  </g>
  <rect x="430" y="412" width="340" height="44" fill="#fdfbf4"/>
  <text x="600" y="442" font-size="25" font-weight="bold" fill="#55584a" text-anchor="middle">dispatch (all-to-all)</text>

  <!-- expert GPUs -->
  <g stroke-width="2">
    <rect x="175" y="545" width="150" height="100" fill="#e7edd9" stroke="#5b7c46"/>
    <rect x="375" y="545" width="150" height="100" fill="#e7edd9" stroke="#5b7c46"/>
    <rect x="575" y="545" width="150" height="100" fill="#e5b3a6" stroke="#b04a3a"/>
    <rect x="775" y="545" width="150" height="100" fill="#e7edd9" stroke="#5b7c46"/>
  </g>
  <g font-size="26" font-weight="bold" fill="#33362a" text-anchor="middle">
    <text x="250" y="580">GPU 4</text>
    <text x="450" y="580">GPU 5</text>
    <text x="650" y="580">GPU 6</text>
    <text x="850" y="580">GPU 7</text>
  </g>
  <g font-size="20" fill="#55584a" text-anchor="middle">
    <text x="250" y="607">experts 0–15</text>
    <text x="450" y="607">experts 16–31</text>
    <text x="650" y="607">experts 32–47</text>
    <text x="850" y="607">experts 48–63</text>
  </g>
  <text x="650" y="634" font-size="21" font-weight="bold" fill="#b04a3a" text-anchor="middle">E40: 3× load</text>
  <text x="250" y="634" font-size="21" fill="#75786a" text-anchor="middle">light</text>
  <text x="450" y="634" font-size="21" fill="#75786a" text-anchor="middle">normal</text>
  <text x="850" y="634" font-size="21" fill="#75786a" text-anchor="middle">light</text>

  <text x="600" y="692" font-size="23" fill="#75786a" text-anchor="middle">combine: expert outputs return over the same all-to-all</text>

  <!-- EPLB fix -->
  <line x1="712" y1="650" x2="812" y2="762" stroke="#5b7c46" stroke-width="3"/>
  <path d="M 812 762 l -14 -4 l 8 -11 z" fill="#5b7c46"/>
  <rect x="740" y="768" width="290" height="86" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="885" y="804" font-size="24" font-weight="bold" fill="#33362a" text-anchor="middle">GPU 7 gains E40 copy</text>
  <text x="885" y="834" font-size="20" fill="#55584a" text-anchor="middle">EPLB redundant expert</text>
  <text x="120" y="792" font-size="24" fill="#33362a">EPLB measures per-expert load,</text>
  <text x="120" y="824" font-size="24" fill="#33362a">replicates hot experts on light</text>
  <text x="120" y="856" font-size="24" fill="#33362a">GPUs, and splits their traffic.</text>

  <text x="600" y="928" font-size="26" font-weight="bold" fill="#33362a" text-anchor="middle">A decode step finishes when the slowest GPU does.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · scale-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">balance or stall</text>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">Expected experts touched = E × [1 − (1 − k/E)ᴮ]</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">Uniform independent token routing; diversity does not ensure balanced load</text></g></svg>
