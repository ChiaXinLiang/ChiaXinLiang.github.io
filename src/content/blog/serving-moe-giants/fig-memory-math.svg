<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Fitting 671 GB of FP8 Weights</text>
  <text x="90" y="156" font-size="30" fill="#75786a">Per-GPU memory for DeepSeek-V3 across 3 layouts</text>

  <!-- capacity line -->
  <line x1="911" y1="266" x2="911" y2="720" stroke="#b04a3a" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="911" y="250" font-size="24" font-weight="bold" fill="#b04a3a" text-anchor="middle">80 GB HBM (H100)</text>

  <!-- Row A -->
  <text x="200" y="296" font-size="26" font-weight="bold" fill="#33362a">A · TP8, 1 node</text>
  <rect x="200" y="308" width="747" height="60" fill="#e5b3a6" stroke="#b04a3a" stroke-width="2"/>
  <text x="961" y="348" font-size="28" font-weight="bold" fill="#b04a3a">84 GB</text>
  <text x="200" y="400" font-size="23" fill="#75786a">weights alone exceed HBM, 0 room for KV cache</text>

  <!-- Row B -->
  <text x="200" y="452" font-size="26" font-weight="bold" fill="#33362a">B · TP16, 2 nodes</text>
  <rect x="200" y="464" width="373" height="60" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="587" y="504" font-size="28" font-weight="bold" fill="#7a5a20">42 GB</text>
  <text x="200" y="556" font-size="23" fill="#75786a">fits, but every expert shreds into 7,168 × 128 sliver GEMMs</text>

  <!-- Row C -->
  <text x="200" y="608" font-size="26" font-weight="bold" fill="#33362a">C · TP8 attention + EP16 experts, 2 nodes</text>
  <rect x="200" y="620" width="382" height="60" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
  <text x="596" y="660" font-size="28" font-weight="bold" fill="#5b7c46">43 GB</text>
  <text x="200" y="712" font-size="23" fill="#75786a">16 whole experts per layer per GPU, ~37 GB left for KV cache</text>

  <!-- axis -->
  <line x1="200" y1="740" x2="1000" y2="740" stroke="#d8d4c4" stroke-width="2"/>
  <g font-size="22" fill="#75786a" text-anchor="middle">
    <text x="200" y="772">0</text>
    <text x="378" y="772">20</text>
    <text x="556" y="772">40</text>
    <text x="733" y="772">60</text>
    <text x="911" y="772">80</text>
  </g>
  <text x="1040" y="772" font-size="22" fill="#75786a">GB/GPU</text>
  <g stroke="#d8d4c4" stroke-width="2">
    <line x1="200" y1="740" x2="200" y2="750"/>
    <line x1="378" y1="740" x2="378" y2="750"/>
    <line x1="556" y1="740" x2="556" y2="750"/>
    <line x1="733" y1="740" x2="733" y2="750"/>
    <line x1="911" y1="740" x2="911" y2="750"/>
  </g>

  <!-- breakdown -->
  <rect x="200" y="808" width="800" height="130" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
  <text x="230" y="852" font-size="24" font-weight="bold" fill="#33362a">Layout C, per GPU:</text>
  <text x="230" y="888" font-size="24" fill="#55584a">58 MoE layers × 16 experts × 44 MB  ≈  41 GB experts</text>
  <text x="230" y="922" font-size="24" fill="#55584a">+ ~18 GB attention/dense shards ÷ 8 (TP)  ≈  2 GB  →  43 GB</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · scale-3</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">do the math first</text>
</svg>
