<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img">
<title>Step distillation teaches one move to match two teacher moves</title>
<rect width="1400" height="1000" fill="#f7fbff"/>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#367bb5"/></marker></defs>
<text x="50" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17334a">Step distillation teaches one move to match two teacher moves</text>
<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">The target is a coarse transition endpoint, not simply the original clean image</text>
<circle cx="180" cy="320" r="35" fill="#14a6a0"/>
<text x="180" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17334a">Noisy state x(t)</text>
<circle cx="680" cy="530" r="35" fill="#14a6a0"/>
<text x="680" y="460" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17334a">Teacher intermediate x(v)</text>
<circle cx="1160" cy="320" r="35" fill="#14a6a0"/>
<text x="1160" y="250" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17334a">Teacher endpoint x(u)</text>
<path d="M215 335L640 510" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M720 510L1120 335" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M215 300L1120 300" stroke="#de7d58" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="460" y="260" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#b75332">One learned student transition</text>
<text x="145" y="680" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Solve the coarse update for its required prediction:</text>
<text x="145" y="743" text-anchor="start" font-family="Arial,sans-serif" font-size="25" font-weight="400" fill="#17334a">Target x0 = [x(u) - (s(u)/s(t)) x(t)] / [a(u) - (s(u)/s(t)) a(t)]</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Teacher composition evaluates the predictor at an intermediate state before reaching the endpoint.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Progressive stages can halve evaluations while retaining the network architecture.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Preparation costs teacher execution and student training; validate the intended student scheduler.</text>
</svg>