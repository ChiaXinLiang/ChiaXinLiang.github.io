<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Count assignments</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">N tokens selecting k experts create kN</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">assignments</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Token count and expert load are different</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">populations</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Inspect the distribution</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Frequency, probability mass, and work can</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">disagree</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Balancing losses influence routing but do not</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">enforce runtime capacity</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Dispatch with identity</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Group token-expert pairs and preserve their</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">inverse mapping</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Communication and padding depend on the actual</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">assignment layout</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Combine every contribution</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Return expert outputs with their original</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">weights</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Overflow handling and duplicated assignments</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">change semantics</text>
