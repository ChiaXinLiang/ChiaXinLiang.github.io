<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="context-stroke"/></marker><marker id="a2779b8" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#2779b8"/></marker><marker id="a207b67" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#207b67"/></marker><marker id="a7750a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#7750a3"/></marker><marker id="ab16e17" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#b16e17"/></marker><marker id="ab34444" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#b34444"/></marker><marker id="a627183" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#627183"/></marker></defs><rect width="1200" height="760" fill="white"/><g font-family="Arial, sans-serif"><text x="40" y="63" fill="#172c46" font-size="38" text-anchor="start" font-weight="bold">Resource-weighted error</text><text x="40" y="111" fill="#627183" font-size="18" text-anchor="start" font-weight="normal">ILLUSTRATIVE CALCULATION • assumptions and sources in the article</text><path d="M40,140 L1160,140" fill="none" stroke="#d5e0e8" stroke-width="2"/><rect x="50" y="230" width="200" height="66" rx="0" fill="#172c46" stroke="white" stroke-width="2"/><text x="65" y="270" fill="white" font-size="23" text-anchor="start" font-weight="bold">Job</text><rect x="250" y="230" width="300" height="66" rx="0" fill="#172c46" stroke="white" stroke-width="2"/><text x="265" y="270" fill="white" font-size="23" text-anchor="start" font-weight="bold">Resource weight</text><rect x="550" y="230" width="240" height="66" rx="0" fill="#172c46" stroke="white" stroke-width="2"/><text x="565" y="270" fill="white" font-size="23" text-anchor="start" font-weight="bold">Relative error</text><rect x="790" y="230" width="360" height="66" rx="0" fill="#172c46" stroke="white" stroke-width="2"/><text x="805" y="270" fill="white" font-size="23" text-anchor="start" font-weight="bold">Weighted contribution</text><rect x="50" y="296" width="200" height="66" rx="0" fill="#f2f6fa" stroke="white" stroke-width="2"/><text x="65" y="336" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">A</text><rect x="250" y="296" width="300" height="66" rx="0" fill="#f2f6fa" stroke="white" stroke-width="2"/><text x="265" y="336" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">1 GPU-h</text><rect x="550" y="296" width="240" height="66" rx="0" fill="#f2f6fa" stroke="white" stroke-width="2"/><text x="565" y="336" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">50%</text><rect x="790" y="296" width="360" height="66" rx="0" fill="#f2f6fa" stroke="white" stroke-width="2"/><text x="805" y="336" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">0.5 GPU-h</text><rect x="50" y="362" width="200" height="66" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="65" y="402" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">B</text><rect x="250" y="362" width="300" height="66" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="265" y="402" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">1,000 GPU-h</text><rect x="550" y="362" width="240" height="66" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="565" y="402" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">5%</text><rect x="790" y="362" width="360" height="66" rx="0" fill="white" stroke="white" stroke-width="2"/><text x="805" y="402" fill="#172c46" font-size="23" text-anchor="start" font-weight="normal">50 GPU-h</text><rect x="65" y="475" width="500" height="145" rx="8" fill="#dceef9" stroke="#b8c5d3" stroke-width="2"/><text x="83" y="513" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Unweighted mean</text><text x="83" y="572" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">(50% + 5%) / 2 = 27.5%</text><rect x="635" y="475" width="500" height="145" rx="8" fill="#deeee6" stroke="#b8c5d3" stroke-width="2"/><text x="653" y="513" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">GPU-hour-weighted mean</text><text x="653" y="572" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">(0.5 + 50) / 1,001 ≈ 5.04%</text><rect x="35" y="642" width="1130" height="72" rx="8" fill="#f5f8fa" stroke="#d5e0e8" stroke-width="2"/><path d="M35,642 L35,714" fill="none" stroke="#2779b8" stroke-width="5"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Report both views: neither denominator can replace the per-job and resource-impact distributions.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original quantitative diagram • exact scales</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>