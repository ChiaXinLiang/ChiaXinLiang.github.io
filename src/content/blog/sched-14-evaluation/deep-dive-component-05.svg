text x="403" y="427" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Feasibility + owner + release</text><path d="M330,403 L375,403" fill="none" stroke="#2779b8" stroke-width="3" marker-end="url(#a2779b8)"/><path d="M740,403 L785,403 L785,285 L845,285" fill="none" stroke="#207b67" stroke-width="3" marker-end="url(#a207b67)"/><rect x="855" y="215" width="300" height="145" rx="8" fill="#e9f5ef" stroke="#b8c5d3" stroke-width="2"/><text x="873" y="253" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Pass → bounded trial</text><text x="873" y="312" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Observe real transition</text><path d="M740,403 L785,403 L785,530 L845,530" fill="none" stroke="#b34444" stroke-width="3" marker-end="url(#ab34444)"/><rect x="855" y="460" width="300" height="145" rx="8" fill="#fff4e3" stroke="#b8c5d3" stroke-width="2"/><text x="873" y="498" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Fail / timeout</text><text x="873" y="557" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Fallback + known release</text><text x="873" y="587" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">path</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Guards protect stated invariants; they do not prove no regression under every future fault.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>