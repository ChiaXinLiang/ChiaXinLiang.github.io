<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The Precision Ladder</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Llama-70B weights and decode ceiling on H100</text>

  <!-- Row 1: FP16 -->
  <text x="90" y="292" font-size="30" font-weight="bold" fill="#33362a">FP16 &#183; 2 bytes/weight</text>
  <text x="1110" y="292" text-anchor="end" font-size="28" fill="#55584a">&#8776; 47 tok/s on 2 GPUs</text>
  <rect x="90" y="310" width="1020" height="72" rx="8" fill="#b06a4e"/>
  <text x="112" y="356" font-size="27" font-weight="bold" fill="#fdfbf4">141.2 GB &#8212; needs 2 80 GB GPUs</text>

  <!-- Row 2: FP8 -->
  <text x="90" y="482" font-size="30" font-weight="bold" fill="#33362a">FP8 &#183; 1 byte/weight</text>
  <text x="1110" y="482" text-anchor="end" font-size="28" fill="#55584a">&#8776; 47 tok/s on 1 GPU</text>
  <rect x="90" y="500" width="510" height="72" rx="8" fill="#c9973b"/>
  <text x="112" y="546" font-size="27" font-weight="bold" fill="#fdfbf4">70.6 GB &#8212; fits 1 GPU</text>

  <!-- Row 3: INT4 -->
  <text x="90" y="672" font-size="30" font-weight="bold" fill="#33362a">INT4 &#183; 4.25 bits/weight</text>
  <text x="1110" y="672" text-anchor="end" font-size="28" fill="#55584a">&#8776; 89 tok/s on 1 GPU</text>
  <rect x="90" y="690" width="271" height="72" rx="8" fill="#5b7c46"/>
  <text x="112" y="736" font-size="27" font-weight="bold" fill="#fdfbf4">37.5 GB</text>
  <text x="381" y="736" font-size="26" fill="#55584a">+ 42 GB left for KV cache</text>

  <!-- Footnotes -->
  <line x1="90" y1="820" x2="1110" y2="820" stroke="#e8e4d7" stroke-width="2"/>
  <text x="600" y="872" text-anchor="middle" font-size="26" fill="#75786a">Ceiling = HBM bandwidth &#247; weight bytes (batch 1)</text>
  <text x="600" y="916" text-anchor="middle" font-size="26" fill="#75786a">H100 SXM reads 3.35 TB/s &#183; real kernels reach 60&#8211;80%</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; opt-3</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">count the bytes first</text>
</svg>
