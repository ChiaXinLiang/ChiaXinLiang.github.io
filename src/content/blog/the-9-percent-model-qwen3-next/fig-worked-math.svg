<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Equal-Token FLOP Illustration</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Training FLOPs ≈ 6 × active params × tokens D</text>

  <!-- Dense bar -->
  <text x="110" y="292" font-size="28" font-weight="bold" fill="#33362a">Qwen3-32B (dense)</text>
  <text x="1090" y="292" text-anchor="end" font-size="26" fill="#75786a">6 × 32B × D = 192B·D</text>
  <rect x="110" y="312" width="980" height="80" rx="10" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="600" y="364" text-anchor="middle" font-size="28" font-weight="bold" fill="#8a5138">100% of this FLOP estimate</text>

  <!-- MoE bar -->
  <text x="110" y="492" font-size="28" font-weight="bold" fill="#33362a">Qwen3-Next (3B active)</text>
  <text x="1090" y="492" text-anchor="end" font-size="26" fill="#75786a">6 × 3B × D = 18B·D</text>
  <rect x="110" y="512" width="92" height="80" rx="10" fill="#5b7c46"/>
  <text x="226" y="564" font-size="28" font-weight="bold" fill="#5b7c46">9.4%</text>

  <!-- Division -->
  <line x1="200" y1="680" x2="1000" y2="680" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="762" text-anchor="middle" font-size="40" font-weight="bold" fill="#33362a">18B·D ÷ 192B·D = 9.4%</text>
  <text x="600" y="814" text-anchor="middle" font-size="28" fill="#75786a">Reported GPU-hour cost: 9.3% (a different quantity)</text>

  <text x="600" y="892" text-anchor="middle" font-size="24" fill="#75786a">Equal D assumed; excludes attention and hardware efficiency</text>
  <text x="600" y="928" text-anchor="middle" font-size="24" fill="#75786a">Next used 15T sampled tokens; Qwen3 corpus had 36T</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI · cd-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">do the division</text>
</svg>
