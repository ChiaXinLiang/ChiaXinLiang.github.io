  <!-- Right panel: hybrid attention -->
  <text x="870" y="272" text-anchor="middle" font-size="30" font-weight="bold" fill="#b06a4e">Lever 2 · Hybrid attention</text>
  <g>
    <rect x="690" y="306" width="360" height="88" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
    <text x="870" y="360" text-anchor="middle" font-size="26" fill="#33362a">Gated DeltaNet · linear</text>
    <rect x="690" y="410" width="360" height="88" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
    <text x="870" y="464" text-anchor="middle" font-size="26" fill="#33362a">Gated DeltaNet · linear</text>
    <rect x="690" y="514" width="360" height="88" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
    <text x="870" y="568" text-anchor="middle" font-size="26" fill="#33362a">Gated DeltaNet · linear</text>
    <rect x="690" y="618" width="360" height="88" rx="10" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
    <text x="870" y="672" text-anchor="middle" font-size="26" fill="#33362a">Gated attention · full</text>
