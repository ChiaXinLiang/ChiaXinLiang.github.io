  <text x="870" y="748" text-anchor="middle" font-size="26" fill="#75786a">block repeated ×12 = 48 layers</text>
  <text x="870" y="790" text-anchor="middle" font-size="24" fill="#33362a">3 of 4 layers: constant cost per token</text>
  <text x="870" y="828" text-anchor="middle" font-size="24" fill="#75786a">KV cache lives in only 1 of 4 layers</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI · cd-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">architecture over scale</text>
