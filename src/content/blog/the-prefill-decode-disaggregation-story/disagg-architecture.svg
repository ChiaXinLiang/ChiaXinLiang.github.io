<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Disaggregated Serving, End to End</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Each phase gets hardware shaped like its workload</text>

  <!-- in/out labels -->
  <text x="315" y="252" text-anchor="middle" font-size="24" fill="#75786a">prompts in</text>
  <line x1="315" y1="262" x2="315" y2="290" stroke="#a3a08f" stroke-width="3"/>
  <polygon points="315,300 308,286 322,286" fill="#a3a08f"/>
  <text x="885" y="252" text-anchor="middle" font-size="24" fill="#75786a">tokens stream out</text>
  <line x1="885" y1="300" x2="885" y2="272" stroke="#a3a08f" stroke-width="3"/>
  <polygon points="885,262 878,276 892,276" fill="#a3a08f"/>

  <!-- Prefill pool -->
  <rect x="150" y="300" width="330" height="270" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
  <text x="315" y="350" text-anchor="middle" font-size="32" font-weight="bold" fill="#5b7c46">PREFILL POOL</text>
  <text x="315" y="392" text-anchor="middle" font-size="26" fill="#55584a">compute-heavy</text>
  <text x="315" y="444" text-anchor="middle" font-size="26" fill="#33362a">Rubin CPX (2026):</text>
  <text x="315" y="482" text-anchor="middle" font-size="26" fill="#33362a">30 PF NVFP4</text>
  <text x="315" y="520" text-anchor="middle" font-size="26" fill="#33362a">128 GB GDDR7, ~2.1 TB/s</text>

  <!-- Decode pool -->
  <rect x="720" y="300" width="330" height="270" rx="16" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="885" y="350" text-anchor="middle" font-size="32" font-weight="bold" fill="#8a5138">DECODE POOL</text>
  <text x="885" y="392" text-anchor="middle" font-size="26" fill="#55584a">bandwidth-heavy</text>
  <text x="885" y="444" text-anchor="middle" font-size="26" fill="#33362a">Rubin:</text>
  <text x="885" y="482" text-anchor="middle" font-size="26" fill="#33362a">288 GB HBM4</text>
  <text x="885" y="520" text-anchor="middle" font-size="26" fill="#33362a">~10 TB/s</text>

  <!-- KV handoff arrow -->
  <text x="600" y="365" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">KV handoff</text>
  <line x1="490" y1="410" x2="694" y2="410" stroke="#75786a" stroke-width="5"/>
  <polygon points="710,410 688,399 688,421" fill="#75786a"/>
  <text x="600" y="455" text-anchor="middle" font-size="24" fill="#55584a">~335 MB, streamed</text>
  <text x="600" y="487" text-anchor="middle" font-size="24" fill="#55584a">layer by layer</text>
  <text x="600" y="519" text-anchor="middle" font-size="24" fill="#75786a">hidden under prefill</text>

  <!-- KV tier store -->
  <rect x="390" y="660" width="420" height="180" rx="16" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="600" y="712" text-anchor="middle" font-size="30" font-weight="bold" fill="#7a5a20">KV CACHE TIER</text>
  <text x="600" y="755" text-anchor="middle" font-size="24" fill="#33362a">DRAM / SSD pooling for prefix reuse</text>
  <text x="600" y="793" text-anchor="middle" font-size="24" fill="#55584a">Mooncake · LMCache · NIXL</text>

  <!-- store / reuse arrows -->
  <line x1="330" y1="570" x2="430" y2="650" stroke="#a3a08f" stroke-width="4"/>
  <polygon points="442,659 424,653 434,637" fill="#a3a08f"/>
  <text x="330" y="632" text-anchor="middle" font-size="24" fill="#75786a">store</text>
  <line x1="770" y1="650" x2="870" y2="570" stroke="#a3a08f" stroke-width="4"/>
  <polygon points="882,560 872,577 861,563" fill="#a3a08f"/>
  <text x="870" y="632" text-anchor="middle" font-size="24" fill="#75786a">reuse</text>

  <text x="600" y="912" text-anchor="middle" font-size="26" fill="#55584a">Repeated prefixes become storage reads, not FLOPs</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Specs from NVIDIA Rubin CPX announcement (2025)</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI · cd-3</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">the cache learns to travel</text>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">Exposed handoff ≈ setup + max(0, MKV / Blink − overlap)</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">335 MB / 50 GB/s = 6.7 ms raw; overlap must be on the critical path</text></g></svg>
