<text x="85" y="390" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17334a">More codes near the modeled center</text>
<rect x="770" y="220" width="510" height="180" rx="10" fill="#e6f5ee" stroke="#14a6a0" stroke-width="2"/>
