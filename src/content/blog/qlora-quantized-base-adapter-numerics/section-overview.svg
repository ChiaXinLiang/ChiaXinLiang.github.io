<text x="800" y="310" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17334a">Weight codes + quantized scales</text>
<text x="800" y="355" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Double quantization reduces scale bytes</text>
