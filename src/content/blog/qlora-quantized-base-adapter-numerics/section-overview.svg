<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">Packed codebook indices and scale reconstruction feed wider-precision computation</text>
<text x="80" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Nonuniform NF4 codebook</text>
