<text x="90" y="640" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17334a">Fixed count ≠ fixed token identities</text>
<text x="90" y="710" text-anchor="start" font-family="Arial,sans-serif" font-size="28" font-weight="400" fill="#17334a">Merge: h = (s(i)h(i) + s(j)h(j)) / (s(i) + s(j))</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Weighted merging tracks how many original patches a token represents.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Similarity selection, gathering, and aggregation cost time; smaller later shapes must save more.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Spatial tasks need correspondence; a logical mask alone need not shrink dense execution.</text>
