<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>DeepSeek-V4.1-Flash 2: CSA2 Sharing and Hierarchical Sparse Indexing</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">DeepSeek-V4.1-Flash 2</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Establish the shared memory</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">A Full-mode layer establishes the relevant</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">cache and indices</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Full is a disclosed mode name, not proof of</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">dense attention</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Refresh selection where needed</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Reindex updates selection over shared</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">representations</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Cache sharing and index computation are</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">separate choices</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Reuse compatible indices</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Reuse-mode layers consume existing Top-K</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">selections</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Layer-specific queries still determine</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">attention weights</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Bound deeper candidate work</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Later decoder indexers examine a restricted</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">pool</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">The first global selection remains context-</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">dependent</text>
