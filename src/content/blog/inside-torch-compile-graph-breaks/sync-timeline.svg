<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">1 Branch, 1 Stall</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Why "if g.mean() &gt; 0.5" costs a sync per call</text>

  <!-- Panel A -->
  <text x="90" y="268" font-size="30" font-weight="bold" fill="#8a5138">With the data-dependent if (graph break)</text>

  <text x="90" y="352" font-size="24" fill="#75786a">host</text>
  <rect x="180" y="315" width="150" height="60" rx="8" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="255" y="352" text-anchor="middle" font-size="24" fill="#33362a">enqueue #1</text>
  <rect x="330" y="315" width="310" height="60" rx="8" fill="#e5b3a6" stroke="#b04a3a" stroke-width="3"/>
  <text x="485" y="352" text-anchor="middle" font-size="24" fill="#33362a">blocked on g.mean()</text>
  <rect x="640" y="315" width="150" height="60" rx="8" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="715" y="352" text-anchor="middle" font-size="24" fill="#33362a">enqueue #2</text>

  <text x="90" y="462" font-size="24" fill="#75786a">GPU</text>
  <rect x="240" y="425" width="320" height="60" rx="8" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
  <text x="400" y="462" text-anchor="middle" font-size="24" fill="#33362a">runs graph #1</text>
  <rect x="560" y="425" width="140" height="60" rx="8" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="630" y="462" text-anchor="middle" font-size="24" fill="#75786a">idle</text>
  <rect x="700" y="425" width="320" height="60" rx="8" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
  <text x="860" y="462" text-anchor="middle" font-size="24" fill="#33362a">runs graph #2</text>

  <text x="600" y="545" text-anchor="middle" font-size="24" fill="#75786a">GPU drains, 1 bool crosses PCIe, host resumes: a bubble every block</text>

  <!-- Panel B -->
  <text x="90" y="648" font-size="30" font-weight="bold" fill="#5b7c46">With torch.where (1 graph, no sync)</text>

  <text x="90" y="732" font-size="24" fill="#75786a">host</text>
  <rect x="180" y="695" width="260" height="60" rx="8" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="310" y="732" text-anchor="middle" font-size="24" fill="#33362a">enqueue whole step</text>
  <text x="470" y="732" font-size="24" fill="#75786a">then runs ahead to the next block</text>

  <text x="90" y="842" font-size="24" fill="#75786a">GPU</text>
  <rect x="240" y="805" width="780" height="60" rx="8" fill="#a8bf92" stroke="#5b7c46" stroke-width="3"/>
  <text x="630" y="842" text-anchor="middle" font-size="24" fill="#33362a">mean + fused where kernel, back to back</text>

  <!-- numbers box -->
  <rect x="90" y="885" width="1020" height="62" rx="8" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="600" y="925" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5a20">32 blocks &#215; ~20 &#181;s sync = 0.64 ms per step, 13% of a 5 ms decode</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; pt-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">keep decisions on the GPU</text>
</svg>
