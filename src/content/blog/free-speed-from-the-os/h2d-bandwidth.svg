<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">1 Copy, 4 Speeds</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">154 MB batch over PCIe Gen4 x16 (illustrative numbers)</text>

  <!-- row 1: pinned local -->
  <text x="90" y="290" font-size="26" fill="#33362a">pinned memory &#183; local NUMA node &#183; 5.9 ms</text>
  <rect x="90" y="305" width="819" height="56" rx="8" fill="#5b7c46"/>
  <text x="929" y="342" font-size="28" font-weight="bold" fill="#33362a">26 GB/s</text>

  <!-- row 2: pinned remote -->
  <text x="90" y="440" font-size="26" fill="#33362a">pinned memory &#183; remote NUMA node &#183; 8.6 ms</text>
  <rect x="90" y="455" width="567" height="56" rx="8" fill="#a8bf92"/>
  <text x="677" y="492" font-size="28" font-weight="bold" fill="#33362a">18 GB/s</text>

  <!-- row 3: pageable local -->
  <text x="90" y="590" font-size="26" fill="#33362a">pageable memory &#183; local NUMA node &#183; 12.8 ms</text>
  <rect x="90" y="605" width="378" height="56" rx="8" fill="#c9973b"/>
  <text x="488" y="642" font-size="28" font-weight="bold" fill="#33362a">12 GB/s</text>

  <!-- row 4: pageable remote -->
  <text x="90" y="740" font-size="26" fill="#33362a">pageable memory &#183; remote NUMA node &#183; 19.3 ms</text>
  <rect x="90" y="755" width="252" height="56" rx="8" fill="#b04a3a"/>
  <text x="362" y="792" font-size="28" font-weight="bold" fill="#33362a">8 GB/s</text>

  <text x="600" y="890" text-anchor="middle" font-size="30" font-weight="bold" fill="#55584a">3.3x spread from host configuration alone</text>
  <text x="600" y="930" text-anchor="middle" font-size="24" fill="#75786a">bar length = achieved host-to-device bandwidth (GB/s)</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; os-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">Pin it or lose it</text>
</g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Serial: c + D/β;  ideal overlap: max(c, D/β)</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">154 MB / 26 GB/s = 5.92 ms; compute c = 180 ms</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">Overlap requires pinned buffers, streams and readiness events</text></svg>
