<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue, Arial, sans-serif"><text x="90" y="105" font-size="43" fill="#33362a" font-weight="bold">A hypothetical 100T model</text><text x="90" y="155" font-size="28" fill="#75786a" font-weight="normal">Read the assumptions before applying the result</text><rect x="90" y="220" width="1020" height="190" rx="12" fill="#e7edd9"/><text x="125" y="269" font-size="31" fill="#33362a" font-weight="bold">WEIGHTS</text><text x="125" y="319" font-size="32" fill="#33362a" font-weight="normal">100T × 4.5 bits ≈ 56 TB</text><text x="125" y="368" font-size="32" fill="#55584a" font-weight="normal">13.5 TB/rack → at least 5 racks</text><text x="595" y="445" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="455" width="1020" height="190" rx="12" fill="#f7ecd2"/><text x="125" y="504" font-size="31" fill="#33362a" font-weight="bold">COARSE GRID</text><text x="125" y="554" font-size="32" fill="#33362a" font-weight="normal">5 × 6 × 6 × 8 × 3 × 12 × 6</text><text x="125" y="603" font-size="32" fill="#55584a" font-weight="normal">155,520 configuration trials</text><text x="595" y="680" font-size="32" fill="#5b7c46" font-weight="normal">↓</text><rect x="90" y="690" width="1020" height="190" rx="12" fill="#f0ddd0"/><text x="125" y="739" font-size="31" fill="#33362a" font-weight="bold">SWEEP COST</text><text x="125" y="789" font-size="32" fill="#33362a" font-weight="normal">15 minutes per configuration</text><text x="125" y="838" font-size="32" fill="#55584a" font-weight="normal">38,880 hours ≈ 4.4 pod-years</text><text x="90" y="1020" font-size="24" fill="#75786a" font-weight="normal">Illustrative arithmetic · NVIDIA GB200 NVL72 specifications</text><path d="M90 1080H1110" stroke="#e8e4d7" stroke-width="3"/><text x="90" y="1135" font-size="28" fill="#a3a08f" font-weight="bold">AI Performance · future-1</text