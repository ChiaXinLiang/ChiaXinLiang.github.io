<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#5b7c46"/></marker>
  <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55584a"/></marker></defs>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#33362a">An RNN, unrolled through time</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">one cell, reused — memory passed hand to hand</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- four cells -->
    <g>
      <rect x="120" y="480" width="180" height="140" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
      <rect x="390" y="480" width="180" height="140" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
      <rect x="660" y="480" width="180" height="140" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
      <rect x="930" y="480" width="180" height="140" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
      <text x="210" y="562" font-size="32" font-weight="700" fill="#33362a">cell</text>
      <text x="480" y="562" font-size="32" font-weight="700" fill="#33362a">cell</text>
      <text x="750" y="562" font-size="32" font-weight="700" fill="#33362a">cell</text>
      <text x="1020" y="562" font-size="32" font-weight="700" fill="#33362a">cell</text>
    </g>
    <!-- hidden state arrows -->
    <line x1="300" y1="550" x2="382" y2="550" stroke="#b06a4e" stroke-width="7" marker-end="url(#a)"/>
    <line x1="570" y1="550" x2="652" y2="550" stroke="#b06a4e" stroke-width="7" marker-end="url(#a)"/>
    <line x1="840" y1="550" x2="922" y2="550" stroke="#b06a4e" stroke-width="7" marker-end="url(#a)"/>
    <text x="600" y="850" font-size="27" font-weight="700" fill="#b06a4e">terracotta arrows = the hidden state: a running summary, the ONLY memory channel</text>

    <!-- inputs -->
    <g font-size="30" fill="#33362a">
      <text x="210" y="760">"The"</text><text x="480" y="760">"keys"</text><text x="750" y="760">"to"</text><text x="1020" y="760">"the…"</text>
    </g>
    <line x1="210" y1="710" x2="210" y2="628" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="480" y1="710" x2="480" y2="628" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="750" y1="710" x2="750" y2="628" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="1020" y1="710" x2="1020" y2="628" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>

    <!-- outputs -->
    <line x1="210" y1="472" x2="210" y2="395" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="480" y1="472" x2="480" y2="395" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="750" y1="472" x2="750" y2="395" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <line x1="1020" y1="472" x2="1020" y2="395" stroke="#55584a" stroke-width="5" marker-end="url(#g)"/>
    <text x="600" y="350" font-size="27" fill="#75786a">outputs (a prediction at each step)</text>

    <text x="600" y="920" font-size="27" fill="#55584a">info from word 3 reaches word 50 only by surviving 47 rewrites — a game of telephone</text>
  </g>

  <line x1="80" y1="1030" x2="1120" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Follows the standard unrolled-RNN presentation (Karpathy, 2015; Olah, "Understanding LSTMs")</text>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">LLM Basics · arch-2</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">same weights at every step</text>
</svg>
