<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#33362a">The wall: one word at a time</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">an RNN on parallel hardware wastes almost all of it</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- RNN chain -->
    <text x="140" y="300" font-size="30" font-weight="700" fill="#b06a4e">RNN: strictly in line</text>
    <g text-anchor="middle" font-size="26">
      <rect x="140" y="330" width="110" height="80" rx="10" fill="#b06a4e"/><text x="195" y="380" fill="#fdfbf4">t=1</text>
      <rect x="270" y="330" width="110" height="80" rx="10" fill="#c98a70"/><text x="325" y="380" fill="#fdfbf4">t=2</text>
      <rect x="400" y="330" width="110" height="80" rx="10" fill="#dcae9c"/><text x="455" y="380" fill="#7a4432">t=3</text>
      <rect x="530" y="330" width="110" height="80" rx="10" fill="#f0ddd0"/><text x="585" y="380" fill="#a3a08f">t=4 wait</text>
      <rect x="660" y="330" width="110" height="80" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/><text x="715" y="380" fill="#a3a08f">t=5 wait</text>
      <rect x="790" y="330" width="110" height="80" rx="10" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/><text x="845" y="380" fill="#a3a08f">…</text>
    </g>
    <text x="600" y="470" text-anchor="middle" font-size="26" fill="#55584a">step 50 cannot start — its input IS step 49's output</text>

    <!-- GPU lanes -->
    <text x="140" y="600" font-size="30" font-weight="700" fill="#5b7c46">GPU: tens of thousands of parallel lanes</text>
    <g>
      <rect x="140" y="630" width="920" height="34" rx="8" fill="#5b7c46"/>
      <rect x="140" y="676" width="920" height="34" rx="8" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="140" y="722" width="920" height="34" rx="8" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="140" y="768" width="920" height="34" rx="8" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="140" y="814" width="920" height="34" rx="8" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    </g>
    <text x="600" y="700" text-anchor="middle" font-size="24" fill="#75786a"></text>
    <text x="1075" y="655" text-anchor="start" font-size="24" fill="#5b7c46"></text>
    <text x="600" y="900" text-anchor="middle" font-size="27" fill="#55584a">one lane busy, the rest idle — the dependency chain forbids parallelism</text>
    <text x="600" y="945" text-anchor="middle" font-size="26" font-weight="700" fill="#b06a4e">just as scale became capability,</text>
    <text x="600" y="985" text-anchor="middle" font-size="26" font-weight="700" fill="#b06a4e">language's best architecture couldn't absorb parallel compute</text>
  </g>

  <line x1="80" y1="1030" x2="1120" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">LLM Basics · arch-2</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">the flaw with no patch</text>
</svg>
