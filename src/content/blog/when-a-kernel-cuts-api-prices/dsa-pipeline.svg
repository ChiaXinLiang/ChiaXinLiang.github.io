      <rect x="832" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="880" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="928" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    </g>
    <!-- query token -->
    <rect x="1020" y="284" width="40" height="40" fill="#c9973b" stroke="#7a5a20" stroke-width="2"/>
    <text x="1040" y="352" text-anchor="middle" font-size="24" fill="#7a5a20">query</text>

    <!-- arrow down -->
    <line x1="600" y1="336" x2="600" y2="398" stroke="#a3a08f" stroke-width="3"/>
    <path d="M 600 410 L 591 394 L 609 394 Z" fill="#a3a08f"/>

    <!-- Step 2: lightning indexer box -->
    <rect x="150" y="418" width="900" height="128" rx="10" fill="#e7edd9" stroke="#a8bf92" stroke-width="2.5"/>
    <text x="600" y="466" text-anchor="middle" font-size="30" font-weight="bold" fill="#5b7c46">2 &#183; Lightning indexer scores every token</text>
    <text x="600" y="510" text-anchor="middle" font-size="25" fill="#55584a">a few narrow FP8 heads, ReLU instead of softmax</text>

    <line x1="600" y1="546" x2="600" y2="600" stroke="#a3a08f" stroke-width="3"/>
    <path d="M 600 612 L 591 596 L 609 596 Z" fill="#a3a08f"/>

    <!-- Step 3: selected row -->
    <text x="120" y="650" font-size="26" font-weight="bold" fill="#55584a">3 &#183; Top-2,048 tokens selected for this query</text>
    <g>
      <rect x="120" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="168" y="672" width="40" height="40" fill="#b06a4e" stroke="#8a5138" stroke-width="2"/>
      <rect x="216" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
