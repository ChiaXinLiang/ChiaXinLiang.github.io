      <rect x="408" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="456" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <text x="540" y="702" font-size="30" fill="#75786a">&#8230;</text>
      <rect x="592" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="640" y="672" width="40" height="40" fill="#b06a4e" stroke="#8a5138" stroke-width="2"/>
      <rect x="688" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="736" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="784" y="672" width="40" height="40" fill="#b06a4e" stroke="#8a5138" stroke-width="2"/>
      <rect x="832" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
      <rect x="880" y="672" width="40" height="40" fill="#b06a4e" stroke="#8a5138" stroke-width="2"/>
      <rect x="928" y="672" width="40" height="40" fill="#f4f1e6" stroke="#e8e4d7" stroke-width="2"/>
    </g>

    <line x1="600" y1="724" x2="600" y2="778" stroke="#a3a08f" stroke-width="3"/>
    <path d="M 600 790 L 591 774 L 609 774 Z" fill="#a3a08f"/>

    <!-- Step 4: full attention box -->
    <rect x="150" y="796" width="900" height="128" rx="10" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2.5"/>
    <text x="600" y="844" text-anchor="middle" font-size="30" font-weight="bold" fill="#8a5138">4 &#183; Full MLA attention over 2,048 tokens only</text>
    <text x="600" y="888" text-anchor="middle" font-size="25" fill="#55584a">64&#215; fewer KV reads per decode step at 128K context</text>



    <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
    <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Mechanism from DeepSeek-V3.2-Exp report (2025)</text>
    <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; cd-2</text>
    <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">scan cheap, attend rarely</text>
  </g>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">Nd = L(L+1)/2;  Ns = kL − k(k−1)/2</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">L = 131,072, k = 2,048: main pairs shrink 32.25×; indexer remains</text></g></svg>
