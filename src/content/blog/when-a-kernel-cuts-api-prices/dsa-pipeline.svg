    <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Score everything cheaply, attend to 2,048 for real</text>

    <!-- Step 1: cached context row -->
    <text x="120" y="262" font-size="26" font-weight="bold" fill="#55584a">1 &#183; Cached context: 131,072 tokens</text>
    <g>
      <rect x="120" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="168" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
      <rect x="216" y="284" width="40" height="40" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
