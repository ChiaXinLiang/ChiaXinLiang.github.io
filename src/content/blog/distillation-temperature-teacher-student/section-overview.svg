<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Teacher and student probabilities share the same class interface and temperature.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">The scaled logit gradient is T(p − q); high-temperature matching concerns centered logits.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Smaller deployment cost requires an efficient student architecture and measured execution.</text>
