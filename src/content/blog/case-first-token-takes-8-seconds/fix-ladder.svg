<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Four Ways Out, Ranked</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">What each fix buys against an 8-second prefill</text>

  <!-- card 1 -->
  <rect x="90" y="250" width="1020" height="150" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="250" width="12" height="150" rx="6" fill="#5b7c46"/>
  <circle cx="160" cy="325" r="30" fill="#5b7c46"/>
  <text x="160" y="337" text-anchor="middle" font-size="34" font-weight="bold" fill="#fdfbf4">1</text>
  <text x="220" y="298" font-size="30" font-weight="bold" fill="#33362a">Chunked prefill</text>
  <text x="220" y="338" font-size="25" fill="#55584a">Slice the 128k prompt; interleave decode between chunks</text>
  <text x="220" y="376" font-size="25" font-weight="bold" fill="#5b7c46">Whale TTFT unchanged (~8 s) · bystanders' TPOT rescued</text>

  <!-- card 2 -->
  <rect x="90" y="425" width="1020" height="150" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="425" width="12" height="150" rx="6" fill="#c9973b"/>
  <circle cx="160" cy="500" r="30" fill="#c9973b"/>
  <text x="160" y="512" text-anchor="middle" font-size="34" font-weight="bold" fill="#fdfbf4">2</text>
  <text x="220" y="473" font-size="30" font-weight="bold" fill="#33362a">Prefix caching</text>
  <text x="220" y="513" font-size="25" fill="#55584a">Keep KV of the shared 112k prefix; prefill only the 16k suffix</text>
  <text x="220" y="551" font-size="25" font-weight="bold" fill="#7a5a20">TTFT 8 s → 1.7 s on cache hits (5× fewer FLOPs)</text>

  <!-- card 3 -->
  <rect x="90" y="600" width="1020" height="150" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="600" width="12" height="150" rx="6" fill="#b06a4e"/>
  <circle cx="160" cy="675" r="30" fill="#b06a4e"/>
  <text x="160" y="687" text-anchor="middle" font-size="34" font-weight="bold" fill="#fdfbf4">3</text>
  <text x="220" y="648" font-size="30" font-weight="bold" fill="#33362a">Disaggregated prefill pool</text>
  <text x="220" y="688" font-size="25" fill="#55584a">Dedicated prefill GPUs; stream the KV cache to decode nodes</text>
  <text x="220" y="726" font-size="25" font-weight="bold" fill="#8a5138">Prefill scales with load · decode never blocked</text>

  <!-- card 4 -->
  <rect x="90" y="775" width="1020" height="150" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
  <rect x="90" y="775" width="12" height="150" rx="6" fill="#8a5138"/>
  <circle cx="160" cy="850" r="30" fill="#8a5138"/>
  <text x="160" y="862" text-anchor="middle" font-size="34" font-weight="bold" fill="#fdfbf4">4</text>
  <text x="220" y="823" font-size="30" font-weight="bold" fill="#33362a">Prefill-specialized silicon</text>
  <text x="220" y="863" font-size="25" fill="#55584a">Rubin-CPX-style parts: dense compute, GDDR7 instead of HBM</text>
  <text x="220" y="901" font-size="25" font-weight="bold" fill="#8a5138">Bends the cost curve · not in your rack today</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · case-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">what each fix buys</text>
</svg>
