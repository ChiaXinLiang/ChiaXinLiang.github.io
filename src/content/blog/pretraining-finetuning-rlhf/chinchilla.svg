<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Same Compute, 2 Recipes</text>
  <text x="90" y="156" font-size="30" fill="#75786a">Gopher vs Chinchilla: how to spend ~5.5 × 10²³ FLOPs</text>

  <!-- Gopher block -->
  <text x="90" y="270" font-size="32" font-weight="bold" fill="#33362a">Gopher · 280B params × 300B tokens</text>
  <text x="90" y="330" font-size="24" fill="#55584a">Params</text>
  <rect x="250" y="300" width="640" height="44" fill="#5b7c46"/>
  <text x="910" y="330" font-size="24" fill="#55584a">280B</text>
  <text x="90" y="396" font-size="24" fill="#55584a">Tokens</text>
  <rect x="250" y="366" width="120" height="44" fill="#c9973b"/>
  <text x="390" y="396" font-size="24" fill="#55584a">300B · ≈1.1 tokens/param</text>

  <!-- Chinchilla block -->
  <text x="90" y="510" font-size="32" font-weight="bold" fill="#33362a">Chinchilla · 70B params × 1.4T tokens</text>
  <text x="90" y="570" font-size="24" fill="#55584a">Params</text>
  <rect x="250" y="540" width="160" height="44" fill="#5b7c46"/>
  <text x="430" y="570" font-size="24" fill="#55584a">70B</text>
  <text x="90" y="636" font-size="24" fill="#55584a">Tokens</text>
  <rect x="250" y="606" width="560" height="44" fill="#c9973b"/>
  <text x="830" y="636" font-size="24" fill="#55584a">1.4T · 20 tokens/param</text>

  <!-- Compute check box -->
  <rect x="90" y="720" width="1020" height="200" rx="16" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="120" y="775" font-size="28" font-weight="bold" fill="#33362a">Check it by hand: C ≈ 6 × N × D</text>
  <text x="120" y="822" font-size="26" fill="#55584a">Gopher: 6 × 280e9 × 300e9 ≈ 5.0 × 10²³ FLOPs</text>
  <text x="120" y="864" font-size="26" fill="#55584a">Chinchilla: 6 × 70e9 × 1.4e12 ≈ 5.9 × 10²³ FLOPs</text>
  <text x="120" y="906" font-size="26" font-weight="bold" fill="#5b7c46">≈ equal cost, yet Chinchilla wins most benchmarks</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-size="24" fill="#a3a08f">Data from Hoffmann et al. (2022), Table 1</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics · llm-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">Tokens beat parameters</text>
</svg>
