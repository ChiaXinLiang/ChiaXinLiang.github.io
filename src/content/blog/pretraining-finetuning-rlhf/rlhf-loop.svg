<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">Inside the RLHF Loop</text>
  <text x="90" y="156" font-size="30" fill="#75786a">A learned reward model turns human preferences into weights</text>

  <!-- Boxes -->
  <rect x="90" y="250" width="220" height="90" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="200" y="305" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">Prompt</text>

  <rect x="430" y="230" width="340" height="130" rx="14" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
  <text x="600" y="285" text-anchor="middle" font-size="30" font-weight="bold" fill="#8a5138">Policy model</text>
  <text x="600" y="325" text-anchor="middle" font-size="24" fill="#75786a">the LLM in training</text>

  <rect x="890" y="250" width="220" height="90" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="1000" y="305" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">Response</text>

  <rect x="890" y="470" width="220" height="110" rx="14" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
  <text x="1000" y="515" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5a20">Reward model</text>
  <text x="1000" y="552" text-anchor="middle" font-size="24" fill="#75786a">scores answers</text>

  <rect x="430" y="470" width="340" height="110" rx="14" fill="#e7edd9" stroke="#a8bf92" stroke-width="3"/>
  <text x="600" y="515" text-anchor="middle" font-size="30" font-weight="bold" fill="#5b7c46">PPO update</text>
  <text x="600" y="552" text-anchor="middle" font-size="24" fill="#75786a">maximize r − β·KL</text>

  <rect x="90" y="470" width="220" height="110" rx="14" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="3"/>
  <text x="200" y="515" text-anchor="middle" font-size="26" font-weight="bold" fill="#55584a">SFT reference</text>
  <text x="200" y="552" text-anchor="middle" font-size="24" fill="#75786a">frozen copy</text>

  <!-- Arrows -->
  <line x1="310" y1="295" x2="414" y2="295" stroke="#75786a" stroke-width="4"/>
  <path d="M 430 295 L 410 283 L 410 307 Z" fill="#75786a"/>

  <line x1="770" y1="295" x2="874" y2="295" stroke="#75786a" stroke-width="4"/>
  <path d="M 890 295 L 870 283 L 870 307 Z" fill="#75786a"/>

  <line x1="1000" y1="340" x2="1000" y2="454" stroke="#75786a" stroke-width="4"/>
  <path d="M 1000 470 L 988 450 L 1012 450 Z" fill="#75786a"/>
  <text x="975" y="410" text-anchor="end" font-size="24" fill="#75786a">score it</text>

  <line x1="890" y1="525" x2="786" y2="525" stroke="#75786a" stroke-width="4"/>
  <path d="M 770 525 L 790 513 L 790 537 Z" fill="#75786a"/>
  <text x="830" y="505" text-anchor="middle" font-size="24" fill="#75786a">r(x, y)</text>

  <line x1="600" y1="470" x2="600" y2="376" stroke="#75786a" stroke-width="4"/>
  <path d="M 600 360 L 588 380 L 612 380 Z" fill="#75786a"/>
  <text x="622" y="422" font-size="24" fill="#75786a">raise the reward</text>

  <line x1="310" y1="525" x2="414" y2="525" stroke="#a3a08f" stroke-width="4" stroke-dasharray="10 8"/>
  <path d="M 430 525 L 410 513 L 410 537 Z" fill="#a3a08f"/>
  <text x="364" y="505" text-anchor="middle" font-size="24" fill="#a3a08f">KL leash</text>

  <!-- Notes -->
  <text x="90" y="700" font-size="28" font-weight="bold" fill="#33362a">The loop, in words</text>
  <text x="90" y="748" font-size="26" fill="#55584a">1 · The policy answers a prompt; the reward model scores it</text>
  <text x="90" y="792" font-size="26" fill="#55584a">2 · PPO nudges the weights toward higher-scoring answers</text>
  <text x="90" y="836" font-size="26" fill="#55584a">3 · A KL penalty keeps the policy near its SFT starting</text>
  <text x="122" y="880" font-size="26" fill="#55584a">point, so it cannot drift into reward-hacked nonsense</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-size="24" fill="#a3a08f">Loop structure after Ouyang et al. (2022)</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics · llm-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">Preferences become weights</text>
</svg>
