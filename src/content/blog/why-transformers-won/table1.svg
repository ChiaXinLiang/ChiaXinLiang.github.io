<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The argument, in 1 table</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Layer-by-layer costs of the competing sequence designs</text>

  <!-- highlight cells -->
  <rect x="680" y="330" width="220" height="120" fill="#e7edd9"/>
  <rect x="900" y="330" width="210" height="120" fill="#e7edd9"/>
  <rect x="680" y="450" width="220" height="120" fill="#e5b3a6"/>
  <rect x="900" y="450" width="210" height="120" fill="#e5b3a6"/>

  <!-- grid -->
  <g stroke="#d8d4c4" stroke-width="2" fill="none">
    <rect x="90" y="250" width="1020" height="440"/>
    <line x1="90" y1="330" x2="1110" y2="330"/>
    <line x1="90" y1="450" x2="1110" y2="450"/>
    <line x1="90" y1="570" x2="1110" y2="570"/>
    <line x1="430" y1="250" x2="430" y2="690"/>
    <line x1="680" y1="250" x2="680" y2="690"/>
    <line x1="900" y1="250" x2="900" y2="690"/>
  </g>

  <!-- header -->
  <g font-size="27" font-weight="bold" fill="#75786a" text-anchor="middle">
    <text x="260" y="298">architecture</text>
    <text x="555" y="298">compute / layer</text>
    <text x="790" y="298">sequential ops</text>
    <text x="1005" y="298">path length</text>
  </g>

  <!-- rows -->
  <text x="110" y="400" font-size="30" font-weight="bold" fill="#5b7c46">Self-attention</text>
  <g font-size="30" fill="#33362a" text-anchor="middle">
    <text x="555" y="400">O(n&#178; &#183; d)</text>
  </g>
  <g font-size="30" font-weight="bold" fill="#5b7c46" text-anchor="middle">
    <text x="790" y="400">O(1)</text>
    <text x="1005" y="400">O(1)</text>
  </g>

  <text x="110" y="520" font-size="30" font-weight="bold" fill="#8a5138">Recurrent (RNN)</text>
  <text x="555" y="520" font-size="30" fill="#33362a" text-anchor="middle">O(n &#183; d&#178;)</text>
  <g font-size="30" font-weight="bold" fill="#b04a3a" text-anchor="middle">
    <text x="790" y="520">O(n)</text>
    <text x="1005" y="520">O(n)</text>
  </g>

  <text x="110" y="640" font-size="30" fill="#55584a">Convolutional</text>
  <g font-size="30" fill="#55584a" text-anchor="middle">
    <text x="555" y="640">O(k &#183; n &#183; d&#178;)</text>
    <text x="790" y="640">O(1)</text>
    <text x="1005" y="640">O(log n)</text>
  </g>

  <!-- legend -->
  <g font-size="26" fill="#55584a" text-anchor="middle">
    <text x="600" y="770">n = sequence length &#160;&#183;&#160; d = model width &#160;&#183;&#160; k = kernel size</text>
    <text x="600" y="818">sequential ops = the dependency chain the hardware must wait out</text>
    <text x="600" y="866">path length = hops for information to travel between 2 tokens</text>
  </g>
  <text x="600" y="935" text-anchor="middle" font-size="30" font-weight="bold" fill="#5b7c46">O(1) sequential operations is the whole revolution</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Redrawn from Vaswani et al. (2017), Table 1</text>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">LLM Basics &#183; tf-3</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">Wait on nothing</text>
</svg>
