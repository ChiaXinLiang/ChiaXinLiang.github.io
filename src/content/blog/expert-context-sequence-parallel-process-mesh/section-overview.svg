<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">Expert, Context, and Sequence Parallelism</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Expert parallelism</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Route token states to ranks owning selected</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">experts</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">All-to-all volume and imbalance determine</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">dispatch cost</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Context parallelism</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Partition sequence positions across ranks</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Attention still needs the appropriate remote</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">K/V information</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Sequence parallelism</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Shard selected activation operations along</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">tokens</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Collectives connect layouts around tensor-</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">parallel operations</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Process mesh</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Specify which dimensions are independent or</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">factored</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Never multiply overlapping group sizes blindly</text>
