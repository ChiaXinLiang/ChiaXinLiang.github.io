<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">What an FPGA Actually Is</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">a grid of tiny memories pretending to be logic gates</text>

<text x="325" y="262" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">1 4-input LUT</text>
<text x="875" y="262" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">tiled into a fabric</text>

<!-- left: input lines -->
<line x1="140" y1="360" x2="300" y2="360" stroke="#75786a" stroke-width="3"/>
<line x1="140" y1="420" x2="300" y2="420" stroke="#75786a" stroke-width="3"/>
<line x1="140" y1="480" x2="300" y2="480" stroke="#75786a" stroke-width="3"/>
<line x1="140" y1="540" x2="300" y2="540" stroke="#75786a" stroke-width="3"/>
<text x="125" y="368" text-anchor="end" font-size="24" fill="#55584a">a</text>
<text x="125" y="428" text-anchor="end" font-size="24" fill="#55584a">b</text>
<text x="125" y="488" text-anchor="end" font-size="24" fill="#55584a">c</text>
<text x="125" y="548" text-anchor="end" font-size="24" fill="#55584a">d</text>

<!-- left: 16 SRAM cells, 2 cols x 8 rows -->
<g stroke="#d8d4c4" stroke-width="2" fill="#fdfbf4">
<rect x="300" y="310" width="40" height="40"/><rect x="340" y="310" width="40" height="40"/>
<rect x="300" y="350" width="40" height="40"/><rect x="340" y="350" width="40" height="40"/>
<rect x="300" y="390" width="40" height="40"/><rect x="340" y="390" width="40" height="40"/>
<rect x="300" y="430" width="40" height="40"/><rect x="340" y="430" width="40" height="40"/>
<rect x="300" y="470" width="40" height="40"/><rect x="340" y="470" width="40" height="40"/>
<rect x="300" y="510" width="40" height="40"/><rect x="340" y="510" width="40" height="40"/>
<rect x="300" y="550" width="40" height="40"/><rect x="340" y="550" width="40" height="40"/>
<rect x="300" y="590" width="40" height="40"/>
</g>
<rect x="340" y="590" width="40" height="40" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<g font-size="24" fill="#75786a" text-anchor="middle">
<text x="320" y="338">0</text><text x="360" y="338">0</text>
<text x="320" y="378">0</text><text x="360" y="378">0</text>
<text x="320" y="418">0</text><text x="360" y="418">0</text>
<text x="320" y="458">0</text><text x="360" y="458">0</text>
<text x="320" y="498">0</text><text x="360" y="498">0</text>
<text x="320" y="538">0</text><text x="360" y="538">0</text>
<text x="320" y="578">0</text><text x="360" y="578">0</text>
<text x="320" y="618">0</text>
</g>
<text x="360" y="618" text-anchor="middle" font-size="24" font-weight="bold" fill="#5b7c46">1</text>

<!-- output arrow -->
<line x1="380" y1="470" x2="520" y2="470" stroke="#75786a" stroke-width="3"/>
<polygon points="540,470 514,460 514,480" fill="#75786a"/>
<text x="552" y="478" font-size="24" fill="#55584a">out</text>

<text x="325" y="700" text-anchor="middle" font-size="24" fill="#55584a">the 4 inputs select 1 of 16 rows;</text>
<text x="325" y="734" text-anchor="middle" font-size="24" fill="#55584a">the stored bit becomes the output</text>
<text x="325" y="790" text-anchor="middle" font-size="24" fill="#5b7c46">store 0...0001, it is an AND gate</text>
<text x="325" y="824" text-anchor="middle" font-size="24" fill="#5b7c46">store other bits, any 4-input gate</text>

<!-- right: routing channels -->
<g stroke="#d8d4c4" stroke-width="2">
<line x1="660" y1="425" x2="1050" y2="425"/>
<line x1="660" y1="435" x2="1050" y2="435"/>
<line x1="660" y1="555" x2="1050" y2="555"/>
<line x1="660" y1="565" x2="1050" y2="565"/>
<line x1="785" y1="300" x2="785" y2="690"/>
<line x1="795" y1="300" x2="795" y2="690"/>
<line x1="915" y1="300" x2="915" y2="690"/>
<line x1="925" y1="300" x2="925" y2="690"/>
</g>
<!-- switch boxes -->
<g fill="#f7ecd2" stroke="#c9973b" stroke-width="2">
<rect x="778" y="418" width="24" height="24"/>
<rect x="908" y="418" width="24" height="24"/>
<rect x="778" y="548" width="24" height="24"/>
<rect x="908" y="548" width="24" height="24"/>
</g>
<!-- logic blocks -->
<g fill="#e7edd9" stroke="#a8bf92" stroke-width="2">
<rect x="680" y="320" width="90" height="90" rx="8"/><rect x="810" y="320" width="90" height="90" rx="8"/><rect x="940" y="320" width="90" height="90" rx="8"/>
<rect x="680" y="450" width="90" height="90" rx="8"/><rect x="810" y="450" width="90" height="90" rx="8"/><rect x="940" y="450" width="90" height="90" rx="8"/>
<rect x="680" y="580" width="90" height="90" rx="8"/><rect x="810" y="580" width="90" height="90" rx="8"/><rect x="940" y="580" width="90" height="90" rx="8"/>
</g>
<g font-size="24" fill="#33362a" text-anchor="middle">
<text x="725" y="358">LUT</text><text x="725" y="390">+FF</text>
<text x="855" y="358">LUT</text><text x="855" y="390">+FF</text>
<text x="985" y="358">LUT</text><text x="985" y="390">+FF</text>
<text x="725" y="488">LUT</text><text x="725" y="520">+FF</text>
<text x="855" y="488">LUT</text><text x="855" y="520">+FF</text>
<text x="985" y="488">LUT</text><text x="985" y="520">+FF</text>
<text x="725" y="618">LUT</text><text x="725" y="650">+FF</text>
<text x="855" y="618">LUT</text><text x="855" y="650">+FF</text>
<text x="985" y="618">LUT</text><text x="985" y="650">+FF</text>
</g>
<text x="875" y="734" text-anchor="middle" font-size="24" fill="#55584a">config bits also set every routing</text>
<text x="875" y="768" text-anchor="middle" font-size="24" fill="#55584a">switch: load a bitstream and the</text>
<text x="875" y="802" text-anchor="middle" font-size="24" fill="#55584a">chip becomes your circuit</text>

<rect x="150" y="858" width="900" height="76" rx="12" fill="#f4f1e6"/>
<text x="600" y="906" text-anchor="middle" font-size="26" fill="#55584a">price of flexibility: ~35x area, ~14x power vs ASIC</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Gap data: Kuon &amp; Rose, IEEE TCAD 2007</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; asic-1</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">gates made of memory</text>
</svg>
