<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The Flexibility-Efficiency Spectrum</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">4 ways to turn joules into computation</text>

<!-- double arrow -->
<line x1="130" y1="272" x2="1070" y2="272" stroke="#a3a08f" stroke-width="3"/>
<polygon points="104,272 132,262 132,282" fill="#a3a08f"/>
<polygon points="1096,272 1068,262 1068,282" fill="#a3a08f"/>
<text x="120" y="244" font-size="26" fill="#55584a">more flexible</text>
<text x="1080" y="244" text-anchor="end" font-size="26" fill="#55584a">more efficient (perf/watt)</text>

<!-- cards -->
<rect x="90" y="320" width="240" height="390" rx="16" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
<rect x="350" y="320" width="240" height="390" rx="16" fill="#f7ecd2" stroke="#d8d4c4" stroke-width="2"/>
<rect x="610" y="320" width="240" height="390" rx="16" fill="#f0ddd0" stroke="#d8d4c4" stroke-width="2"/>
<rect x="870" y="320" width="240" height="390" rx="16" fill="#e7edd9" stroke="#d8d4c4" stroke-width="2"/>

<!-- CPU -->
<text x="210" y="374" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">CPU</text>
<text x="210" y="418" text-anchor="middle" font-size="24" fill="#55584a">runs any</text>
<text x="210" y="450" text-anchor="middle" font-size="24" fill="#55584a">program via</text>
<text x="210" y="482" text-anchor="middle" font-size="24" fill="#55584a">instructions</text>
<line x1="140" y1="512" x2="280" y2="512" stroke="#d8d4c4" stroke-width="2"/>
<text x="210" y="548" text-anchor="middle" font-size="24" fill="#75786a">change program?</text>
<text x="210" y="582" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">instant</text>
<text x="210" y="636" text-anchor="middle" font-size="24" fill="#75786a">control overhead</text>
<text x="210" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#b04a3a">~70 pJ / instr</text>

<!-- GPU -->
<text x="470" y="374" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">GPU</text>
<text x="470" y="418" text-anchor="middle" font-size="24" fill="#55584a">instructions</text>
<text x="470" y="450" text-anchor="middle" font-size="24" fill="#55584a">amortized over</text>
<text x="470" y="482" text-anchor="middle" font-size="24" fill="#55584a">many lanes</text>
<line x1="400" y1="512" x2="540" y2="512" stroke="#d8d4c4" stroke-width="2"/>
<text x="470" y="548" text-anchor="middle" font-size="24" fill="#75786a">change program?</text>
<text x="470" y="582" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">instant</text>
<text x="470" y="636" text-anchor="middle" font-size="24" fill="#75786a">control overhead</text>
<text x="470" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5a20">decode shared</text>

<!-- FPGA -->
<text x="730" y="374" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">FPGA</text>
<text x="730" y="418" text-anchor="middle" font-size="24" fill="#55584a">becomes the</text>
<text x="730" y="450" text-anchor="middle" font-size="24" fill="#55584a">circuit you</text>
<text x="730" y="482" text-anchor="middle" font-size="24" fill="#55584a">load into it</text>
<line x1="660" y1="512" x2="800" y2="512" stroke="#d8d4c4" stroke-width="2"/>
<text x="730" y="548" text-anchor="middle" font-size="24" fill="#75786a">change program?</text>
<text x="730" y="582" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">in minutes</text>
<text x="730" y="636" text-anchor="middle" font-size="24" fill="#75786a">control overhead</text>
<text x="730" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#b06a4e">fabric tax ~14x</text>

<!-- ASIC -->
<text x="990" y="374" text-anchor="middle" font-size="36" font-weight="bold" fill="#33362a">ASIC</text>
<text x="990" y="418" text-anchor="middle" font-size="24" fill="#55584a">fixed fabric</text>
<text x="990" y="450" text-anchor="middle" font-size="24" fill="#55584a">etched forever</text>
<text x="990" y="482" text-anchor="middle" font-size="24" fill="#55584a">in silicon</text>
<line x1="920" y1="512" x2="1060" y2="512" stroke="#d8d4c4" stroke-width="2"/>
<text x="990" y="548" text-anchor="middle" font-size="24" fill="#75786a">change program?</text>
<text x="990" y="582" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">depends</text>
<text x="990" y="636" text-anchor="middle" font-size="24" fill="#75786a">control overhead</text>
<text x="990" y="670" text-anchor="middle" font-size="26" font-weight="bold" fill="#5b7c46">task-dependent</text>

<!-- energy note -->
<rect x="150" y="760" width="900" height="120" rx="12" fill="#f4f1e6"/>
<text x="600" y="808" text-anchor="middle" font-size="26" fill="#55584a">in 45 nm silicon: an 8-bit add costs 0.03 pJ</text>
<text x="600" y="846" text-anchor="middle" font-size="26" fill="#55584a">the instruction machinery around it: ~70 pJ</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Energy figures: Horowitz, ISSCC 2014</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch &#183; asic-1</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">generality has a price</text>
</svg>
