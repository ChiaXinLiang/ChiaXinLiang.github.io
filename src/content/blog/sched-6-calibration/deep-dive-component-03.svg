<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760"><defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="context-stroke"/></marker><marker id="a2779b8" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#2779b8"/></marker><marker id="a207b67" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#207b67"/></marker><marker id="a7750a3" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#7750a3"/></marker><marker id="ab16e17" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#b16e17"/></marker><marker id="ab34444" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#b34444"/></marker><marker id="a627183" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto-start-reverse"><path d="M0,0 L0,8 L9,4 Z" fill="#627183"/></marker></defs><rect width="1200" height="760" fill="white"/><g font-family="Arial, sans-serif"><text x="40" y="63" fill="#172c46" font-size="35" text-anchor="start" font-weight="bold">ACI feedback direction</text><path d="M40,135 L1160,135" fill="none" stroke="#dce5ee" stroke-width="2"/><rect x="50" y="340" width="330" height="145" rx="8" fill="#eaf3fb" stroke="#b8c5d3" stroke-width="2"/><text x="68" y="378" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Current alpha = 0.1</text><text x="68" y="437" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">Target 0.1 • step 0.02</text><path d="M385,410 L430,410 L430,290 L490,290" fill="none" stroke="#2779b8" stroke-width="3" marker-end="url(#a2779b8)"/><rect x="500" y="220" width="635" height="145" rx="8" fill="#fff4e3" stroke="#b8c5d3" stroke-width="2"/><text x="518" y="258" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Miss: error = 1</text><text x="518" y="317" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">0.1 + 0.02(0.1 − 1) = 0.082</text><path d="M385,410 L430,410 L430,525 L490,525" fill="none" stroke="#2779b8" stroke-width="3" marker-end="url(#a2779b8)"/><rect x="500" y="455" width="635" height="145" rx="8" fill="#e9f5ef" stroke="#b8c5d3" stroke-width="2"/><text x="518" y="493" fill="#172c46" font-size="26" text-anchor="start" font-weight="bold">Cover: error = 0</text><text x="518" y="552" fill="#627183" font-size="22" text-anchor="start" font-weight="normal">0.1 + 0.02(0.1 − 0) = 0.102</text><rect x="35" y="643" width="1130" height="53" rx="8" fill="#f6f8fb" stroke="#dfe6ed" stroke-width="2"/><text x="55" y="677" fill="#172c46" font-size="22" text-anchor="start" font-weight="normal">Misses generally widen later intervals. Long-run frequency is not a per-action safety guarantee.</text><text x="40" y="742" fill="#627183" font-size="17" text-anchor="start" font-weight="normal">Original explanatory diagram • sources in article</text><text x="1160" y="742" fill="#627183" font-size="17" text-anchor="end" font-weight="normal">Illustrative • not a benchmark</text></g></svg>