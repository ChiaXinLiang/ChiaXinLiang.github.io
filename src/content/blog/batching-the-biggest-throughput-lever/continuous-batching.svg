<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Static vs continuous batching</text>
    <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Schedule per iteration, not per request</text>

    <!-- legend -->
    <rect x="240" y="228" width="30" height="30" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <text x="282" y="251" font-size="24" fill="#55584a">decoding</text>
    <rect x="440" y="228" width="30" height="30" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="482" y="251" font-size="24" fill="#55584a">newly admitted</text>
    <rect x="700" y="228" width="30" height="30" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    <text x="742" y="251" font-size="24" fill="#55584a">idle slot</text>
    <text x="1080" y="251" text-anchor="end" font-size="24" fill="#75786a">time &#8594;</text>

    <!-- Static -->
    <text x="90" y="318" font-size="30" font-weight="bold" fill="#33362a">Static batching</text>
    <text x="200" y="380" text-anchor="end" font-size="24" fill="#75786a">Slot 1</text>
    <rect x="220" y="350" width="440" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="680" y="350" width="400" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="444" text-anchor="end" font-size="24" fill="#75786a">Slot 2</text>
    <rect x="220" y="414" width="180" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="400" y="414" width="260" height="46" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    <text x="530" y="446" text-anchor="middle" font-size="24" fill="#a3a08f">idle</text>
    <rect x="680" y="414" width="400" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="508" text-anchor="end" font-size="24" fill="#75786a">Slot 3</text>
    <rect x="220" y="478" width="300" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="520" y="478" width="140" height="46" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    <text x="590" y="510" text-anchor="middle" font-size="24" fill="#a3a08f">idle</text>
    <rect x="680" y="478" width="400" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="572" text-anchor="end" font-size="24" fill="#75786a">Slot 4</text>
    <rect x="220" y="542" width="120" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="340" y="542" width="320" height="46" fill="#f4f1e6" stroke="#d8d4c4" stroke-width="2"/>
    <text x="500" y="574" text-anchor="middle" font-size="24" fill="#a3a08f">idle</text>
    <rect x="680" y="542" width="400" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <line x1="670" y1="340" x2="670" y2="598" stroke="#b04a3a" stroke-width="3" stroke-dasharray="8 6"/>
    <text x="600" y="638" text-anchor="middle" font-size="24" fill="#b04a3a">next batch waits for the slowest request</text>

    <!-- Continuous -->
    <text x="90" y="700" font-size="30" font-weight="bold" fill="#33362a">Continuous batching (Orca)</text>
    <text x="200" y="760" text-anchor="end" font-size="24" fill="#75786a">Slot 1</text>
    <rect x="220" y="730" width="440" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="660" y="730" width="420" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="816" text-anchor="end" font-size="24" fill="#75786a">Slot 2</text>
    <rect x="220" y="786" width="180" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="400" y="786" width="680" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="872" text-anchor="end" font-size="24" fill="#75786a">Slot 3</text>
    <rect x="220" y="842" width="300" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="520" y="842" width="560" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
    <text x="200" y="928" text-anchor="end" font-size="24" fill="#75786a">Slot 4</text>
    <rect x="220" y="898" width="120" height="46" fill="#a8bf92" stroke="#5b7c46" stroke-width="2"/>
    <rect x="340" y="898" width="740" height="46" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>

    <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
    <text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">After Yu et al., Orca (OSDI 2022)</text>
    <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; opt-1</text>
    <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">no slot left idle</text>
  </g>
</svg>
