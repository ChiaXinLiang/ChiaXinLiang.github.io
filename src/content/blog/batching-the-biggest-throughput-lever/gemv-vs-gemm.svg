<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Decode: GEMV vs GEMM</text>
    <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Batching reuses the same weight bytes for every request</text>

    <!-- Left panel: batch 1 -->
    <text x="320" y="290" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">Batch 1: 1 GEMV</text>
    <rect x="170" y="330" width="220" height="300" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <text x="280" y="475" text-anchor="middle" font-size="56" font-weight="bold" fill="#5b7c46">W</text>
    <text x="280" y="530" text-anchor="middle" font-size="24" fill="#55584a">16 GB weights</text>
    <text x="418" y="492" text-anchor="middle" font-size="40" fill="#55584a">&#215;</text>
    <rect x="445" y="330" width="18" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="3"/>
    <text x="454" y="668" text-anchor="middle" font-size="24" fill="#8a5138">1 vector</text>
    <text x="320" y="730" text-anchor="middle" font-size="26" fill="#55584a">Read 16 GB of weights</text>
    <text x="320" y="768" text-anchor="middle" font-size="26" fill="#55584a">&#8594; 1 token per step</text>

    <!-- Right panel: batch 8 -->
    <text x="880" y="290" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">Batch 8: 1 GEMM</text>
    <rect x="680" y="330" width="220" height="300" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <text x="790" y="475" text-anchor="middle" font-size="56" font-weight="bold" fill="#5b7c46">W</text>
    <text x="790" y="530" text-anchor="middle" font-size="24" fill="#55584a">same 16 GB</text>
    <text x="928" y="492" text-anchor="middle" font-size="40" fill="#55584a">&#215;</text>
    <rect x="955" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="973" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="991" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="1009" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="1027" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="1045" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="1063" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <rect x="1081" y="330" width="14" height="300" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
    <text x="1025" y="668" text-anchor="middle" font-size="24" fill="#8a5138">8 vectors</text>
    <text x="880" y="730" text-anchor="middle" font-size="26" fill="#55584a">Read the same 16 GB</text>
    <text x="880" y="768" text-anchor="middle" font-size="26" fill="#55584a">&#8594; 8 tokens per step</text>

    <!-- Bottom strip -->
    <line x1="150" y1="820" x2="1050" y2="820" stroke="#e8e4d7" stroke-width="3"/>
    <text x="600" y="880" text-anchor="middle" font-size="27" fill="#33362a">Arithmetic intensity: ~1 FLOP/byte &#8594; ~8 FLOPs/byte</text>
    <text x="600" y="925" text-anchor="middle" font-size="24" fill="#75786a">An H100 needs ~295 FLOPs/byte to be compute-bound,</text>
    <text x="600" y="958" text-anchor="middle" font-size="24" fill="#75786a">so early batching is almost free throughput</text>

    <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
    <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; opt-1</text>
    <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">same bytes, more tokens</text>
  </g>
</svg>
