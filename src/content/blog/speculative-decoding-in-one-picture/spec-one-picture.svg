<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Speculative Decoding in 1 Picture</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Draft cheap tokens; verify them all in 1 target pass</text>

<!-- STEP 1 -->
<text x="90" y="270" font-size="28" font-weight="bold" fill="#5b7c46">STEP 1 · Draft model proposes 4 tokens (~2 ms each)</text>
<rect x="150" y="300" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="225" y="350" text-anchor="middle" font-size="30" fill="#33362a">the</text>
<rect x="400" y="300" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="475" y="350" text-anchor="middle" font-size="30" fill="#33362a">cat</text>
<rect x="650" y="300" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="725" y="350" text-anchor="middle" font-size="30" fill="#33362a">sat</text>
<rect x="900" y="300" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="975" y="350" text-anchor="middle" font-size="30" fill="#33362a">in</text>
<line x1="302" y1="340" x2="384" y2="340" stroke="#a3a08f" stroke-width="3"/>
<polygon points="384,332 400,340 384,348" fill="#a3a08f"/>
<line x1="552" y1="340" x2="634" y2="340" stroke="#a3a08f" stroke-width="3"/>
<polygon points="634,332 650,340 634,348" fill="#a3a08f"/>
<line x1="802" y1="340" x2="884" y2="340" stroke="#a3a08f" stroke-width="3"/>
<polygon points="884,332 900,340 884,348" fill="#a3a08f"/>

<!-- arrows down into verify -->
<line x1="225" y1="386" x2="225" y2="452" stroke="#a3a08f" stroke-width="3"/>
<polygon points="217,452 225,468 233,452" fill="#a3a08f"/>
<line x1="475" y1="386" x2="475" y2="452" stroke="#a3a08f" stroke-width="3"/>
<polygon points="467,452 475,468 483,452" fill="#a3a08f"/>
<line x1="725" y1="386" x2="725" y2="452" stroke="#a3a08f" stroke-width="3"/>
<polygon points="717,452 725,468 733,452" fill="#a3a08f"/>
<line x1="975" y1="386" x2="975" y2="452" stroke="#a3a08f" stroke-width="3"/>
<polygon points="967,452 975,468 983,452" fill="#a3a08f"/>

<!-- STEP 2 verify box -->
<rect x="150" y="470" width="900" height="120" rx="12" fill="#f7ecd2" stroke="#c9973b" stroke-width="3"/>
<text x="600" y="521" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">STEP 2 · Target verifies all positions in 1 pass</text>
<text x="600" y="560" text-anchor="middle" font-size="24" fill="#75786a">same full weight read as generating a single token (~30 ms)</text>

<!-- STEP 3 -->
<text x="90" y="660" font-size="28" font-weight="bold" fill="#5b7c46">STEP 3 · Keep the agreed prefix, fix the first miss</text>
<rect x="135" y="690" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="210" y="740" text-anchor="middle" font-size="30" fill="#33362a">the</text>
<rect x="330" y="690" width="150" height="80" rx="10" fill="#e7edd9" stroke="#5b7c46" stroke-width="2"/>
<text x="405" y="740" text-anchor="middle" font-size="30" fill="#33362a">cat</text>
<rect x="525" y="690" width="150" height="80" rx="10" fill="#f4f1e6" stroke="#b04a3a" stroke-width="2"/>
<text x="600" y="740" text-anchor="middle" font-size="30" fill="#75786a">sat</text>
<line x1="533" y1="762" x2="667" y2="698" stroke="#b04a3a" stroke-width="3"/>
<rect x="720" y="690" width="150" height="80" rx="10" fill="#f4f1e6" stroke="#b04a3a" stroke-width="2"/>
<text x="795" y="740" text-anchor="middle" font-size="30" fill="#75786a">in</text>
<line x1="728" y1="762" x2="862" y2="698" stroke="#b04a3a" stroke-width="3"/>
<rect x="915" y="690" width="150" height="80" rx="10" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
<text x="990" y="740" text-anchor="middle" font-size="30" fill="#33362a">ran</text>
<text x="210" y="806" text-anchor="middle" font-size="24" fill="#5b7c46">kept</text>
<text x="405" y="806" text-anchor="middle" font-size="24" fill="#5b7c46">kept</text>
<text x="600" y="806" text-anchor="middle" font-size="24" fill="#b04a3a">rejected</text>
<text x="795" y="806" text-anchor="middle" font-size="24" fill="#b04a3a">discarded</text>
<text x="990" y="806" text-anchor="middle" font-size="24" fill="#8a5138">from target</text>

<text x="600" y="885" text-anchor="middle" font-size="30" font-weight="bold" fill="#33362a">3 tokens emitted for 1 30 ms target step</text>
<text x="600" y="925" text-anchor="middle" font-size="24" fill="#75786a">and the output distribution is exactly the target model's</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · opt-4</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">Guess cheap, verify once</text>
</svg>
