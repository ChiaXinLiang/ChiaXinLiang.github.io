<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">1 Block, 2 Ceilings</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Quantizing the same block, largest weight (absmax) = 0.90</text>

  <!-- vertical gridlines: v -> x = 120 + 900v -->
  <g stroke="#e8e4d7" stroke-width="2">
    <line x1="120" y1="270" x2="120" y2="760"/>
    <line x1="345" y1="270" x2="345" y2="760"/>
    <line x1="570" y1="270" x2="570" y2="760"/>
    <line x1="795" y1="270" x2="795" y2="760"/>
    <line x1="1020" y1="270" x2="1020" y2="760"/>
  </g>
  <line x1="930" y1="270" x2="930" y2="760" stroke="#d8d4c4" stroke-width="2.5" stroke-dasharray="8 7"/>
  <text x="930" y="252" text-anchor="middle" font-size="24" fill="#75786a">absmax 0.90</text>

  <!-- NVFP4 row -->
  <text x="120" y="312" font-size="30" font-weight="bold" fill="#5b7c46">NVFP4</text>
  <text x="240" y="311" font-size="26" fill="#55584a">scale 0.15625 (E4M3, from 0.90 / 6)</text>
  <rect x="120" y="330" width="844" height="60" fill="#e7edd9" stroke="#5b7c46" stroke-width="1.5"/>
  <line x1="964" y1="320" x2="964" y2="400" stroke="#5b7c46" stroke-width="4"/>
  <text x="964" y="425" text-anchor="middle" font-size="24" fill="#5b7c46">ceiling 0.9375</text>
  <circle cx="930" cy="360" r="9" fill="#33362a"/>
  <text x="120" y="466" font-size="26" fill="#55584a">0.90 fits &#8212; rounds up to 0.9375 (+4% error)</text>

  <!-- MXFP4 row -->
  <text x="120" y="552" font-size="30" font-weight="bold" fill="#8a5138">MXFP4</text>
  <text x="248" y="551" font-size="26" fill="#55584a">scale 0.125 (nearest power of 2: 2&#8315;&#179;)</text>
  <rect x="120" y="570" width="675" height="60" fill="#f0ddd0" stroke="#b06a4e" stroke-width="1.5"/>
  <line x1="795" y1="560" x2="795" y2="640" stroke="#b06a4e" stroke-width="4"/>
  <text x="795" y="665" text-anchor="middle" font-size="24" fill="#8a5138">ceiling 0.75</text>
  <circle cx="930" cy="600" r="9" fill="#b04a3a"/>
  <line x1="916" y1="600" x2="830" y2="600" stroke="#b04a3a" stroke-width="3.5"/>
  <polygon points="812,600 834,590 834,610" fill="#b04a3a"/>
  <text x="120" y="706" font-size="26" fill="#b04a3a">0.90 does not fit &#8212; clipped to 0.75 (&#8722;17% error)</text>

  <!-- axis labels -->
  <line x1="120" y1="760" x2="1020" y2="760" stroke="#55584a" stroke-width="2.5"/>
  <text x="120" y="802" text-anchor="middle" font-size="24" fill="#75786a">0</text>
  <text x="345" y="802" text-anchor="middle" font-size="24" fill="#75786a">0.25</text>
  <text x="570" y="802" text-anchor="middle" font-size="24" fill="#75786a">0.50</text>
  <text x="795" y="802" text-anchor="middle" font-size="24" fill="#75786a">0.75</text>
  <text x="1020" y="802" text-anchor="middle" font-size="24" fill="#75786a">1.00</text>

  <text x="600" y="888" text-anchor="middle" font-size="28" font-weight="bold" fill="#33362a">RMS error on this block: 0.047 vs 0.064</text>
  <text x="600" y="932" text-anchor="middle" font-size="26" fill="#55584a">A power-of-2 scale can only double or halve</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; fmt-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">outliers pick the winner</text>
</svg>
