<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Anatomy of a 4-Bit Block</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Same 4-bit elements &#8212; different scaling machinery</text>

  <!-- NVFP4 -->
  <text x="90" y="272" font-size="32" font-weight="bold" fill="#5b7c46">NVFP4 &#8212; blocks of 16, two-level scaling</text>

  <g fill="#e7edd9" stroke="#5b7c46" stroke-width="1.5">
    <rect x="90" y="300" width="42" height="70"/><rect x="135" y="300" width="42" height="70"/>
    <rect x="180" y="300" width="42" height="70"/><rect x="225" y="300" width="42" height="70"/>
    <rect x="270" y="300" width="42" height="70"/><rect x="315" y="300" width="42" height="70"/>
    <rect x="360" y="300" width="42" height="70"/><rect x="405" y="300" width="42" height="70"/>
    <rect x="450" y="300" width="42" height="70"/><rect x="495" y="300" width="42" height="70"/>
    <rect x="540" y="300" width="42" height="70"/><rect x="585" y="300" width="42" height="70"/>
    <rect x="630" y="300" width="42" height="70"/><rect x="675" y="300" width="42" height="70"/>
    <rect x="720" y="300" width="42" height="70"/><rect x="765" y="300" width="42" height="70"/>
  </g>
  <rect x="830" y="300" width="120" height="70" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
  <text x="890" y="345" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5a20">E4M3</text>

  <text x="448" y="410" text-anchor="middle" font-size="26" fill="#55584a">16 &#215; FP4 (E2M1) = 64 bits</text>
  <text x="890" y="410" text-anchor="middle" font-size="24" fill="#55584a">8-bit scale</text>

  <rect x="90" y="450" width="860" height="56" rx="8" fill="#f0ddd0" stroke="#b06a4e" stroke-width="1.5"/>
  <text x="520" y="487" text-anchor="middle" font-size="26" fill="#8a5138">Level 2: one FP32 scale for the entire tensor</text>

  <text x="90" y="575" font-size="28" font-weight="bold" fill="#33362a">72 bits / 16 values = 4.5 bits per value</text>

  <!-- MXFP4 -->
  <text x="90" y="662" font-size="32" font-weight="bold" fill="#8a5138">MXFP4 &#8212; blocks of 32, one power-of-two scale</text>

  <g fill="#f4f1e6" stroke="#b06a4e" stroke-width="1.2">
    <rect x="90" y="690" width="24" height="70"/><rect x="116" y="690" width="24" height="70"/>
    <rect x="142" y="690" width="24" height="70"/><rect x="168" y="690" width="24" height="70"/>
    <rect x="194" y="690" width="24" height="70"/><rect x="220" y="690" width="24" height="70"/>
    <rect x="246" y="690" width="24" height="70"/><rect x="272" y="690" width="24" height="70"/>
    <rect x="298" y="690" width="24" height="70"/><rect x="324" y="690" width="24" height="70"/>
    <rect x="350" y="690" width="24" height="70"/><rect x="376" y="690" width="24" height="70"/>
    <rect x="402" y="690" width="24" height="70"/><rect x="428" y="690" width="24" height="70"/>
    <rect x="454" y="690" width="24" height="70"/><rect x="480" y="690" width="24" height="70"/>
    <rect x="506" y="690" width="24" height="70"/><rect x="532" y="690" width="24" height="70"/>
    <rect x="558" y="690" width="24" height="70"/><rect x="584" y="690" width="24" height="70"/>
    <rect x="610" y="690" width="24" height="70"/><rect x="636" y="690" width="24" height="70"/>
    <rect x="662" y="690" width="24" height="70"/><rect x="688" y="690" width="24" height="70"/>
    <rect x="714" y="690" width="24" height="70"/><rect x="740" y="690" width="24" height="70"/>
    <rect x="766" y="690" width="24" height="70"/><rect x="792" y="690" width="24" height="70"/>
    <rect x="818" y="690" width="24" height="70"/><rect x="844" y="690" width="24" height="70"/>
    <rect x="870" y="690" width="24" height="70"/><rect x="896" y="690" width="24" height="70"/>
  </g>
  <rect x="940" y="690" width="120" height="70" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2"/>
  <text x="1000" y="735" text-anchor="middle" font-size="26" font-weight="bold" fill="#8a5138">E8M0</text>

  <text x="505" y="800" text-anchor="middle" font-size="26" fill="#55584a">32 &#215; FP4 (E2M1) = 128 bits</text>
  <text x="1000" y="800" text-anchor="middle" font-size="24" fill="#55584a">8-bit scale</text>

  <text x="90" y="870" font-size="28" font-weight="bold" fill="#33362a">136 bits / 32 values = 4.25 bits per value</text>

  <text x="600" y="940" text-anchor="middle" font-size="26" fill="#55584a">NVFP4 pays ~6% more bits for finer, truer scales</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; fmt-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">the scale is the story</text>
</svg>
