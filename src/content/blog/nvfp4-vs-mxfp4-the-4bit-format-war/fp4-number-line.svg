<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">The Entire FP4 Number System</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Every positive value E2M1 can represent (a sign bit doubles it)</text>

  <text x="600" y="300" text-anchor="middle" font-size="28" fill="#55584a">16 codes = 1 sign bit &#215; 8 magnitudes</text>

  <!-- number line -->
  <line x1="130" y1="560" x2="1070" y2="560" stroke="#55584a" stroke-width="3"/>
  <polygon points="1070,560 1050,552 1050,568" fill="#55584a"/>

  <!-- dots: v -> x = 150 + 150v -->
  <circle cx="150" cy="560" r="10" fill="#75786a"/>
  <circle cx="225" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="300" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="375" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="450" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="600" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="750" cy="560" r="10" fill="#5b7c46"/>
  <circle cx="1050" cy="560" r="10" fill="#5b7c46"/>

  <!-- labels, alternating -->
  <text x="150" y="615" text-anchor="middle" font-size="28" fill="#33362a">0</text>
  <text x="225" y="522" text-anchor="middle" font-size="28" fill="#33362a">0.5</text>
  <text x="300" y="615" text-anchor="middle" font-size="28" fill="#33362a">1</text>
  <text x="375" y="522" text-anchor="middle" font-size="28" fill="#33362a">1.5</text>
  <text x="450" y="615" text-anchor="middle" font-size="28" fill="#33362a">2</text>
  <text x="600" y="615" text-anchor="middle" font-size="28" fill="#33362a">3</text>
  <text x="750" y="615" text-anchor="middle" font-size="28" fill="#33362a">4</text>
  <text x="1050" y="615" text-anchor="middle" font-size="28" fill="#33362a">6</text>

  <!-- step brackets -->
  <line x1="150" y1="690" x2="450" y2="690" stroke="#5b7c46" stroke-width="3"/>
  <line x1="150" y1="690" x2="150" y2="678" stroke="#5b7c46" stroke-width="3"/>
  <line x1="450" y1="690" x2="450" y2="678" stroke="#5b7c46" stroke-width="3"/>
  <text x="300" y="738" text-anchor="middle" font-size="26" fill="#5b7c46">step 0.5</text>

  <line x1="462" y1="690" x2="750" y2="690" stroke="#c9973b" stroke-width="3"/>
  <line x1="462" y1="690" x2="462" y2="678" stroke="#c9973b" stroke-width="3"/>
  <line x1="750" y1="690" x2="750" y2="678" stroke="#c9973b" stroke-width="3"/>
  <text x="606" y="738" text-anchor="middle" font-size="26" fill="#7a5a20">step 1.0</text>

  <line x1="762" y1="690" x2="1050" y2="690" stroke="#b06a4e" stroke-width="3"/>
  <line x1="762" y1="690" x2="762" y2="678" stroke="#b06a4e" stroke-width="3"/>
  <line x1="1050" y1="690" x2="1050" y2="678" stroke="#b06a4e" stroke-width="3"/>
  <text x="906" y="738" text-anchor="middle" font-size="26" fill="#8a5138">step 2.0</text>

  <text x="600" y="860" text-anchor="middle" font-size="28" fill="#55584a">Dense near zero, sparse near the top &#8212;</text>
  <text x="600" y="902" text-anchor="middle" font-size="28" fill="#55584a">and nothing exists above 6</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; fmt-1</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">sixteen values, that's all</text>
</svg>
