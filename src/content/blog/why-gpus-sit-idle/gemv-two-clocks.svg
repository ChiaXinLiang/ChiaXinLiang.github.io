<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-size="52" font-weight="bold" fill="#33362a">1 GEMV, 2 Clocks</text>
  <text x="90" y="156" font-size="30" fill="#75786a">4096 × 4096 BF16 projection, 1 decode token, H100 SXM</text>

  <!-- stat boxes -->
  <rect x="90" y="240" width="310" height="110" rx="10" fill="#e7edd9"/>
  <text x="245" y="284" font-size="24" fill="#75786a" text-anchor="middle">bytes moved</text>
  <text x="245" y="326" font-size="34" font-weight="bold" fill="#33362a" text-anchor="middle">33.5 MB</text>

  <rect x="430" y="240" width="310" height="110" rx="10" fill="#f0ddd0"/>
  <text x="585" y="284" font-size="24" fill="#75786a" text-anchor="middle">math performed</text>
  <text x="585" y="326" font-size="34" font-weight="bold" fill="#33362a" text-anchor="middle">33.5 MFLOP</text>

  <rect x="770" y="240" width="310" height="110" rx="10" fill="#f7ecd2"/>
  <text x="925" y="284" font-size="24" fill="#75786a" text-anchor="middle">arithmetic intensity</text>
  <text x="925" y="326" font-size="34" font-weight="bold" fill="#33362a" text-anchor="middle">~1 FLOP/byte</text>

  <!-- memory bar -->
  <text x="90" y="452" font-size="26" fill="#55584a">Streaming weights from HBM at 3.35 TB/s</text>
  <text x="1050" y="452" font-size="30" font-weight="bold" fill="#33362a" text-anchor="end">10.0 µs</text>
  <rect x="90" y="470" width="960" height="70" rx="8" fill="#b06a4e"/>

  <!-- compute bar -->
  <text x="90" y="612" font-size="26" fill="#55584a">Tensor-core math at 989 TFLOPS</text>
  <text x="1050" y="612" font-size="30" font-weight="bold" fill="#33362a" text-anchor="end">0.034 µs</text>
  <rect x="90" y="630" width="5" height="70" fill="#b04a3a"/>
  <text x="115" y="674" font-size="24" fill="#75786a">≈ 3 px at this scale: compute finishes 295× early</text>

  <!-- callout -->
  <rect x="90" y="750" width="1020" height="170" rx="10" fill="#e7edd9"/>
  <text x="130" y="806" font-size="30" font-weight="bold" fill="#33362a">Ideal bandwidth time ≈ 295× compute time</text>
  <text x="130" y="852" font-size="26" fill="#55584a">Whole 7B model: 13.5 GB / 3.35 TB/s ≈ 4.0 ms per token</text>
  <text x="130" y="892" font-size="26" fill="#55584a">→ ~250 tokens/s ceiling per stream, set by bandwidth alone</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance · exec-1</text>
  <text x="1120" y="1140" font-size="28" fill="#a3a08f" text-anchor="end">Bytes set the clock</text>
</g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">t ≥ max(F/C, D/β);  intensity I = F/D</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">33.6 MFLOP / 33.6 MB ≈ 1 FLOP/byte</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">Bandwidth limits the ideal roof; not literal idle-cycle share</text></svg>
