<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#55584a"/>
    </marker>
  </defs>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="700" fill="#33362a">Why decode speed is a division</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">every token = streaming the active weights through memory</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- weights block -->
    <rect x="120" y="330" width="300" height="220" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
    <text x="270" y="420" text-anchor="middle" font-size="40" font-weight="700" fill="#33362a">~70 GB</text>
    <text x="270" y="470" text-anchor="middle" font-size="27" fill="#55584a">weights read</text>
    <text x="270" y="505" text-anchor="middle" font-size="27" fill="#55584a">1 stream, 70B @ 8-bit</text>

    <!-- pipe -->
    <line x1="420" y1="440" x2="540" y2="440" stroke="#55584a" stroke-width="5" marker-end="url(#ar)"/>
    <rect x="545" y="380" width="300" height="120" rx="60" fill="#b06a4e"/>
    <text x="695" y="435" text-anchor="middle" font-size="36" font-weight="700" fill="#fdfbf4">8 TB/s</text>
    <text x="695" y="475" text-anchor="middle" font-size="24" fill="#f0ddd0">HBM bandwidth</text>
    <line x1="845" y1="440" x2="965" y2="440" stroke="#55584a" stroke-width="5" marker-end="url(#ar)"/>

    <!-- result -->
    <rect x="970" y="360" width="180" height="160" rx="16" fill="#f7ecd2" stroke="#c9973b" stroke-width="5"/>
    <text x="1060" y="430" text-anchor="middle" font-size="40" font-weight="700" fill="#c9973b">≤114</text>
    <text x="1060" y="475" text-anchor="middle" font-size="24" fill="#7a5a20">tokens/s</text>

    <!-- equation -->
    <text x="600" y="670" text-anchor="middle" font-size="44" font-weight="700" fill="#33362a">8 TB/s ÷ 70 GB ≈ 114 tokens/s</text>
    <text x="600" y="720" text-anchor="middle" font-size="28" fill="#75786a">the single-stream ceiling — before batching or any cleverness</text>

    <!-- implications -->
    <rect x="170" y="790" width="860" height="180" rx="14" fill="#f4f1e6"/>
    <text x="600" y="850" text-anchor="middle" font-size="28" fill="#33362a">meanwhile the compute units finish their math early and wait</text>
    <text x="600" y="900" text-anchor="middle" font-size="28" font-weight="700" fill="#5b7c46">Higher bandwidth raises an idealized token ceiling.</text>
  </g>

  <line x1="80" y1="1090" x2="1120" y2="1090" stroke="#e8e4d7" stroke-width="3"/>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">Efficient AI · chip-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">time ≥ bytes / bandwidth</text>
</svg>
