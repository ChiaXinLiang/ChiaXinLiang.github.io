<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="50" font-weight="700" fill="#33362a">1 generation, 2 very different jumps</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">Blackwell Ultra → Rubin: official peak specifications</text>

  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- left panel: capacity -->
    <text x="330" y="260" text-anchor="middle" font-size="34" font-weight="700" fill="#33362a">Memory capacity</text>
    <line x1="130" y1="880" x2="530" y2="880" stroke="#d8d4c4" stroke-width="4"/>
    <rect x="170" y="440" width="140" height="440" rx="8" fill="#a3a08f"/>
    <rect x="350" y="440" width="140" height="440" rx="8" fill="#a3a08f"/>
    <text x="240" y="410" text-anchor="middle" font-size="36" font-weight="700" fill="#75786a">288 GB</text>
    <text x="420" y="410" text-anchor="middle" font-size="36" font-weight="700" fill="#75786a">288 GB</text>
    <text x="240" y="925" text-anchor="middle" font-size="26" fill="#33362a">GB300</text>
    <text x="420" y="925" text-anchor="middle" font-size="26" fill="#33362a">R200</text>
    <text x="330" y="990" text-anchor="middle" font-size="32" font-weight="700" fill="#75786a">≈ flat</text>

    <!-- right panel: bandwidth -->
    <text x="870" y="260" text-anchor="middle" font-size="34" font-weight="700" fill="#33362a">Memory bandwidth</text>
    <line x1="670" y1="880" x2="1070" y2="880" stroke="#d8d4c4" stroke-width="4"/>
    <!-- 8 TB/s → h = 8/22*560 = 204 ; 22 → 560 -->
    <rect x="710" y="676" width="140" height="204" rx="8" fill="#a8bf92"/>
    <rect x="890" y="320" width="140" height="560" rx="8" fill="#5b7c46"/>
    <text x="780" y="646" text-anchor="middle" font-size="36" font-weight="700" fill="#5b7c46">8 TB/s</text>
    <text x="960" y="290" text-anchor="middle" font-size="36" font-weight="700" fill="#5b7c46">22 TB/s</text>
    <text x="780" y="925" text-anchor="middle" font-size="26" fill="#33362a">GB300</text>
    <text x="960" y="925" text-anchor="middle" font-size="26" fill="#33362a">R200</text>
    <text x="870" y="990" text-anchor="middle" font-size="32" font-weight="700" fill="#c9973b">×2.75</text>
  </g>

  <text x="600" y="1045" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="27" fill="#55584a">Capacity sets the state budget; bandwidth sets a traffic ceiling</text>
  <line x1="80" y1="1090" x2="1120" y2="1090" stroke="#e8e4d7" stroke-width="3"/>
  <text x="80" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">Efficient AI · chip-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">Vendor peak specifications</text>
</svg>
