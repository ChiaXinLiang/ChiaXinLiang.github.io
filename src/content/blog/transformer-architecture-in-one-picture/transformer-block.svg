<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55584a"/></marker></defs>
  <text x="600" y="100" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="700" fill="#33362a">The Transformer block</text>
  <text x="600" y="156" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">confer → digest, stacked N times (GPT-3: N = 96)</text>

  <g font-family="Helvetica Neue, Arial, sans-serif" text-anchor="middle">
    <!-- bottom: input -->
    <rect x="380" y="920" width="440" height="80" rx="14" fill="#f4f1e6" stroke="#a3a08f" stroke-width="4"/>
    <text x="600" y="970" font-size="27" fill="#33362a">tokens as vectors (+ position stamped in)</text>
    <line x1="600" y1="912" x2="600" y2="866" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>

    <!-- big block frame -->
    <rect x="280" y="300" width="640" height="550" rx="22" fill="none" stroke="#c9973b" stroke-width="6" stroke-dasharray="20 12"/>
    <text x="965" y="580" font-size="30" font-weight="700" fill="#c9973b" transform="rotate(90 965 580)">× N blocks</text>

    <!-- attention -->
    <rect x="340" y="680" width="520" height="130" rx="16" fill="#e7edd9" stroke="#5b7c46" stroke-width="5"/>
    <text x="600" y="738" font-size="32" font-weight="700" fill="#3f5a2f">ATTENTION</text>
    <text x="600" y="780" font-size="25" fill="#55584a">tokens talk to each other (gather context)</text>

    <!-- residual around attention -->
    <path d="M 320 895 C 240 850, 240 700, 330 660" fill="none" stroke="#b06a4e" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#a)"/>
    <text x="215" y="790" font-size="23" fill="#b06a4e" transform="rotate(-90 215 790)">+ residual</text>

    <line x1="600" y1="672" x2="600" y2="626" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>
    <text x="700" y="655" font-size="22" fill="#a3a08f">add + normalize</text>

    <!-- feed-forward -->
    <rect x="340" y="470" width="520" height="130" rx="16" fill="#f0ddd0" stroke="#b06a4e" stroke-width="5"/>
    <text x="600" y="528" font-size="32" font-weight="700" fill="#8a5138">FEED-FORWARD</text>
    <text x="600" y="570" font-size="25" fill="#55584a">each token thinks alone (~2/3 of the weights)</text>

    <path d="M 320 665 C 240 630, 240 500, 330 455" fill="none" stroke="#b06a4e" stroke-width="5" stroke-dasharray="12 9" marker-end="url(#a)"/>

    <line x1="600" y1="462" x2="600" y2="416" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>
    <text x="700" y="445" font-size="22" fill="#a3a08f">add + normalize</text>

    <!-- block output -->
    <rect x="440" y="336" width="320" height="70" rx="14" fill="#e7edd9" stroke="#5b7c46" stroke-width="3"/>
    <text x="600" y="381" font-size="25" fill="#33362a">richer vectors → next block</text>

    <!-- top: prediction -->
    <line x1="600" y1="292" x2="600" y2="252" stroke="#55584a" stroke-width="5" marker-end="url(#a)"/>
    <rect x="420" y="180" width="360" height="66" rx="14" fill="#5b7c46"/>
    <text x="600" y="224" font-size="26" font-weight="700" fill="#fdfbf4">score for every possible next word</text>
  </g>

  <line x1="80" y1="1050" x2="1120" y2="1050" stroke="#e8e4d7" stroke-width="3"/>
  <text x="600" y="1094" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Redrawn simplified from Vaswani et al. (2017), "Attention Is All You Need", Fig. 1 (decoder-only view)</text>
  <text x="80" y="1150" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="600" fill="#a3a08f">LLM Basics · tf-2</text>
  <text x="1120" y="1150" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">confer · digest · repeat</text>
</svg>
