<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#5d7e45"/></marker></defs><rect width="1200" height="1200" fill="#fbf9f1"/><g font-family="Arial,sans-serif" fill="#34372b"><text x="60" y="82" font-size="50" fill="#34372b" text-anchor="start">Equations inside a decoder block</text><text x="60" y="140" font-size="28" fill="#787d6c" text-anchor="start">Illustrative dense pre-norm block; every residual has shape T × d</text><text x="640" y="205" font-size="35" fill="#34372b" text-anchor="middle">X</text><path d="M650 215 V240" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="380" y="255" width="600" height="105" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="402" y="295" font-size="30" fill="#5d7e45" text-anchor="start">Normalize</text><text x="402" y="335" font-size="27" fill="#34372b" text-anchor="start">Z = N₁(X)</text><path d="M650 365 V395" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="380" y="410" width="600" height="135" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="402" y="450" font-size="30" fill="#5d7e45" text-anchor="start">Causal attention</text><text x="402" y="490" font-size="27" fill="#34372b" text-anchor="start">Q = ZW<tspan baseline-shift="sub" font-size="19.439999999999998">Q</tspan>; K = ZW<tspan baseline-shift="sub" font-size="19.439999999999998">K</tspan>; V = ZW<tspan baseline-shift="sub" font-size="19.439999999999998">V</tspan></text><text x="402" y="524" font-size="27" fill="#34372b" text-anchor="start">Attention heads → concatenate → W<tspan baseline-shift="sub" font-size="19.439999999999998">O</tspan></text><path d="M650 550 V590" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="650" cy="620" r="30" fill="#f3e4d8" stroke="#b77553" stroke-width="3"/><text x="650" y="632" font-size="35" fill="#34372b" text-anchor="middle">+</text><path d="M650 225 H180 V620 H610" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="100" y="450" font-size="34" fill="#34372b" text-anchor="start">X</text><text x="705" y="633" font-size="29" fill="#34372b" text-anchor="start">U = X + A(N₁(X))</text><path d="M650 655 V685" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="380" y="700" width="600" height="105" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="402" y="740" font-size="30" fill="#5d7e45" text-anchor="start">Normalize</text><text x="402" y="780" font-size="27" fill="#34372b" text-anchor="start">R = N₂(U)</text><path d="M650 810 V840" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="380" y="855" width="600" height="105" rx="15" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="402" y="895" font-size="30" fill="#5d7e45" text-anchor="start">Position-wise feed-forward</text><text x="402" y="935" font-size="27" fill="#34372b" text-anchor="start">F(R): return to residual width d</text><path d="M650 965 V995" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><circle cx="650" cy="1025" r="30" fill="#f3e4d8" stroke="#b77553" stroke-width="3"/><text x="650" y="1037" font-size="35" fill="#34372b" text-anchor="middle">+</text><path d="M650 665 H180 V1025 H610" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="100" y="870" font-size="34" fill="#34372b" text-anchor="start">U</text><text x="705" y="1038" font-size="29" fill="#34372b" text-anchor="start">Y = U + F(N₂(U))</text><path d="M650 1060 V1100" stroke="#5d7e45" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="650" y="1133" font-size="30" fill="#34372b" text-anchor="middle">Y: T × d</text><text x="60" y="1180" font-size="22" fill="#787d6c" text-anchor="start">Adapted from Transformer residual structure; modern pre-norm illustrated</text></g></svg>