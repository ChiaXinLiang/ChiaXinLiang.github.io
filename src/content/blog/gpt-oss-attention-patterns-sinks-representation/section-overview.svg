<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>gpt-oss 2: Attention Patterns, Sinks, and Numerical Representation</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">gpt-oss 2</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Apply the causal mask</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">All layers exclude future tokens</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Every other reference layer also uses a</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">128-position window</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Share key-value heads</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">64 query heads use 8 KV heads in the cited</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">defaults</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Head grouping changes cached representation</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">size</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Add a learnable sink score</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">An extra logit joins softmax normalization</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Its probability has no corresponding value</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">contribution</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Keep precision categories</text>
<text x="112" y="536" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">separate</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">MXFP4 expert weights differ from cache</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">storage</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Reference BF16 decoding is not optimized</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">packed execution</text>
