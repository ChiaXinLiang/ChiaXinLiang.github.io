<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="110" font-size="43" font-weight="bold">Trace the unsigned array sum</text><text x="90" y="168" font-size="27" fill="#55584a">Elements: 3, 5, 7 / pointer step: 4 bytes</text><rect x="90" y="230" width="1020" height="195" rx="20" fill="#e7edd9"/><text x="130" y="308" font-size="43" font-weight="bold">AFTER ELEMENT 1</text><text x="130" y="365" font-size="29">Sum 3 / remaining count 2</text><rect x="90" y="465" width="1020" height="195" rx="20" fill="#f0ddd0"/><text x="130" y="543" font-size="43" font-weight="bold">AFTER ELEMENT 2</text><text x="130" y="600" font-size="29">Sum 8 / remaining count 1</text><rect x="90" y="700" width="1020" height="195" rx="20" fill="#f7ecd2"/><text x="130" y="778" font-size="43" font-weight="bold">AFTER ELEMENT 3</text><text x="130" y="835" font-size="29">Sum 15 / remaining count 0</text><text x="90" y="1010" font-size="24" fill="#75786a">Original teaching diagram; sources in article.</text><line x1="90" y1="1080" x2="1110" y2="1080" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1132" font-size="28" fill="#5b7c46">Comp Arch · isa-2</text></g></svg>