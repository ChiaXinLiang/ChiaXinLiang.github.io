<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fbf9f1"/><g font-family="Arial,sans-serif" fill="#34372b"><text x="70" y="105" font-size="48" fill="#34372b" text-anchor="start">Read the evidence, then derive the claim</text><text x="70" y="160" font-size="30" fill="#74796b" text-anchor="start">A workflow for model architecture analysis</text><rect x="90" y="220" width="1020" height="135" rx="18" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="115" y="268" font-size="30" fill="#34372b" text-anchor="start">1. Configuration</text><text x="115" y="310" font-size="30" fill="#34372b" text-anchor="start">Counts, widths, layer types</text><path d="M600 365 v30 l-10 -12 m10 12 l10 -12" stroke="#5d7e45" stroke-width="4" fill="none"/><rect x="90" y="410" width="1020" height="135" rx="18" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="115" y="458" font-size="30" fill="#34372b" text-anchor="start">2. Implementation</text><text x="115" y="500" font-size="30" fill="#34372b" text-anchor="start">Shapes, masks, state updates</text><path d="M600 555 v30 l-10 -12 m10 12 l10 -12" stroke="#5d7e45" stroke-width="4" fill="none"/><rect x="90" y="600" width="1020" height="135" rx="18" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="115" y="648" font-size="30" fill="#34372b" text-anchor="start">3. Checked equation</text><text x="115" y="690" font-size="30" fill="#34372b" text-anchor="start">Parameters, cache, selected work</text><path d="M600 745 v30 l-10 -12 m10 12 l10 -12" stroke="#5d7e45" stroke-width="4" fill="none"/><rect x="90" y="790" width="1020" height="135" rx="18" fill="#e7eedb" stroke="#5d7e45" stroke-width="3"/><text x="115" y="838" font-size="30" fill="#34372b" text-anchor="start">4. Testable conclusion</text><text x="115" y="880" font-size="30" fill="#34372b" text-anchor="start">Predicted benefit and limitations</text><text x="70" y="1030" font-size="30" fill="#34372b" text-anchor="start">A model name alone does not establish these details.</text><text x="70" y="1130" font-size="24" fill="#8b8f80" text-anchor="start">Original explanatory workflow · Modern LLM Architectures</text></g></svg>