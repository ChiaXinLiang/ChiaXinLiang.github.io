75 1080.0,793.75" fill="none" stroke="#ae922e" stroke-width="7"/><text x="230" y="325" font-size="27" fill="#5d7e45" text-anchor="start">Full history: B = cT</text><text x="635" y="695" font-size="27" fill="#ba7854" text-anchor="start">Window: B = c min(T, w) ≤ 128 MiB</text><text x="635" y="830" font-size="27" fill="#ae922e" text-anchor="start">Recurrent: B = R = 64 MiB</text><text x="65" y="1040" font-size="27" fill="#34372b" text-anchor="start">c = 128 KiB per retained position; w = 1,024 positions</text><text x="65" y="1090" font-size="27" fill="#34372b" text-anchor="start">Fixed recurrent state is an illustrative separate design.</text><text x="65" y="1150" font-size="24" fill="#8b8f80" text-anchor="start">Original plot of explicitly hypothetical state equations</text></g></svg>