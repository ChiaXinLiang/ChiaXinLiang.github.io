<text x="50" y="58" text-anchor="start" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17334a">State-space dynamics connect continuous decay to token memory</text>
<text x="50" y="100" text-anchor="start" font-family="Arial,sans-serif" font-size="21" font-weight="400" fill="#536579">Discretization determines the transition; write and read maps determine accessible information</text>
<text x="85" y="190" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Continuous: dh/dt = Ah + Bu</text>
