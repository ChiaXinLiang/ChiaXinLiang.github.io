<text x="100" y="545" text-anchor="start" font-family="Arial,sans-serif" font-size="23" font-weight="400" fill="#17334a">Discrete samples depend on Δ and method</text>
<rect x="790" y="245" width="400" height="250" rx="10" fill="#e4f2ff" stroke="#367bb5" stroke-width="2"/>
<text x="825" y="300" text-anchor="start" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#17334a">Retained state h</text>
<text x="825" y="360" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#17334a">Ā: evolution</text>
<text x="825" y="415" text-anchor="start" font-family="Arial,sans-serif" font-size="26" font-weight="400" fill="#17334a">B̄: write   C: read</text>
<path d="M670 365L780 365" stroke="#367bb5" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text x="100" y="685" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Fixed coefficients → lag-only convolution kernel</text>
<text x="100" y="745" text-anchor="start" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#17334a">Input-dependent coefficients → selective recurrence</text>
<rect x="50" y="815" width="1300" height="145" rx="10" fill="#fff8dc" stroke="#d4b359" stroke-width="2"/>
<text x="75" y="852" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Zero-order hold uses Ā = exp(ΔA) and an input integral; Euler and bilinear rules differ.</text>
<text x="75" y="883" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">Fixed-system stability requires assumptions; input-dependent products need separate reasoning.</text>
<text x="75" y="914" text-anchor="start" font-family="Arial,sans-serif" font-size="22" font-weight="400" fill="#17334a">The decay curve is a conceptual dynamics example, not sequence-model quality evidence.</text>
