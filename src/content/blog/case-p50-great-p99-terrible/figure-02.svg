<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g transform="translate(102 0) scale(0.83)"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Rare long jobs affect short jobs</text><text x="90" y="162" font-size="28" fill="#55584a">M/G/1 toy model · 5 arrivals per second</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Service mixture</text><text x="125" y="340" font-size="28">99% at 0.1 s · 1% at 5 s</text><text x="125" y="398" font-size="28" font-weight="700">Mean service = 0.149 s</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">Second moment</text><text x="125" y="585" font-size="28">0.99 × 0.1² + 0.01 × 5²</text><text x="125" y="643" font-size="28" font-weight="700">E[S²] = 0.2599 s²</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Mean queue wait</text><text x="125" y="830" font-size="28">λ E[S²] ÷ [2(1 − ρ)]</text><text x="125" y="888" font-size="28" font-weight="700">About 2.55 seconds — not a p99 claim</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">AI Performance · case-8</text></g></g><rect x="60" y="996" width="1080" height="156" rx="12" fill="#e7edd9"/><text x="85" y="1033" font-family="Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="bold" fill="#33362a">Mean queue wait = λ E[S²] / [2(1−ρ)]</text><text x="85" y="1080" font-family="Helvetica Neue, Arial, sans-serif" font-size="25" font-weight="normal" fill="#33362a">ρ = 0.745; λ = 5/s; E[S²] = 0.2599 s² → 2.55 s</text><text x="85" y="1122" font-family="Helvetica Neue, Arial, sans-serif" font-size="23" font-weight="normal" fill="#33362a">FCFS M/G/1 assumptions; this mean is not a production p99</text></svg>