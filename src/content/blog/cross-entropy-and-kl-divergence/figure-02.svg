<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200"><rect width="1200" height="1200" fill="#fdfbf4"/><g font-family="Helvetica Neue,Arial,sans-serif" fill="#33362a"><text x="90" y="105" font-size="43" font-weight="700">Perplexity is an exponential</text><text x="90" y="162" font-size="28" fill="#55584a">Three illustrative next-token probabilities</text><rect x="90" y="235" width="1020" height="210" rx="22" fill="#e7edd9"/><text x="125" y="283" font-size="30" font-weight="700">Observed probabilities</text><text x="125" y="340" font-size="28">0.5 · 0.25 · 0.125</text><text x="125" y="398" font-size="28" font-weight="700">Negative logs: 0.6931 · 1.3863 · 2.0794</text><rect x="90" y="480" width="1020" height="210" rx="22" fill="#f0ddd0"/><text x="125" y="528" font-size="30" font-weight="700">Average log loss</text><text x="125" y="585" font-size="28">(0.6931 + 1.3863 + 2.0794) ÷ 3</text><text x="125" y="643" font-size="28" font-weight="700">1.3863 nats per token</text><rect x="90" y="725" width="1020" height="210" rx="22" fill="#f7ecd2"/><text x="125" y="773" font-size="30" font-weight="700">Perplexity</text><text x="125" y="830" font-size="28">exp(1.3863)</text><text x="125" y="888" font-size="28" font-weight="700">4 — not a factual-correctness score</text><text x="90" y="1020" font-size="24" fill="#75786a">Original explanatory figure · assumptions stated in article</text><path d="M90 1080H1110" stroke="#d8d4c4" stroke-width="3"/><text x="90" y="1135" font-size="28" font-weight="700">LLM Basics · stat-4</text></g></svg>