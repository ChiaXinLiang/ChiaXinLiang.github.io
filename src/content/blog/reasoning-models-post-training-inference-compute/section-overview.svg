<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840" role="img">
<title>Reasoning Models: Architecture, Post-Training, and Inference-Time Compute</title>
<rect width="1200" height="840" fill="#faf8f1"/>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#7545c8"/></marker></defs>
<text x="44" y="58" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#252a20">Reasoning Models</text>
<text x="44" y="92" font-family="Arial,sans-serif" font-size="20" fill="#555b4b">Method, execution, and verification</text>
<rect x="44" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="162" r="20" fill="#7545c8"/>
<text x="78" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">1</text>
<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Identify the base network</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Attention, state, and expert structure</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">define computation</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Reasoning is not established by a new layer</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">name alone</text>
<rect x="624" y="125" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="162" r="20" fill="#7545c8"/>
<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Train desired behavior</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Supervised examples and reinforcement</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">learning shape outputs</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Objectives, rewards, and data must be</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">distinguished</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Spend inference work</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Longer generation or multiple candidates</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">use more resources</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Extra tokens and search do not guarantee</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">better answers</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Evaluate verified results</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Accuracy, calibration, latency, and</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">resource use</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Comparison requires matched budgets and task</text>
<text x="68" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">conditions</text>
