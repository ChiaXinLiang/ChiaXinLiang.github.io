<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
  <rect width="1200" height="1200" fill="#fdfbf4"/>

  <text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">1 chart explains the GDDR7 bet</text>
  <text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Roofline of Rubin CPX: 30 PF NVFP4 over 2.1 TB/s GDDR7</text>

  <!-- axes -->
  <line x1="200" y1="280" x2="200" y2="880" stroke="#d8d4c4" stroke-width="3"/>
  <line x1="200" y1="880" x2="1040" y2="880" stroke="#d8d4c4" stroke-width="3"/>
  <text x="90" y="262" font-size="24" fill="#75786a">Attainable TFLOP/s (log scale)</text>
  <text x="620" y="950" text-anchor="middle" font-size="24" fill="#75786a">Arithmetic intensity (FLOPs per byte, log scale)</text>

  <!-- x ticks -->
  <text x="200" y="914" text-anchor="middle" font-size="24" fill="#a3a08f">1</text>
  <text x="480" y="914" text-anchor="middle" font-size="24" fill="#a3a08f">10&#178;</text>
  <text x="760" y="914" text-anchor="middle" font-size="24" fill="#a3a08f">10&#8308;</text>
  <text x="1040" y="914" text-anchor="middle" font-size="24" fill="#a3a08f">10&#8310;</text>
  <!-- y ticks -->
  <text x="185" y="888" text-anchor="end" font-size="24" fill="#a3a08f">1</text>
  <text x="185" y="680" text-anchor="end" font-size="24" fill="#a3a08f">10&#178;</text>
  <text x="185" y="472" text-anchor="end" font-size="24" fill="#a3a08f">10&#8308;</text>

  <!-- ridge vertical dashed -->
  <line x1="782" y1="414" x2="782" y2="820" stroke="#e8e4d7" stroke-width="3" stroke-dasharray="8 8"/>

  <!-- compute roof -->
  <line x1="639" y1="414" x2="1040" y2="414" stroke="#33362a" stroke-width="5"/>
  <text x="600" y="396" font-size="24" fill="#33362a">compute roof: 30 PF NVFP4</text>

  <!-- HBM slope (dashed sage) -->
  <line x1="200" y1="740" x2="639" y2="414" stroke="#5b7c46" stroke-width="4" stroke-dasharray="10 8"/>
  <!-- GDDR7 slope (terracotta) -->
  <line x1="200" y1="847" x2="782" y2="414" stroke="#b06a4e" stroke-width="5"/>

  <!-- legend top-left -->
  <line x1="240" y1="296" x2="300" y2="296" stroke="#b06a4e" stroke-width="5"/>
  <text x="316" y="304" font-size="24" fill="#55584a">GDDR7 &#183; 2.1 TB/s (CPX)</text>
  <line x1="240" y1="338" x2="300" y2="338" stroke="#5b7c46" stroke-width="4" stroke-dasharray="10 8"/>
  <text x="316" y="346" font-size="24" fill="#55584a">HBM4 &#183; ~22 TB/s</text>

  <!-- decode points -->
  <circle cx="284" cy="784" r="10" fill="#b04a3a"/>
  <circle cx="284" cy="678" r="10" fill="#5b7c46"/>
  <!-- 10x double arrow -->
  <line x1="284" y1="700" x2="284" y2="762" stroke="#55584a" stroke-width="3"/>
  <polygon points="284,692 277,706 291,706" fill="#55584a"/>
  <polygon points="284,770 277,756 291,756" fill="#55584a"/>
  <text x="270" y="744" text-anchor="end" font-size="24" font-weight="bold" fill="#55584a">10x</text>

  <!-- decode caption -->
  <line x1="284" y1="796" x2="284" y2="844" stroke="#d8d4c4" stroke-width="2"/>
  <text x="320" y="866" font-size="24" fill="#55584a">decode, batch 1: ~4 FLOPs/byte</text>

  <!-- ridge label -->
  <text x="795" y="600" font-size="24" fill="#75786a">ridge &#8776; 14,300</text>
  <text x="795" y="632" font-size="24" fill="#75786a">FLOPs/byte</text>

  <!-- prefill point -->
  <circle cx="916" cy="414" r="11" fill="#c9973b"/>
  <text x="920" y="456" text-anchor="middle" font-size="26" font-weight="bold" fill="#7a5a20">32K prefill, payload-only</text>
  <text x="920" y="488" text-anchor="middle" font-size="24" fill="#75786a">&#8776;131,000 FLOPs/byte</text>
  <text x="920" y="520" text-anchor="middle" font-size="24" fill="#75786a">weight-only idealization</text>

  <!-- divider + footer -->
  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Efficient AI &#183; chip-2</text>
  <text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">spend bytes wisely</text>
<g id="equation-mechanism" font-family="Helvetica Neue, Arial, sans-serif"><rect x="75" y="958" width="1050" height="66" fill="#fdfbf4"/><text x="600" y="982" text-anchor="middle" font-size="24" font-weight="600" fill="#33362a">I ≈ 2PT / (Ps + Dactivation); ridge = C / β</text><text x="600" y="1013" text-anchor="middle" font-size="21" fill="#75786a">T prompt rows reuse P weights; omitted traffic shifts the crossing</text></g></svg>
