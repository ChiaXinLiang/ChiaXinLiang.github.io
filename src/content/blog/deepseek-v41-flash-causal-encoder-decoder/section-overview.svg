<text x="658" y="170" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">2</text>
<text x="692" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Project global memory</text>
<text x="648" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Decoder global KV comes from final encoder</text>
<text x="648" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">states</text>
<text x="648" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">State provenance differs from ordinary per-</text>
<text x="648" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">layer self-attention</text>
<rect x="624" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="658" cy="502" r="20" fill="#7545c8"/>
<text x="658" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">3</text>
<text x="692" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Generate with decoder work</text>
<text x="648" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Twenty decoder layers join the causal</text>
<text x="648" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">encoder</text>
<text x="648" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">The card reports different active work in</text>
<text x="648" y="711" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">prefill and decode</text>
<rect x="44" y="465" width="552" height="300" rx="16" fill="white" stroke="#c6b5df" stroke-width="2"/>
<circle cx="78" cy="502" r="20" fill="#7545c8"/>
<text x="78" y="510" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" fill="white">4</text>
<text x="112" y="508" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Measure the request mix</text>
<text x="68" y="578" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Input-heavy and output-heavy workloads</text>
<text x="68" y="607" font-family="Arial,sans-serif" font-size="21" fill="#252a20">differ</text>
<text x="68" y="684" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Reported parameter activity is not a direct</text>
