<text x="112" y="168" font-family="Arial,sans-serif" font-weight="700" font-size="23" fill="#252a20">Process a causal prefix</text>
<text x="68" y="238" font-family="Arial,sans-serif" font-size="21" fill="#252a20">Twenty encoder layers produce</text>
<text x="68" y="267" font-family="Arial,sans-serif" font-size="21" fill="#252a20">representations</text>
<text x="68" y="344" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">Causal encoding differs from unrestricted</text>
<text x="68" y="371" font-family="Arial,sans-serif" font-size="19" fill="#555b4b">bidirectional encoding</text>
