<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <rect width="1200" height="1200" fill="#fdfbf4"/>
  <text x="90" y="100" font-family="Helvetica Neue, Arial, sans-serif" font-size="52" font-weight="bold" fill="#33362a">2 Bytes vs 16 Bytes per Parameter</text>
  <text x="90" y="156" font-family="Helvetica Neue, Arial, sans-serif" font-size="30" fill="#75786a">Why serving fits where full fine-tuning does not</text>

  <!-- scale: 1 byte = 46 px, bars start x=340 -->
  <g font-family="Helvetica Neue, Arial, sans-serif">
    <!-- inference bar -->
    <text x="320" y="308" text-anchor="end" font-size="28" fill="#55584a">Inference</text>
    <text x="320" y="340" text-anchor="end" font-size="24" fill="#75786a">FP16</text>
    <rect x="340" y="280" width="92" height="80" fill="#5b7c46"/>
    <text x="450" y="330" font-size="28" font-weight="bold" fill="#33362a">2 B/param &#8594; 16 GB for Llama-3-8B</text>

    <!-- training bar -->
    <text x="320" y="458" text-anchor="end" font-size="28" fill="#55584a">Training</text>
    <text x="320" y="490" text-anchor="end" font-size="24" fill="#75786a">Adam, mixed</text>
    <rect x="340" y="430" width="92" height="80" fill="#5b7c46"/>
    <rect x="432" y="430" width="92" height="80" fill="#a8bf92"/>
    <rect x="524" y="430" width="184" height="80" fill="#c9973b"/>
    <rect x="708" y="430" width="184" height="80" fill="#b06a4e"/>
    <rect x="892" y="430" width="184" height="80" fill="#8a5138"/>
    <text x="340" y="550" font-size="28" font-weight="bold" fill="#33362a">16 B/param &#8594; 128 GB for the same 8B model</text>
  </g>

  <!-- legend -->
  <g font-family="Helvetica Neue, Arial, sans-serif" font-size="27">
    <rect x="90" y="640" width="36" height="36" fill="#5b7c46"/>
    <text x="145" y="667" fill="#33362a">FP16 weights &#8212; 2 B</text>
    <rect x="90" y="700" width="36" height="36" fill="#a8bf92"/>
    <text x="145" y="727" fill="#33362a">FP16 gradients &#8212; 2 B</text>
    <rect x="90" y="760" width="36" height="36" fill="#c9973b"/>
    <text x="145" y="787" fill="#33362a">FP32 master weights &#8212; 4 B</text>
    <rect x="620" y="640" width="36" height="36" fill="#b06a4e"/>
    <text x="675" y="667" fill="#33362a">Adam momentum (FP32) &#8212; 4 B</text>
    <rect x="620" y="700" width="36" height="36" fill="#8a5138"/>
    <text x="675" y="727" fill="#33362a">Adam variance (FP32) &#8212; 4 B</text>
  </g>

  <text x="90" y="890" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Optimizer state alone is 12 B/param, six times the model itself.</text>
  <text x="90" y="924" font-family="Helvetica Neue, Arial, sans-serif" font-size="26" fill="#75786a">Activations come on top, scaling with batch &#215; sequence length.</text>

  <line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
  <text x="90" y="1078" font-family="Helvetica Neue, Arial, sans-serif" font-size="24" fill="#a3a08f">Following Rajbhandari et al. (2019), ZeRO</text>
  <text x="90" y="1140" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" font-weight="bold" fill="#a3a08f">AI Performance &#183; gpumem-1</text>
  <text x="1120" y="1140" text-anchor="end" font-family="Helvetica Neue, Arial, sans-serif" font-size="28" fill="#a3a08f">training costs 8&#215; the bytes</text>
</svg>
