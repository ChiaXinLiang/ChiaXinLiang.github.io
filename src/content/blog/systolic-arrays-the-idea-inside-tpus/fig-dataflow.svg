<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" font-family="Helvetica Neue, Arial, sans-serif">
<rect width="1200" height="1200" fill="#fdfbf4"/>
<text x="600" y="100" text-anchor="middle" font-size="52" font-weight="bold" fill="#33362a">Inside a Systolic Array</text>
<text x="600" y="156" text-anchor="middle" font-size="30" fill="#75786a">Weights sit still; data pulses through the grid</text>

<!-- legend -->
<rect x="140" y="228" width="34" height="34" rx="6" fill="#f7ecd2" stroke="#c9973b" stroke-width="2"/>
<text x="188" y="253" font-size="24" fill="#55584a">weights (stay put)</text>
<line x1="470" y1="245" x2="520" y2="245" stroke="#5b7c46" stroke-width="5"/>
<polygon points="520,237 536,245 520,253" fill="#5b7c46"/>
<text x="550" y="253" font-size="24" fill="#55584a">inputs (flow right)</text>
<line x1="850" y1="245" x2="900" y2="245" stroke="#b06a4e" stroke-width="5"/>
<polygon points="900,237 916,245 900,253" fill="#b06a4e"/>
<text x="930" y="253" font-size="24" fill="#55584a">sums (flow down)</text>

<!-- input chips row 1 (center y 360) -->
<rect x="164" y="332" width="56" height="56" rx="6" fill="none" stroke="#a8bf92" stroke-width="2" stroke-dasharray="6,6"/>
