<text x="270" y="520" text-anchor="middle" font-size="26" font-weight="bold" fill="#33362a">x2</text>
<!-- input chips row 3 (center y 660) -->
<rect x="114" y="632" width="56" height="56" rx="6" fill="none" stroke="#a8bf92" stroke-width="2" stroke-dasharray="6,6"/>
