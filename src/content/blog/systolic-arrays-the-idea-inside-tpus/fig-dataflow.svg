<polygon points="687,748 695,760 703,748" fill="#b06a4e"/>
<line x1="885" y1="712" x2="885" y2="748" stroke="#b06a4e" stroke-width="5"/>
<polygon points="877,748 885,760 893,748" fill="#b06a4e"/>

<!-- accumulator bar -->
<rect x="430" y="764" width="530" height="60" rx="8" fill="#f0ddd0" stroke="#b06a4e" stroke-width="2.5"/>
<text x="695" y="802" text-anchor="middle" font-size="26" fill="#8a5138">accumulators: finished sums exit here</text>

<!-- annotations -->
<text x="600" y="884" text-anchor="middle" font-size="26" fill="#55584a">each cell multiplies, adds, and passes both values on;</text>
<text x="600" y="922" text-anchor="middle" font-size="26" fill="#55584a">rows start 1 cycle apart, so operands meet in step</text>

<line x1="90" y1="1030" x2="1110" y2="1030" stroke="#e8e4d7" stroke-width="3"/>
<text x="600" y="1078" text-anchor="middle" font-size="24" fill="#a3a08f">Redrawn from Jouppi et al. (2017), Fig. 4</text>
<text x="90" y="1140" font-size="28" font-weight="bold" fill="#a3a08f">Comp Arch · par-3</text>
<text x="1120" y="1140" text-anchor="end" font-size="28" fill="#a3a08f">compute to a heartbeat</text>
</svg>
